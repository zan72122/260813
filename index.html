<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>さらさら！ ピンク湖のしおづくり</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#dfe9ee" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f5e6ea'/%3E%3Crect x='4' y='5' width='11' height='9' rx='1.5' fill='%23ffa8c6'/%3E%3Crect x='17' y='5' width='11' height='9' rx='1.5' fill='%23ff74a4'/%3E%3Crect x='4' y='17' width='24' height='10' rx='1.5' fill='%23ff4fa0'/%3E%3C/svg%3E"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="しょっぱいお水を浅い池に入れて、ピンクの池をつくる指いっぽんの遊び。" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #cfdde6;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* 読み込み中。文字は出さず、水滴がふくらむ動きだけで待ち時間を伝える。 */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #eaf1f5 0%, #f6e2e8 100%);
        transition: opacity 0.7s ease;
        z-index: 10;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .drop {
        width: 78px;
        height: 78px;
        border-radius: 50% 50% 50% 8%;
        transform: rotate(45deg);
        background: radial-gradient(circle at 34% 30%, #ffd3e0 0%, #f0699a 55%, #d1275c 100%);
        box-shadow: 0 10px 26px rgba(200, 60, 110, 0.32);
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: rotate(45deg) scale(0.86);
          opacity: 0.85;
        }
        50% {
          transform: rotate(45deg) scale(1.08);
          opacity: 1;
        }
      }

      /* WebGL が使えない端末向けの、静かな案内 */
      #fallback {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
        color: #7a4a5c;
        background: #f6e2e8;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
    </div>
    <div id="boot"><div class="drop"></div></div>
    <div id="fallback">
      <p>この端末では 3D を表示できませんでした。<br />Safari を最新にすると遊べます。</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
