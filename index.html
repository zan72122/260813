<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120a1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="にじビスマス工房" />
    <meta
      name="description"
      content="とろっ！カクカク！にじビスマス工房 — 金属をとかして、ひやして、カクカクの虹の石をつくる、4さいからのゆびあそび。"
    />
    <title>とろっ！カクカク！にじビスマス工房</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23150c22'/%3E%3Cpath d='M6 20h20l-4 6H10z' fill='%23ff9a3c'/%3E%3Cpath d='M9 8h14v4h-4v4h-6v-4H9z' fill='%2364e8ff'/%3E%3Cpath d='M12 12h8v4h-3v3h-2v-3h-3z' fill='%23ff7ae0'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- 画面まわりのかざり（操作じゃまをしない） -->
      <div id="vignette" aria-hidden="true"></div>

      <!-- すすみぐあいの点（もじなし） -->
      <div id="steps" aria-hidden="true"></div>

      <!-- ゆびのヒント -->
      <div id="hint" class="hint" aria-hidden="true">
        <div class="hint-ring"></div>
        <svg class="hint-hand" viewBox="0 0 64 84">
          <path
            d="M22 44V16a6 6 0 0 1 12 0v20h2V10a6 6 0 0 1 12 0v26h2V20a6 6 0 0 1 12 0v34c0 16-10 28-26 28C22 82 12 72 12 58V40a6 6 0 0 1 10-4z"
            fill="#fff"
            stroke="#2a1740"
            stroke-width="3"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <!-- いくつ入れたか の点 -->
      <div id="count" class="count" aria-hidden="true"></div>

      <!-- おおきなことば（たまに出るだけ） -->
      <div id="word" class="word" aria-hidden="true"></div>

      <!-- できばえの星 -->
      <div id="stars" class="stars" aria-hidden="true"></div>

      <!-- タイトル -->
      <div id="title" class="screen">
        <h1 class="title-jp">
          <span class="t1">とろっ！</span><span class="t2">カクカク！</span
          ><span class="t3">にじビスマス</span>
        </h1>
        <button id="startBtn" class="bigbtn" type="button" aria-label="はじめる">
          <svg viewBox="0 0 100 100" class="bigbtn-ico">
            <circle cx="50" cy="50" r="46" class="bb-bg" />
            <path d="M40 30l30 20-30 20z" class="bb-fg" />
          </svg>
        </button>
      </div>

      <!-- したのボタン列 -->
      <div id="tools" class="tools">
        <button id="codexBtn" class="toolbtn" type="button" aria-label="ずかん">
          <svg viewBox="0 0 64 64">
            <rect x="10" y="10" width="44" height="44" rx="6" class="tb-line" />
            <rect x="16" y="16" width="14" height="14" rx="3" class="tb-dot" />
            <rect x="34" y="16" width="14" height="14" rx="3" class="tb-dot2" />
            <rect x="16" y="34" width="14" height="14" rx="3" class="tb-dot3" />
            <rect x="34" y="34" width="14" height="14" rx="3" class="tb-dot4" />
          </svg>
        </button>
        <button id="againBtn" class="toolbtn accent" type="button" aria-label="もういちど">
          <svg viewBox="0 0 64 64">
            <path
              d="M32 14a18 18 0 1 0 17 23"
              fill="none"
              class="tb-stroke"
              stroke-width="7"
              stroke-linecap="round"
            />
            <path d="M32 4v20l16-10z" class="tb-dot" />
          </svg>
        </button>
        <button id="soundBtn" class="toolbtn" type="button" aria-label="おと">
          <svg viewBox="0 0 64 64">
            <path d="M14 26h10l12-10v32L24 38H14z" class="tb-dot" />
            <path
              d="M42 24a12 12 0 0 1 0 16"
              fill="none"
              class="tb-stroke snd-wave"
              stroke-width="6"
              stroke-linecap="round"
            />
            <path class="snd-slash" d="M44 20l14 24" stroke-width="6" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <!-- ずかん -->
      <div id="codex" class="screen hidden">
        <div id="codexMeter" class="codex-meter" aria-hidden="true"><i></i></div>
        <div id="codexGrid" class="codex-grid"></div>
        <button id="codexClose" class="bigbtn small" type="button" aria-label="とじる">
          <svg viewBox="0 0 100 100" class="bigbtn-ico">
            <circle cx="50" cy="50" r="46" class="bb-bg" />
            <path
              d="M34 34l32 32M66 34L34 66"
              class="bb-stroke"
              stroke-width="10"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <noscript>
        <p style="color: #fff; padding: 2rem">JavaScript をオンにしてあそんでね。</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
