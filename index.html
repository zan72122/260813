<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>スクランブルこうさてん</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; position: fixed;
    background: #141b2e;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "BIZ UDGothic", "Yu Gothic", sans-serif;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #scene { position: absolute; inset: 0; display: block; }

  /* ---- message bubble ---- */
  #bubble {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 50%; transform: translateX(-50%) scale(0);
    max-width: 92vw;
    background: rgba(255,255,255,0.96); color: #333;
    border-radius: 26px; padding: 10px 22px;
    font-size: clamp(17px, 4.6vw, 26px); font-weight: 700;
    text-align: center; line-height: 1.35;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    transition: transform 0.28s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none; z-index: 10;
  }
  #bubble.show { transform: translateX(-50%) scale(1); }

  /* ---- bottom control bar ---- */
  #bar {
    position: absolute; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    display: flex; justify-content: center; align-items: flex-end;
    gap: clamp(8px, 2.5vw, 20px);
    z-index: 10; pointer-events: none;
  }
  .btn {
    pointer-events: auto;
    border: none; border-radius: 22px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: inherit; font-weight: 800; color: #444;
    width: clamp(64px, 17vw, 92px); height: clamp(64px, 17vw, 92px);
    font-size: clamp(10px, 2.6vw, 14px);
    transition: transform 0.12s;
  }
  .btn:active { transform: scale(0.9); }
  .btn .ico { font-size: clamp(26px, 7.5vw, 40px); line-height: 1.15; }
  .btn[disabled] { opacity: 0.35; }

  /* the big signal button */
  #goBtn {
    width: clamp(84px, 23vw, 120px); height: clamp(84px, 23vw, 120px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #555b66, #23262e 75%);
    color: #fff;
  }
  #goBtn .lamp {
    width: 58%; height: 58%; border-radius: 50%;
    background: #802626; box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(24px, 7vw, 38px);
    transition: background 0.2s, box-shadow 0.2s;
  }
  #goBtn.red .lamp { background: radial-gradient(circle at 40% 35%, #ff7a70, #d32f2f); box-shadow: 0 0 22px rgba(255,70,60,0.8); }
  #goBtn.green .lamp { background: radial-gradient(circle at 40% 35%, #7dffa0, #17b551); box-shadow: 0 0 26px rgba(60,255,130,0.9); }
  #goBtn.pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { transform: scale(1); } 50% { transform: scale(1.09); }
  }
  #goBtn .cap { font-size: clamp(10px, 2.6vw, 14px); margin-top: 2px; }

  /* green-length toggle shows a short or long bar */
  #lenBtn .bar-wrap {
    width: 70%; height: 10px; border-radius: 6px; background: #d7d7d7;
    margin: 5px 0 3px; overflow: hidden;
  }
  #lenBtn .bar { height: 100%; border-radius: 6px; background: #21c15c; width: 40%; transition: width 0.3s; }
  #lenBtn.long .bar { width: 100%; }

  #resetBtn.pulse, #goBtn.attn { animation: pulse 1s ease-in-out infinite; }

  /* start overlay (needed for first touch / audio unlock) */
  #start {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(10, 14, 28, 0.82);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; gap: 18px;
  }
  #start h1 { font-size: clamp(26px, 7vw, 44px); font-weight: 900; text-shadow: 0 4px 14px rgba(0,0,0,0.6); }
  #start p { font-size: clamp(15px, 4vw, 20px); opacity: 0.9; }
  #startBtn {
    border: none; border-radius: 40px; padding: 18px 46px;
    font-family: inherit; font-size: clamp(20px, 5.5vw, 30px); font-weight: 900;
    background: linear-gradient(180deg, #ffd54f, #ffb300); color: #5d3a00;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    animation: pulse 1.4s ease-in-out infinite;
  }
  #start.hidden, #bubble.hidden { display: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="bubble" class=""></div>

<div id="bar">
  <button class="btn" id="pauseBtn"><span class="ico">⏸️</span><span>とめる</span></button>
  <button class="btn" id="goBtn"><span class="lamp">🚶</span><span class="cap">しんごう</span></button>
  <button class="btn" id="resetBtn"><span class="ico">↩️</span><span>もどす</span></button>
  <button class="btn" id="lenBtn"><span style="font-size:clamp(10px,2.6vw,13px)">あおのながさ</span><span class="bar-wrap"><span class="bar"></span></span><span id="lenLabel">みじかい</span></button>
</div>

<div id="start">
  <h1>スクランブル<br>こうさてん</h1>
  <p>ひとが いっぱい わたるよ</p>
  <button id="startBtn">はじめる</button>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
