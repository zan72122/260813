<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>チタンいろそだて</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%234a9fb8'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0e12;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    position: fixed; width: 100%;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font-size: 0;
  }

  .btn {
    position: absolute;
    width: 92px; height: 92px;
    border-radius: 50%;
    border: none;
    background: rgba(240, 246, 252, 0.16);
    box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 0 0 2.5px rgba(255,255,255,0.55);
    pointer-events: auto;
    display: none;
    align-items: center; justify-content: center;
    padding: 0;
    opacity: 0;
    transition: opacity 0.4s ease;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .btn.show { display: flex; opacity: 1; animation: pulse 1.8s ease-in-out infinite; }
  .btn svg { width: 52px; height: 52px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4)); }
  .btn:active { background: rgba(240, 246, 252, 0.34); animation: none; transform: scale(0.94); }

  #btnRaise { right: calc(18px + env(safe-area-inset-right)); top: calc(20px + env(safe-area-inset-top)); }
  #btnAgain { left: calc(18px + env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom)); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 0 0 2.5px rgba(255,255,255,0.55), 0 0 0 0 rgba(255,255,255,0.45); }
    55%      { box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 0 0 2.5px rgba(255,255,255,0.55), 0 0 0 22px rgba(255,255,255,0.0); }
  }

  /* wordless hint pointer: a tapping / dragging ring */
  #hint {
    position: fixed; left: 0; top: 0;
    width: 66px; height: 66px; margin: -33px 0 0 -33px;
    pointer-events: none;
    display: none;
  }
  #hint.show { display: block; }
  #hint .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.95);
    box-shadow: 0 0 14px rgba(255,255,255,0.6), inset 0 0 10px rgba(255,255,255,0.35);
  }
  #hint .dot {
    position: absolute; left: 50%; top: 50%;
    width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
  }
  #hint.tap .ring { animation: hintTap 1.5s ease-in-out infinite; }
  #hint.tap .dot  { animation: hintTapDot 1.5s ease-in-out infinite; }
  @keyframes hintTap {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    30%      { transform: scale(0.62); opacity: 1; }
    60%      { transform: scale(1.25); opacity: 0.35; }
  }
  @keyframes hintTapDot {
    0%, 100% { transform: scale(1); }
    30%      { transform: scale(0.7); }
  }
  #hint.drag { animation: hintDrag 2.4s ease-in-out infinite; }
  @keyframes hintDrag {
    0%, 100% { transform: translateX(-46px); }
    50%      { transform: translateX(46px); }
  }
  #hint.hold .ring { animation: hintHold 2.2s ease-in-out infinite; }
  #hint.hold .dot  { animation: hintHoldDot 2.2s ease-in-out infinite; }
  @keyframes hintHold {
    0%   { transform: scale(1); opacity: 0.9; }
    20%  { transform: scale(0.62); opacity: 1; }
    75%  { transform: scale(0.62); opacity: 1; }
    100% { transform: scale(1.2); opacity: 0.3; }
  }
  @keyframes hintHoldDot {
    0%   { transform: scale(1); }
    20%  { transform: scale(0.72); }
    75%  { transform: scale(0.72); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<div id="ui">
  <button class="btn" id="btnRaise" aria-label="raise">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3.2 L19.2 11 H14.6 V20.4 H9.4 V11 H4.8 Z" fill="#ffffff"/>
    </svg>
  </button>
  <button class="btn" id="btnAgain" aria-label="again">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 5 a7 7 0 1 1 -6.6 4.7" fill="none" stroke="#ffffff" stroke-width="3.1" stroke-linecap="round"/>
      <path d="M5.5 3.2 L5.4 9.9 L11.6 8.1 Z" fill="#ffffff"/>
    </svg>
  </button>
</div>
<div id="hint"><div class="ring"></div><div class="dot"></div></div>
<script src="app.js"></script>
</body>
</html>
