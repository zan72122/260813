<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f2f4f8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="description" content="偏光レインボー工場 — とうめいなものを まわすと にじが でてくる" />
<title>偏光レインボー工場</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23222' stroke-width='4'/><circle cx='16' cy='16' r='7' fill='%23ff5fd2'/></svg>" />
<style>
  :root {
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --ink: #1a1c22;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0e1014;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #app { position: fixed; inset: 0; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- overlay ---------- */
  #ui { position: absolute; inset: 0; pointer-events: none; }

  /* animated finger hint */
  #hint {
    position: absolute; left: 0; top: 0; width: 96px; height: 96px;
    margin: -48px 0 0 -48px; opacity: 0;
    transition: opacity .45s ease; will-change: transform, opacity;
  }
  #hint.on { opacity: 1; }
  #hint .halo {
    position: absolute; inset: 12px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.85);
    box-shadow: 0 0 18px rgba(255,255,255,.6), inset 0 0 14px rgba(255,255,255,.45);
    animation: pulse 1.9s ease-in-out infinite;
  }
  #hint svg { position: absolute; left: 30px; top: 26px; width: 46px; height: 56px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  @keyframes pulse {
    0%,100% { transform: scale(.82); opacity: .55; }
    50%     { transform: scale(1.12); opacity: 1; }
  }
  #hint.mode-circle { animation: orbit 2.6s linear infinite; }
  @keyframes orbit {
    0%   { transform: translate(38px,0) }
    25%  { transform: translate(0,38px) }
    50%  { transform: translate(-38px,0) }
    75%  { transform: translate(0,-38px) }
    100% { transform: translate(38px,0) }
  }
  #hint.mode-tap  { animation: tapper 1.5s ease-in-out infinite; }
  @keyframes tapper { 0%,100%{ transform: scale(1) } 45%{ transform: scale(.72) } }
  #hint.mode-press { animation: presser 2.2s ease-in-out infinite; }
  @keyframes presser {
    0%   { transform: translate(0,0) scale(1) }
    30%  { transform: translate(0,6px) scale(.8) }
    60%  { transform: translate(26px,-14px) scale(.85) }
    100% { transform: translate(0,0) scale(1) }
  }

  /* big finale buttons */
  #choices {
    position: absolute; left: 0; right: 0;
    bottom: calc(18px + var(--safe-b));
    display: flex; gap: 26px; justify-content: center; align-items: flex-end;
    opacity: 0; transform: translateY(30px) scale(.9);
    transition: opacity .5s ease, transform .5s cubic-bezier(.2,1.3,.4,1);
  }
  #choices.on { opacity: 1; transform: none; pointer-events: auto; }
  .bigbtn {
    -webkit-appearance: none; appearance: none; border: 0; cursor: pointer;
    width: 108px; height: 108px; border-radius: 34px; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 40px; line-height: 1;
    color: #fff; background: rgba(30,32,40,.72);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.28);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .bigbtn:active { transform: scale(.92); }
  .bigbtn span.lbl { font-size: 14px; font-weight: 700; letter-spacing: .06em; opacity: .95; }
  #btn-again { background: linear-gradient(160deg, rgba(255,110,205,.92), rgba(150,80,235,.92)); }
  #btn-new   { background: linear-gradient(160deg, rgba(80,220,235,.92), rgba(70,130,240,.92)); }

  /* sound toggle */
  #sound {
    position: absolute; pointer-events: auto;
    top: calc(10px + var(--safe-t)); right: calc(10px + var(--safe-r));
    width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0;
    font-size: 24px; line-height: 1; color: #fff; cursor: pointer;
    background: rgba(28,30,38,.42); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
    opacity: .55; transition: opacity .2s, transform .12s;
  }
  #sound:active { transform: scale(.9); }

  /* stage dots — silent, wordless progress */
  #dots {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(12px + var(--safe-t)); display: flex; gap: 9px;
  }
  #dots i {
    display: block; width: 9px; height: 9px; border-radius: 50%;
    background: rgba(20,22,30,.20); transition: background .4s ease, transform .4s ease;
  }
  #dots i.done { background: rgba(20,22,30,.42); }
  #dots i.now  { background: #ff5fd2; transform: scale(1.5); box-shadow: 0 0 12px rgba(255,95,210,.8); }

  /* first-touch veil */
  #veil {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, #fdfdff 0%, #e8ecf4 60%, #d7dde8 100%);
    pointer-events: auto; transition: opacity .6s ease;
  }
  #veil.off { opacity: 0; pointer-events: none; }
  #veil .mark { width: 46vmin; height: 46vmin; max-width: 340px; max-height: 340px; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{ transform: scale(.94) } 50%{ transform: scale(1.03) } }

  @media (prefers-reduced-motion: reduce) {
    #hint, #hint .halo, #veil .mark { animation: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="ui">
    <div id="dots"><i></i><i></i><i></i><i></i><i></i></div>

    <div id="hint" aria-hidden="true">
      <div class="halo"></div>
      <svg viewBox="0 0 46 56" fill="none">
        <path d="M15 34V10a5 5 0 0 1 10 0v16" stroke="#fff" stroke-width="3.4" stroke-linecap="round" fill="rgba(255,255,255,.28)"/>
        <path d="M25 26v-4a4.5 4.5 0 0 1 9 0v14c0 9-5 16-13 16h-3c-6 0-9-4-11-9l-4-9a4 4 0 0 1 6.6-4.3L15 34"
              stroke="#fff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" fill="rgba(255,255,255,.28)"/>
      </svg>
    </div>

    <div id="choices">
      <button class="bigbtn" id="btn-again" aria-label="もういちど おなじの">🔁<span class="lbl">もういちど</span></button>
      <button class="bigbtn" id="btn-new" aria-label="あたらしいのを つくる">✨<span class="lbl">つぎのこ</span></button>
    </div>

    <button id="sound" aria-label="おと">🔔</button>
  </div>

  <div id="veil">
    <svg class="mark" viewBox="0 0 200 200" aria-label="タップしてはじめる">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff64d4"/><stop offset="35%" stop-color="#b166f0"/>
          <stop offset="65%" stop-color="#4fd6e8"/><stop offset="100%" stop-color="#ffd76a"/>
        </linearGradient>
      </defs>
      <circle cx="100" cy="100" r="74" fill="none" stroke="#22242c" stroke-width="15" stroke-linecap="round" stroke-dasharray="18 10"/>
      <circle cx="100" cy="100" r="52" fill="url(#g1)" opacity=".92"/>
      <circle cx="100" cy="100" r="52" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="3"/>
    </svg>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
