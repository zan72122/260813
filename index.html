<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171226" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="ゆびで おすと にじの わっかが ひろがる、ちいさなこどもの ひかり あそび" />
    <title>おして ひろがる にじのわ研究室</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23171226'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23ff8fc7' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%237ee8d8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ffd166'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <!-- 3D-ish scene (WebGL) -->
      <canvas id="scene" aria-hidden="true"></canvas>
      <!-- sparkles / particles (2D) -->
      <canvas id="fx" aria-hidden="true"></canvas>

      <!-- ランプ -->
      <button id="lamp" class="lamp" type="button" aria-label="ライト">
        <span class="lamp__glow" aria-hidden="true"></span>
        <svg class="lamp__svg" viewBox="0 0 120 96" aria-hidden="true">
          <path class="lamp__arm" d="M60 6 v20" />
          <path class="lamp__shade" d="M60 22 L96 74 Q60 90 24 74 Z" />
          <ellipse class="lamp__bulb" cx="60" cy="76" rx="17" ry="8" />
        </svg>
        <span class="lamp__label" id="lampLabel">ひかり</span>
      </button>

      <!-- ゆびの ヒント -->
      <div id="hint" class="hint" aria-hidden="true">
        <svg class="hint__hand" viewBox="0 0 64 64">
          <path
            d="M26 40V16a5 5 0 0 1 10 0v16h3v-6a4.5 4.5 0 0 1 9 0v6h.5a4.5 4.5 0 0 1 4.5 4.5V46c0 8-6 14-14 14h-6c-6 0-9-3-12-8l-7-11a4.6 4.6 0 0 1 6.8-6z"
          />
        </svg>
        <span class="hint__text" id="hintText">おして</span>
      </div>

      <!-- チャレンジ の おほし -->
      <div id="stars" class="stars" aria-hidden="true"></div>

      <!-- モード きりかえ -->
      <div id="modes" class="modes">
        <button class="chip is-on" type="button" data-mode="free" aria-label="じゆうモード">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="12" class="s1" />
            <circle cx="16" cy="16" r="7.5" class="s2" />
            <circle cx="16" cy="16" r="3" class="s3" />
          </svg>
          <span>じゆう</span>
        </button>
        <button class="chip" type="button" data-mode="challenge" aria-label="チャレンジモード">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path
              class="s4"
              d="M16 3l3.6 7.6 8.4 1.1-6.1 5.8 1.5 8.3L16 21.9 8.6 25.8l1.5-8.3L4 11.7l8.4-1.1z"
            />
          </svg>
          <span>チャレンジ</span>
        </button>
      </div>

      <!-- やりなおし -->
      <button id="again" class="again" type="button" aria-label="もういちど">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 6a10 10 0 1 0 9.4 6.6" />
          <path d="M26 4v9h-9" />
        </svg>
      </button>

      <!-- おおきさ (じゆうモード) -->
      <div id="sizeBar" class="sizebar">
        <button class="sizebtn" type="button" data-size="-1" aria-label="ちいさく">
          <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="8" /></svg>
        </button>
        <div class="sizebar__gauge" aria-hidden="true"><i id="sizeFill"></i></div>
        <button class="sizebtn" type="button" data-size="1" aria-label="おおきく">
          <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="16" /></svg>
        </button>
      </div>

      <!-- ごほうび の ことば -->
      <div id="toast" class="toast" aria-hidden="true"></div>

      <!-- タイトル -->
      <div id="title" class="title">
        <div class="title__rings" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>
        <h1 class="title__main">にじのわ<br /><small>けんきゅうしつ</small></h1>
        <p class="title__sub">おすと ひろがる</p>
        <button id="start" class="start" type="button" aria-label="はじめる">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 12l22 12-22 12z" /></svg>
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
