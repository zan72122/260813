<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>みずのまち</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1f16">
<meta name="description" content="ミニチュアの街に雨をふらせて、水のいきさきをかえてあそぶ実験ゲーム。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%A7%3C/text%3E%3C/svg%3E">
</head>
<body>

<div id="stage">
  <canvas id="view"></canvas>

  <!-- ▼ 道具トレイ（文字なし・アイコンのみ） -->
  <div id="tray" class="tray">
    <button id="tool-wall" class="tool" data-tool="wall" aria-label="かべ">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <g class="ink">
          <rect x="6" y="16" width="36" height="8" rx="2"/>
          <rect x="6" y="26" width="36" height="8" rx="2"/>
          <path class="line" d="M18 16v8M30 16v8M12 26v8M24 26v8M36 26v8"/>
        </g>
        <path class="water" d="M4 12c6 0 6-5 12-5s6 5 12 5 6-5 12-5 6 5 8 5" />
      </svg>
      <span class="gauge"></span>
    </button>
    <button id="tool-dig" class="tool" data-tool="dig" aria-label="みぞをほる">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <g class="ink">
          <path d="M30 8l10 10"/>
          <path d="M33 5l6 6-4 4-6-6z"/>
          <path d="M28 16L14 30"/>
          <path d="M17 27l-7 7 4 4 7-7z"/>
        </g>
        <path class="water" d="M4 44c5 0 5-4 10-4s5 4 10 4 5-4 10-4 5 4 10 4"/>
      </svg>
      <span class="gauge"></span>
    </button>
    <button id="tool-hand" class="tool is-on" data-tool="hand" aria-label="さわる">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <g class="ink">
          <path d="M18 30V12a4 4 0 0 1 8 0v14"/>
          <path d="M26 26v-4a4 4 0 0 1 8 0v10c0 7-5 12-12 12s-12-5-12-12v-6a4 4 0 0 1 8 0"/>
        </g>
      </svg>
    </button>
  </div>

  <!-- ▼ 主コントロール -->
  <div id="controls" class="controls">
    <button id="btn-reset" class="btn btn-reset" aria-label="やりなおす">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path class="ink" d="M38 24a14 14 0 1 1-4.2-10"/>
        <path class="ink-fill" d="M39 6.5v11.5h-11.5z"/>
      </svg>
    </button>
    <button id="btn-play" class="btn btn-play" aria-label="あめをふらせる">
      <svg viewBox="0 0 64 64" aria-hidden="true" class="ico-play">
        <path class="ink-fill" d="M24 16l24 16-24 16z"/>
      </svg>
      <svg viewBox="0 0 64 64" aria-hidden="true" class="ico-stop">
        <rect class="ink-fill" x="20" y="20" width="24" height="24" rx="4"/>
      </svg>
    </button>
    <button id="btn-sound" class="btn btn-sound" aria-label="おと">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path class="ink-fill" d="M10 19h7l9-7v24l-9-7h-7z"/>
        <path class="ink snd" d="M31 18a9 9 0 0 1 0 12M36 13a16 16 0 0 1 0 22"/>
        <path class="ink mute" d="M32 19l11 10M43 19L32 29"/>
      </svg>
    </button>
  </div>

  <!-- ▼ 結果くらべ（まえ / いま） -->
  <div id="result" class="result hidden" aria-hidden="true">
    <div class="result-card">
      <div class="maps">
        <div class="map-slot" id="slot-before">
          <canvas class="minimap" id="map-before" width="240" height="240"></canvas>
          <div class="slot-tag tag-before"><span class="num">1</span></div>
        </div>
        <div class="vs">
          <svg viewBox="0 0 40 40" aria-hidden="true"><path class="ink" d="M6 20h24M22 11l9 9-9 9"/></svg>
        </div>
        <div class="map-slot" id="slot-after">
          <canvas class="minimap" id="map-after" width="240" height="240"></canvas>
          <div class="slot-tag tag-after"><span class="num">2</span></div>
        </div>
      </div>
      <div class="scores" id="scores"></div>
      <button id="btn-again" class="btn btn-again" aria-label="もういちど">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path class="ink" d="M38 24a14 14 0 1 1-4.2-10"/>
          <path class="ink-fill" d="M39 6.5v11.5h-11.5z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ▼ ゆびのヒント（文字なし） -->
  <div id="hint" class="hint hidden" aria-hidden="true">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path class="hand" d="M24 38V16a4 4 0 0 1 8 0v14"/>
      <path class="hand" d="M32 30v-5a4 4 0 0 1 8 0v12c0 8-5 13-13 13s-13-5-13-13v-7a4 4 0 0 1 8 0"/>
    </svg>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
