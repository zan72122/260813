<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#160e2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="ぺたっ！きらっ！ひみつホログラム工場 - おして、はって、かたむけると にじが うごく"
    />
    <title>ぺたっ！きらっ！ひみつホログラム工場</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage" aria-label="ホログラムカード"></canvas>

      <!-- DOM overlay: tools, buttons, sparkles -->
      <div id="overlay">
        <div id="tool-layer" aria-hidden="true"></div>
        <div id="fx-layer" aria-hidden="true"></div>
        <div id="ui-layer"></div>
      </div>

      <noscript>
        <p class="fallback">JavaScript を オンに してね</p>
      </noscript>
      <div id="unsupported" class="fallback" hidden>
        <p>🌈</p>
        <p>この ブラウザでは あそべません</p>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
