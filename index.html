<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1512">
<title>のりこうじょう</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230d1512'/><rect x='14' y='16' width='36' height='32' rx='3' fill='%231d3324'/></svg>">
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#0b100e;
    overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  body { position:fixed; inset:0; }
  /* 3層: 下=工房と道具の奥 / 中=WebGLの海苔と水 / 上=手前のレール・粒子・HUD */
  canvas.layer {
    position:absolute; inset:0; display:block; width:100%; height:100%;
    touch-action:none;
  }
  #gl, #front { pointer-events:none; }
  #boot {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0b100e; color:#4e6d59; font:600 18px/1.5 system-ui, sans-serif;
    transition:opacity .4s; z-index:5;
  }
  #boot.gone { opacity:0; pointer-events:none; }
</style>
</head>
<body>
  <canvas id="back" class="layer"></canvas>
  <canvas id="gl" class="layer"></canvas>
  <canvas id="front" class="layer"></canvas>
  <div id="boot">…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
