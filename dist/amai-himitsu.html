// ================= src/util.js =================

// 小さな数学ユーティリティ。依存なし。
const TAU = Math.PI * 2;

const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => (b === a ? 0 : clamp((v - a) / (b - a)));
const smooth = (t) => {
  t = clamp(t);
  return t * t * (3 - 2 * t);
};
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = (t) => Math.pow(clamp(t), 3);
const easeInOut = (t) => (clamp(t) < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOutBack = (t) => {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};

// フレームレート非依存の指数補間。
const damp = (cur, target, lambda, dt) => lerp(cur, target, 1 - Math.exp(-lambda * dt));

// 決定的な擬似乱数（E2E で見た目を安定させるため固定シード）。
function makeRandom(seed = 1337) {
  let a = seed >>> 0;
  return function () {
    a += 0x6d2b79f5;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rnd = makeRandom(20260813);

// 角度差を -PI..PI に丸める。
function angleDelta(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return d;
}

// #rrggbb 同士の線形補間。
function mixHex(c1, c2, t) {
  const p = (c) => [
    parseInt(c.slice(1, 3), 16),
    parseInt(c.slice(3, 5), 16),
    parseInt(c.slice(5, 7), 16),
  ];
  const a = p(c1);
  const b = p(c2);
  const r = Math.round(lerp(a[0], b[0], t));
  const g = Math.round(lerp(a[1], b[1], t));
  const bl = Math.round(lerp(a[2], b[2], t));
  return `rgb(${r},${g},${bl})`;
}

// 2 色を混ぜて透明度つきで返す。
function mixHexA(c1, c2, t, alpha) {
  return mixHex(c1, c2, t).replace('rgb(', 'rgba(').replace(')', `,${alpha})`);
}

function rgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// バネ（過減衰しないよう半陰的オイラー）。ぷるん揺れの土台。
class Spring {
  constructor(value = 0, stiffness = 120, damping = 12) {
    this.v = value;
    this.vel = 0;
    this.target = value;
    this.k = stiffness;
    this.d = damping;
  }
  step(dt) {
    // 大きな dt でも発散しないよう分割。
    let left = dt;
    while (left > 0) {
      const h = Math.min(left, 1 / 120);
      const a = (this.target - this.v) * this.k - this.vel * this.d;
      this.vel += a * h;
      this.v += this.vel * h;
      left -= h;
    }
    return this.v;
  }
  kick(amount) {
    this.vel += amount;
  }
  reset(value = 0) {
    this.v = value;
    this.vel = 0;
    this.target = value;
  }
}


// ================= src/view.js =================

// 固定エレベーション（正射影っぽい）カメラ。
// k = sin(仰角): 0 = 真横, 1 = 真上。hf = cos(仰角) = 高さの圧縮率。

class View {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    this.dpr = 1;
    this.w = 0;
    this.h = 0;
    this.portrait = true;
    // カメラは「ワールド上のどの箱を必ず画面に収めるか」で指定する。
    // こうすると iPhone / iPad の縦横どちらでも自動で最適な大きさになる。
    // x,y = 箱の中心 / w,h = 箱の大きさ（ワールド単位） / k = 仰角 / anchor = 箱中心の画面上の縦位置
    this.cam = { x: 0, y: 40, w: 280, h: 140, k: 0.42, anchor: 0.5 };
    this.target = { ...this.cam };
    this.shake = 0;
    this._shx = 0;
    this._shy = 0;
    this.s = 1;
    this.cx = 0;
    this.cy = 0;
  }

  resize(fastMode) {
    const cap = fastMode ? 1 : 2;
    const w = Math.max(1, Math.round(window.innerWidth));
    const h = Math.max(1, Math.round(window.innerHeight));
    let dpr = Math.min(window.devicePixelRatio || 1, cap);
    // 大画面（iPad Pro など）で塗り面積が増えすぎないよう上限を掛ける。
    const maxPixels = 2600000;
    if (w * h * dpr * dpr > maxPixels) {
      dpr = Math.max(1, Math.sqrt(maxPixels / (w * h)));
    }
    if (this.w === w && this.h === h && this.dpr === dpr) return false;
    this.w = w;
    this.h = h;
    this.dpr = dpr;
    this.canvas.width = Math.round(w * dpr);
    this.canvas.height = Math.round(h * dpr);
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.portrait = h >= w;
    return true;
  }

  setTarget(t) {
    Object.assign(this.target, t);
  }

  snapToTarget() {
    Object.assign(this.cam, this.target);
  }

  update(dt) {
    const c = this.cam;
    const t = this.target;
    c.x = damp(c.x, t.x, 3.4, dt);
    c.y = damp(c.y, t.y, 3.4, dt);
    c.w = damp(c.w, t.w, 3.0, dt);
    c.h = damp(c.h, t.h, 3.0, dt);
    c.k = damp(c.k, t.k, 3.2, dt);
    c.anchor = damp(c.anchor, t.anchor, 3.2, dt);
    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 2.6);
      const a = this.shake * this.shake * 9;
      this._shx = (Math.random() * 2 - 1) * a;
      this._shy = (Math.random() * 2 - 1) * a;
    } else {
      this._shx = this._shy = 0;
    }
    this.recompute();
  }

  recompute() {
    const c = this.cam;
    this.k = clamp(c.k, 0.06, 0.95);
    this.hf = Math.sqrt(Math.max(0.05, 1 - this.k * this.k));
    // 指の置き場所（縦なら下、横なら右）を残して、残りに収める。
    const hb = this.portrait ? 0.94 : 0.8;
    const vb = this.portrait ? 0.64 : 0.74;
    const sw = (this.w * hb) / Math.max(1, c.w);
    const sh = (this.h * vb) / Math.max(1, c.h * this.hf);
    this.s = Math.min(sw, sh);
    this.cx = this.w / 2 + this._shx;
    this.cy = this.h * c.anchor + this._shy;
  }

  // ワールド座標 -> 変換適用後のローカル座標
  X(wx) {
    return wx - this.cam.x;
  }
  Y(wy) {
    return (this.cam.y - wy) * this.hf;
  }
  // ワールド -> 画面(CSS px)
  toScreen(wx, wy) {
    return { x: this.cx + this.X(wx) * this.s, y: this.cy + this.Y(wy) * this.s };
  }
  // 画面(CSS px) -> ワールド
  toWorld(sx, sy) {
    return {
      x: (sx - this.cx) / this.s + this.cam.x,
      y: this.cam.y - (sy - this.cy) / this.s / this.hf,
    };
  }

  begin() {
    const ctx = this.ctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    return ctx;
  }

  world() {
    const ctx = this.ctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.translate(this.cx, this.cy);
    ctx.scale(this.s, this.s);
    return ctx;
  }
}


// ================= src/input.js =================

// 画面のどこを触っても操作できる、極めて寛容な入力層。
// 4歳児向け: 位置精度を要求しない / 進捗は減らない / 手ぶれを吸収する。

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.active = false;
    this.x = 0;
    this.y = 0;
    this.px = 0;
    this.py = 0;
    this.dx = 0;
    this.dy = 0;
    this.startX = 0;
    this.startY = 0;
    this.downTime = 0;
    this.idle = 0; // 最後に触ってからの秒数
    this.tapped = false; // このフレームで指が離れた（短い接触）
    this.everTouched = false;
    this._pending = { dx: 0, dy: 0 };
    this._id = null;

    const opt = { passive: false };
    canvas.addEventListener('pointerdown', this._down, opt);
    canvas.addEventListener('pointermove', this._move, opt);
    canvas.addEventListener('pointerup', this._up, opt);
    canvas.addEventListener('pointercancel', this._up, opt);
    canvas.addEventListener('pointerleave', this._up, opt);
    // iOS Safari のスクロール/ズームを完全に止める。
    canvas.addEventListener('touchstart', (e) => e.preventDefault(), opt);
    canvas.addEventListener('touchmove', (e) => e.preventDefault(), opt);
    canvas.addEventListener('gesturestart', (e) => e.preventDefault(), opt);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault(), opt);
  }

  _down = (e) => {
    if (this._id !== null) return; // 最初の指だけを見る（手のひらが当たっても壊れない）
    this._id = e.pointerId;
    try {
      this.canvas.setPointerCapture(e.pointerId);
    } catch {
      /* noop */
    }
    const p = this._pos(e);
    this.active = true;
    this.everTouched = true;
    this.x = this.px = this.startX = p.x;
    this.y = this.py = this.startY = p.y;
    this._pending.dx = 0;
    this._pending.dy = 0;
    this.downTime = 0;
    this.idle = 0;
    this.travel = 0;
    e.preventDefault();
  };

  _move = (e) => {
    if (e.pointerId !== this._id) return;
    const p = this._pos(e);
    this._pending.dx += p.x - this.x;
    this._pending.dy += p.y - this.y;
    this.x = p.x;
    this.y = p.y;
    this.idle = 0;
    e.preventDefault();
  };

  _up = (e) => {
    if (e.pointerId !== this._id) return;
    this._id = null;
    this.active = false;
    this.tapped = this.downTime < 0.35;
    e.preventDefault();
  };

  _pos(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  // 毎フレーム先頭で呼ぶ。
  beginFrame(dt) {
    this.dx = this._pending.dx;
    this.dy = this._pending.dy;
    this._pending.dx = 0;
    this._pending.dy = 0;
    this.px = this.x - this.dx;
    this.py = this.y - this.dy;
    if (this.active) {
      this.downTime += dt;
      this.idle = 0;
      this.travel = (this.travel || 0) + Math.hypot(this.dx, this.dy);
    } else {
      this.idle += dt;
    }
  }

  endFrame() {
    this.tapped = false;
  }

  get moveLen() {
    return Math.hypot(this.dx, this.dy);
  }
}

// --- ジェスチャ認識器 ------------------------------------------------------
// いずれも 0..1 の進捗を「増やすだけ」。逆方向の手ぶれで戻ることはない。

// 円運動（混ぜる）。中心からずれていても、ぐるぐるでも往復でも進む。
class CircleGesture {
  constructor(turns = 2.2) {
    this.need = turns * TAU;
    this.acc = 0;
    this.angle = 0;
    this.has = false;
    this.spin = 0; // 見た目用の回転角
    this.speed = 0;
    this.ex = 0; // 回転中心の推定値（指の移動平均）
    this.ey = 0;
  }
  reset() {
    this.acc = 0;
    this.has = false;
    this.spin = 0;
    this.speed = 0;
  }
  nudge(dt) {
    this.acc += this.need * dt * 0.12;
    this.spin += dt * 2.4;
  }
  // cx, cy は「まだ触っていないとき」の初期中心（ボウルの位置）。
  // 触り始めたら指の移動平均を中心として使うので、画面のどこで回しても成立する。
  update(input, cx, cy, dt) {
    let gain = 0;
    if (input.active) {
      if (!this.has) {
        this.ex = input.x;
        this.ey = input.y;
      } else {
        const l = 1 - Math.exp(-2.6 * dt);
        this.ex += (input.x - this.ex) * l;
        this.ey += (input.y - this.ey) * l;
      }
      const a = Math.atan2(input.y - this.ey, input.x - this.ex);
      const r = Math.hypot(input.y - this.ey, input.x - this.ex);
      if (this.has && r > 10) {
        // 回転成分（半径が小さいと角度が暴れるので上限を掛ける）
        gain += Math.min(Math.abs(angleDelta(a, this.angle)), 0.5);
      }
      this.angle = a;
      this.has = true;
      // 直線的にゴシゴシ動かすだけでも進むよう、移動距離でも加点。
      gain += input.moveLen / 750;
      this.spin += Math.max(gain, input.moveLen / 600) * 2.6;
    } else {
      this.has = false;
    }
    this.speed = this.speed * Math.exp(-6 * dt) + gain * 10;
    this.acc += gain;
    return clamp(this.acc / this.need);
  }
}

// 一方向ドラッグ（注ぐ / 持ち上げる / 蓋を下ろす）。
// axis: 'x' | 'y', sign: +1 | -1。distance は CSS px。
class DragGesture {
  constructor(axis, sign, distance) {
    this.axis = axis;
    this.sign = sign;
    this.dist = distance;
    this.acc = 0;
    this.rate = 0;
  }
  reset() {
    this.acc = 0;
    this.rate = 0;
  }
  nudge(dt) {
    this.acc += this.dist * dt * 0.12;
  }
  update(input, dt) {
    let d = 0;
    if (input.active) {
      const main = this.axis === 'x' ? input.dx : input.dy;
      const cross = this.axis === 'x' ? input.dy : input.dx;
      // 斜めでも通す。逆方向は無視（減らさない）。
      d = Math.max(0, main * this.sign) + Math.abs(cross) * 0.12;
    }
    this.rate = this.rate * Math.exp(-8 * dt) + (d / Math.max(dt, 1e-3)) * 0.002;
    this.acc += d;
    return clamp(this.acc / this.dist);
  }
}

// 大きな弧のスワイプ（ひっくり返す）。左右どちらでも成立する。
class ArcGesture {
  constructor(distance) {
    this.dist = distance;
    this.acc = 0;
    this.dir = 0;
    this.rate = 0;
  }
  reset() {
    this.acc = 0;
    this.dir = 0;
    this.rate = 0;
  }
  nudge(dt) {
    this.acc += this.dist * dt * 0.12;
  }
  update(input, dt) {
    let d = 0;
    if (input.active) {
      if (this.dir === 0 && Math.abs(input.dx) > 2) this.dir = Math.sign(input.dx);
      const h = this.dir === 0 ? Math.abs(input.dx) : input.dx * this.dir;
      d = Math.max(0, h) + Math.max(0, -input.dy) * 0.35; // 上向きの弧も加点
    }
    this.rate = this.rate * Math.exp(-8 * dt) + (d / Math.max(dt, 1e-3)) * 0.002;
    this.acc += d;
    return clamp(this.acc / this.dist);
  }
}

// 押さえ続ける / こする（加熱レバー）。触れていれば進む。
class HoldGesture {
  constructor(duration) {
    this.dur = duration;
    this.acc = 0;
  }
  reset() {
    this.acc = 0;
  }
  nudge(dt) {
    this.acc += this.dur * dt * 0.12;
  }
  update(input, dt) {
    if (input.active) this.acc += dt * (1 + Math.min(input.moveLen, 30) / 60);
    return clamp(this.acc / this.dur);
  }
}


// ================= src/audio.js =================

// WebAudio による効果音。外部アセットなし。最初のタップで初期化（iOS 対策）。
let ctx = null;
let master = null;
let noiseBuf = null;
let muted = false;

function initAudio() {
  if (ctx) {
    if (ctx.state === 'suspended') ctx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    ctx = new AC();
  } catch {
    return;
  }
  master = ctx.createGain();
  master.gain.value = 0.5;
  master.connect(ctx.destination);
  const len = Math.floor(ctx.sampleRate * 1.5);
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}

function setMuted(v) {
  muted = v;
  if (master) master.gain.value = v ? 0 : 0.5;
}
function isMuted() {
  return muted;
}

const now = () => (ctx ? ctx.currentTime : 0);

function tone(freq, dur, type = 'sine', gain = 0.2, glideTo = null) {
  if (!ctx || muted) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, now());
  if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, now() + dur);
  g.gain.setValueAtTime(0.0001, now());
  g.gain.exponentialRampToValueAtTime(gain, now() + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, now() + dur);
  o.connect(g).connect(master);
  o.start();
  o.stop(now() + dur + 0.05);
}

function noise(dur, freq, q, gain = 0.2, sweepTo = null) {
  if (!ctx || muted) return;
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf;
  s.loop = true;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(freq, now());
  f.Q.value = q;
  if (sweepTo) f.frequency.linearRampToValueAtTime(sweepTo, now() + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now());
  g.gain.exponentialRampToValueAtTime(gain, now() + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, now() + dur);
  s.connect(f).connect(g).connect(master);
  s.start();
  s.stop(now() + dur + 0.05);
}

// --- ループ音（注ぐ / 湯気 / 混ぜる） ---
class Loop {
  constructor(make) {
    this.make = make;
    this.node = null;
    this.gain = null;
  }
  set(level) {
    if (!ctx || muted) return;
    level = Math.max(0, Math.min(1, level));
    if (level > 0.02 && !this.node) {
      const built = this.make(ctx);
      this.node = built.src;
      this.gain = built.gain;
      this.gain.connect(master);
      this.node.start();
    }
    if (this.gain) this.gain.gain.setTargetAtTime(level * 0.16, now(), 0.06);
    if (level <= 0.02 && this.node) {
      const n = this.node;
      const g = this.gain;
      this.node = null;
      this.gain = null;
      g.gain.setTargetAtTime(0.0001, now(), 0.05);
      setTimeout(() => {
        try {
          n.stop();
        } catch {
          /* noop */
        }
      }, 400);
    }
  }
  stop() {
    this.set(0);
  }
}

const mkNoiseLoop = (freq, q) => (c) => {
  const src = c.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;
  const f = c.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = freq;
  f.Q.value = q;
  const gain = c.createGain();
  gain.gain.value = 0.0001;
  src.connect(f).connect(gain);
  return { src, gain };
};

const pourLoop = new Loop(mkNoiseLoop(700, 1.2));
const steamLoop = new Loop(mkNoiseLoop(3200, 0.7));
const whiskLoop = new Loop(mkNoiseLoop(1800, 2.2));
const coldLoop = new Loop(mkNoiseLoop(420, 0.9));

function stopAllLoops() {
  pourLoop.stop();
  steamLoop.stop();
  whiskLoop.stop();
  coldLoop.stop();
}

// ================= src/art.js =================

// 描画層。Canvas2D のみ（WebGL2 相当の環境がなくても看板演出が成立する）。
// 描画予算は 3 つの Hero Material に集中する:
//   1) 琥珀色で半透明なカラメル
//   2) なめらかな黄色いプリン
//   3) 光沢のある銀色の型

/* eslint-disable no-unused-vars */

// --- 形状定数（ワールド単位） ---------------------------------------------
const MOLD = { rb: 40, rt: 54, h: 64, wall: 3.4 };
const PUD = {
  rb: MOLD.rt - MOLD.wall, // 反転後の下（広い方）
  rt: MOLD.rb - MOLD.wall, // 反転後の上（狭い方）
  h: MOLD.h - 2,
};
const PLATE = { r: 116, h: 10 };

// --- グラデーション ---------------------------------------------------------
// 座標はカメラ変換後のローカル空間なので毎フレーム作り直す（キャッシュ不可）。
// key 引数は呼び出し側の可読性のためだけに残している。
function lg(ctx, key, x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (const [p, c] of stops) g.addColorStop(p, c);
  return g;
}
function rg(ctx, key, x0, y0, r0, x1, y1, r1, stops) {
  const g = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1);
  for (const [p, c] of stops) g.addColorStop(p, c);
  return g;
}
function clearGradientCache() {
  bgCache.key = '';
}

// --- 基本ヘルパ -------------------------------------------------------------
function ellipse(ctx, cx, cy, rx, ry, from = 0, to = TAU, ccw = false) {
  ctx.ellipse(cx, cy, Math.max(0.01, rx), Math.max(0.01, ry), 0, from, to, ccw);
}

function ground(ctx, v, wx, base, r, alpha = 0.3, tint = '#6b4a2a') {
  const y = v.Y(base);
  ctx.save();
  ctx.beginPath();
  ellipse(ctx, v.X(wx), y, r, r * v.k);
  const g = rg(
    ctx,
    `sh${Math.round(r)}${tint}`,
    v.X(wx),
    y,
    0,
    v.X(wx),
    y,
    r,
    [
      [0, rgba(tint, 0.55)],
      [0.55, rgba(tint, 0.28)],
      [1, rgba(tint, 0)],
    ]
  );
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();
}

// 円錐台のシルエットパス（開口部は含めない）。
function frustumPath(ctx, cx, yBot, yTop, rBot, rTop, k) {
  ctx.beginPath();
  ellipse(ctx, cx, yTop, rTop, rTop * k, Math.PI, TAU); // 上面の奥側
  ctx.lineTo(cx + rBot, yBot);
  ellipse(ctx, cx, yBot, rBot, rBot * k, 0, Math.PI); // 底面の手前側
  ctx.closePath();
}

// --- 背景 -------------------------------------------------------------------
// 壁・光・周辺減光は画面サイズと寒色度でしか変わらないので、オフスクリーンに焼いて
// 毎フレームは drawImage 2 回で済ませる（iPad の高解像度でも塗り面積を稼がない）。
const bgCache = { key: '', back: null, front: null };

function bakeBackground(v, tint) {
  const key = `${v.w}x${v.h}@${v.dpr}:${tint.toFixed(2)}`;
  if (bgCache.key === key) return bgCache;
  const mk = () => {
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(v.w * v.dpr));
    cv.height = Math.max(1, Math.round(v.h * v.dpr));
    const c2 = cv.getContext('2d');
    c2.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
    return { cv, c2 };
  };
  const back = mk();
  const g = back.c2.createLinearGradient(0, 0, 0, v.h);
  g.addColorStop(0, mixHex('#ffe7cd', '#d3ecfb', tint));
  g.addColorStop(0.55, mixHex('#ffd9b2', '#b3ddf5', tint));
  g.addColorStop(1, mixHex('#f3c294', '#95c9e8', tint));
  back.c2.fillStyle = g;
  back.c2.fillRect(0, 0, v.w, v.h);
  const lx = v.w * 0.32;
  const ly = v.h * 0.18;
  const lr = Math.max(v.w, v.h) * 0.8;
  const gl = back.c2.createRadialGradient(lx, ly, 0, lx, ly, lr);
  gl.addColorStop(0, 'rgba(255,250,235,0.75)');
  gl.addColorStop(0.5, 'rgba(255,246,225,0.22)');
  gl.addColorStop(1, 'rgba(255,240,215,0)');
  back.c2.fillStyle = gl;
  back.c2.fillRect(0, 0, v.w, v.h);

  const front = mk();
  const vg = front.c2.createRadialGradient(
    v.w * 0.5,
    v.h * 0.5,
    Math.min(v.w, v.h) * 0.32,
    v.w * 0.5,
    v.h * 0.5,
    Math.max(v.w, v.h) * 0.78
  );
  vg.addColorStop(0, 'rgba(80,40,10,0)');
  vg.addColorStop(1, 'rgba(80,40,10,0.28)');
  front.c2.fillStyle = vg;
  front.c2.fillRect(0, 0, v.w, v.h);

  bgCache.key = key;
  bgCache.back = back.cv;
  bgCache.front = front.cv;
  return bgCache;
}

function background(ctx, v, tint = 0) {
  const c = v.begin();
  // 寒色度は 0.05 刻みに丸めて、キャッシュが毎フレーム作り直されないようにする。
  const t = Math.round(clamp(tint) * 20) / 20;
  const baked = bakeBackground(v, t);
  c.drawImage(baked.back, 0, 0, v.w, v.h);

  // 作業台（巨大な地面楕円）
  const w = v.world();
  const R = 430;
  const y0 = v.Y(0);
  w.beginPath();
  ellipse(w, v.X(0), y0, R, R * v.k);
  const tg = rg(
    w,
    'table' + tint.toFixed(1),
    v.X(0),
    y0,
    0,
    v.X(0),
    y0,
    R,
    [
      [0, mixHex('#f7dcc0', '#dcf0fb', tint)],
      [0.5, mixHex('#eecba6', '#c2e3f6', tint)],
      [0.82, mixHexA('#e3b489', '#a9d5ee', tint, 0.9)],
      [1, mixHexA('#e3b489', '#a9d5ee', tint, 0)],
    ]
  );
  w.fillStyle = tg;
  w.fill();

  // 画面周辺の減光（視線を中央へ）。必ず画面座標に戻してから描く。
  v.begin();
  c.drawImage(baked.front, 0, 0, v.w, v.h);
}

// --- 銀色の型 ---------------------------------------------------------------
// o: { x, base, open(bool 上が開いている), flipped(bool 広い方が下),
//      caramel(0..1), custard(0..1), set(bool), frost(0..1), alpha }
function mold(ctx, v, o) {
  const x = v.X(o.x ?? 0);
  const base = o.base ?? 0;
  const h = MOLD.h;
  const flipped = !!o.flipped;
  const rBot = flipped ? MOLD.rt : MOLD.rb;
  const rTop = flipped ? MOLD.rb : MOLD.rt;
  const yBot = v.Y(base);
  const yTop = v.Y(base + h);
  const k = v.k;

  ctx.save();
  if (o.alpha != null) ctx.globalAlpha = o.alpha;

  // 本体
  frustumPath(ctx, x, yBot, yTop, rBot, rTop, k);
  ctx.fillStyle = lg(ctx, 'metal' + Math.round(rTop), x - rTop, 0, x + rTop, 0, [
    [0, '#6c7783'],
    [0.1, '#9aa7b3'],
    [0.24, '#e9f0f6'],
    [0.34, '#ffffff'],
    [0.46, '#c9d4de'],
    [0.62, '#93a0ac'],
    [0.78, '#c6d1db'],
    [0.92, '#7b8794'],
    [1, '#5b6672'],
  ]);
  ctx.fill();

  // 型の横リブ（プリン型らしい段）
  ctx.save();
  frustumPath(ctx, x, yBot, yTop, rBot, rTop, k);
  ctx.clip();
  for (let i = 1; i <= 3; i++) {
    const t = i / 4;
    const yy = lerp(yBot, yTop, t);
    const rr = lerp(rBot, rTop, t);
    ctx.beginPath();
    ellipse(ctx, x, yy, rr, rr * k, 0, Math.PI);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.stroke();
    ctx.beginPath();
    ellipse(ctx, x, yy + 1.6, rr, rr * k, 0, Math.PI);
    ctx.strokeStyle = 'rgba(60,72,86,0.28)';
    ctx.stroke();
  }
  // 霜（冷却後）
  if (o.frost > 0) {
    ctx.globalAlpha = o.frost * 0.75;
    ctx.fillStyle = lg(ctx, 'frost', x, yTop, x, yBot, [
      [0, 'rgba(228,244,255,0.15)'],
      [1, 'rgba(240,250,255,0.9)'],
    ]);
    ctx.fillRect(x - rTop - 4, yTop - 20, rTop * 2 + 8, yBot - yTop + 40);
    ctx.globalAlpha = o.frost * 0.9;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI + 0.15;
      const t = ((i * 37) % 100) / 100;
      const rr = lerp(rBot, rTop, t) * 0.92;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * rr, lerp(yBot, yTop, t), 1.1 + (i % 3) * 0.5, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();

  if (o.open) {
    // 開口部（内側）
    const rin = rTop - MOLD.wall;
    ctx.beginPath();
    ellipse(ctx, x, yTop, rTop, rTop * k);
    ctx.fillStyle = lg(ctx, 'rim', x - rTop, 0, x + rTop, 0, [
      [0, '#8e9aa6'],
      [0.35, '#ffffff'],
      [0.7, '#aab6c2'],
      [1, '#78838f'],
    ]);
    ctx.fill();

    // 内壁
    ctx.save();
    ctx.beginPath();
    ellipse(ctx, x, yTop, rin, rin * k);
    ctx.clip();
    ctx.fillStyle = lg(ctx, 'inwall', x, yTop - rin * k, x, yTop + rin * k, [
      [0, '#3f4854'],
      [0.5, '#5d6875'],
      [1, '#98a4b0'],
    ]);
    ctx.fillRect(x - rin - 2, yTop - rin * k - 2, rin * 2 + 4, rin * k * 2 + 4);

    // 中身
    const cara = clamp(o.caramel ?? 0);
    const cust = clamp(o.custard ?? 0);
    const depth = rin * k * 0.95; // 見かけの深さ（開口の楕円内に収まる範囲）
    if (cara > 0) {
      const yy = yTop + depth * (1 - cara * 0.18);
      const rr = rin * (0.5 + cara * 0.2);
      ctx.beginPath();
      ellipse(ctx, x, yy, rr, rr * k);
      ctx.fillStyle = rg(ctx, 'carapool', x, yy, 0, x, yy, rr, [
        [0, '#e39a3c'],
        [0.6, '#c0761f'],
        [1, '#8a4f12'],
      ]);
      ctx.fill();
      ctx.beginPath();
      ellipse(ctx, x - rr * 0.25, yy - rr * k * 0.3, rr * 0.42, rr * k * 0.34);
      ctx.fillStyle = 'rgba(255,220,150,0.45)';
      ctx.fill();
    }
    if (cust > 0) {
      const yy = yTop + depth * (1 - cust * 0.98);
      const rr = lerp(rin * 0.56, rin * 0.985, cust);
      ctx.beginPath();
      ellipse(ctx, x, yy, rr, rr * k);
      const base1 = o.set ? '#ffd964' : '#ffe28f';
      const base2 = o.set ? '#f0b93f' : '#f8cf6a';
      ctx.fillStyle = rg(ctx, 'custpool' + (o.set ? 1 : 0), x, yy, 0, x, yy, rr, [
        [0, o.set ? '#ffe9a8' : '#fff0c4'],
        [0.55, base1],
        [1, base2],
      ]);
      ctx.fill();
      // カラメルが壁に残す茶色い縁（二層の記憶）
      if (cara > 0 && cust < 0.995) {
        ctx.lineWidth = 2.6;
        ctx.strokeStyle = rgba('#a15c14', 0.5 * (1 - cust * 0.4));
        ctx.stroke();
      }
      // 液面のハイライト
      ctx.beginPath();
      ellipse(ctx, x - rr * 0.28, yy - rr * k * 0.34, rr * 0.4, rr * k * 0.3);
      ctx.fillStyle = o.set ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.5)';
      ctx.fill();
    }
    ctx.restore();

    // 内側リムの光
    ctx.beginPath();
    ellipse(ctx, x, yTop, rin, rin * k);
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.stroke();
  } else {
    // 閉じた面（反転後の型の天面）
    const rr = rTop;
    ctx.beginPath();
    ellipse(ctx, x, yTop, rr, rr * k);
    ctx.fillStyle = rg(ctx, 'moldtop', x - rr * 0.3, yTop - rr * k * 0.4, rr * 0.1, x, yTop, rr, [
      [0, '#ffffff'],
      [0.45, '#d3dce4'],
      [1, '#8d99a5'],
    ]);
    ctx.fill();
    ctx.beginPath();
    ellipse(ctx, x, yTop, rr * 0.55, rr * 0.55 * k);
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.stroke();
  }

  // 縁取り
  frustumPath(ctx, x, yBot, yTop, rBot, rTop, k);
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = 'rgba(70,82,96,0.45)';
  ctx.stroke();
  ctx.restore();
}

// 型の中の「いま液面がある点」（カメラ変換後のローカル座標）。注ぐ流れの着地点に使う。
function moldPoolPoint(v, x, base, cara, cust) {
  const yTop = v.Y(base + MOLD.h);
  const rin = MOLD.rt - MOLD.wall;
  const depth = rin * v.k * 0.95;
  const c = clamp(cust ?? 0);
  const a = clamp(cara ?? 0);
  const y = c > 0.001 ? yTop + depth * (1 - c * 0.98) : yTop + depth * (1 - a * 0.18);
  return { x: v.X(x), y };
}

// --- 白い皿 -----------------------------------------------------------------
function plate(ctx, v, o) {
  const x = v.X(o.x ?? 0);
  const base = o.base ?? 0;
  const R = PLATE.r;
  const H = PLATE.h;
  const yBot = v.Y(base);
  const yTop = v.Y(base + H);
  const k = v.k;
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  // 側面
  frustumPath(ctx, x, yBot, yTop, R * 0.72, R, k);
  ctx.fillStyle = lg(ctx, 'plateside', x - R, 0, x + R, 0, [
    [0, '#cdd3dd'],
    [0.3, '#ffffff'],
    [0.6, '#eef1f6'],
    [1, '#c3cad4'],
  ]);
  ctx.fill();
  // 上面
  ctx.beginPath();
  ellipse(ctx, x, yTop, R, R * k);
  ctx.fillStyle = rg(ctx, 'platetop', x - R * 0.3, yTop - R * k * 0.4, R * 0.05, x, yTop, R, [
    [0, '#ffffff'],
    [0.62, '#f6f8fb'],
    [1, '#dde3ea'],
  ]);
  ctx.fill();
  // 見込みの段
  ctx.beginPath();
  ellipse(ctx, x, yTop, R * 0.74, R * 0.74 * k);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(190,200,214,0.75)';
  ctx.stroke();
  ctx.beginPath();
  ellipse(ctx, x, yTop - 1.4, R * 0.74, R * 0.74 * k);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.stroke();
  ctx.restore();
}

// --- 鍋（カラメル用） -------------------------------------------------------
// o: { x, base, tilt(rad), liquid(0..1), color, bubbles(0..1), rot }
function pot(ctx, v, o) {
  const k = v.k;
  const R = 62;
  const rb = 52;
  const H = 40;
  ctx.save();
  const p = { x: v.X(o.x), y: v.Y(o.base) };
  ctx.translate(p.x, p.y);
  ctx.rotate(o.tilt || 0);
  const yBot = 0;
  const yTop = -H * v.hf;

  // 取っ手
  ctx.beginPath();
  ctx.moveTo(-R * 0.95, yTop + 8);
  ctx.lineTo(-R - 78, yTop + 2);
  ctx.lineWidth = 13;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#4a5560';
  ctx.stroke();
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.stroke();

  // 本体
  frustumPath(ctx, 0, yBot, yTop, rb, R, k);
  ctx.fillStyle = lg(ctx, 'potbody', -R, 0, R, 0, [
    [0, '#6c7783'],
    [0.14, '#aab6c2'],
    [0.3, '#f2f7fb'],
    [0.42, '#ffffff'],
    [0.55, '#c2cdd8'],
    [0.75, '#8b97a3'],
    [1, '#5c6773'],
  ]);
  ctx.fill();

  // 開口
  ctx.beginPath();
  ellipse(ctx, 0, yTop, R, R * k);
  ctx.fillStyle = lg(ctx, 'potrim', -R, 0, R, 0, [
    [0, '#8e9aa6'],
    [0.4, '#ffffff'],
    [1, '#77828e'],
  ]);
  ctx.fill();
  const rin = R - 4;
  ctx.save();
  ctx.beginPath();
  ellipse(ctx, 0, yTop, rin, rin * k);
  ctx.clip();
  ctx.fillStyle = lg(ctx, 'potin', 0, yTop - rin * k, 0, yTop + rin * k, [
    [0, '#3d4653'],
    [1, '#8a96a2'],
  ]);
  ctx.fillRect(-rin - 2, yTop - rin * k - 2, rin * 2 + 4, rin * k * 2 + 4);

  // 液面
  const L = clamp(o.liquid ?? 0);
  if (L > 0) {
    const yy = yTop + rin * k * (1 - L) * 0.8;
    const rr = rin * (0.7 + 0.3 * L);
    // 容器を傾けても液面は水平を保つ（回転を打ち消す）
    ctx.translate(0, yTop);
    ctx.rotate(-(o.tilt || 0));
    ctx.translate(0, -yTop);
    ctx.beginPath();
    ellipse(ctx, 0, yy, rr, rr * k);
    ctx.fillStyle = o.color || '#f4f2ea';
    ctx.globalAlpha = 0.96;
    ctx.fill();
    ctx.globalAlpha = 1;
    // ハイライト
    ctx.beginPath();
    ellipse(ctx, -rr * 0.3, yy - rr * k * 0.35, rr * 0.34, rr * k * 0.26);
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.fill();
    // ふつふつ
    if (o.bubbles > 0) {
      ctx.globalAlpha = clamp(o.bubbles) * 0.85;
      for (let i = 0; i < 12; i++) {
        const t = (o.time * (0.5 + (i % 5) * 0.13) + i * 0.37) % 1;
        const a = i * 2.4;
        const bx = Math.cos(a) * rr * 0.62 * (0.4 + t * 0.6);
        const by = yy + Math.sin(a) * rr * k * 0.6 * (0.4 + t * 0.6);
        const rad = 1.6 + t * 3.4;
        ctx.beginPath();
        ctx.arc(bx, by, rad, 0, TAU);
        ctx.fillStyle = 'rgba(255,245,225,' + (0.7 - t * 0.6) + ')';
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();

  ctx.beginPath();
  ellipse(ctx, 0, yTop, rin, rin * k);
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.stroke();
  ctx.restore();
}

// --- ボウル（プリン液用） ---------------------------------------------------
function bowl(ctx, v, o) {
  const k = v.k;
  const R = 74;
  const H = 46;
  ctx.save();
  ctx.translate(v.X(o.x), v.Y(o.base));
  ctx.rotate(o.tilt || 0);
  const yBot = 0;
  const yTop = -H * v.hf;

  // 丸い胴（下が丸いボウル）
  ctx.beginPath();
  ctx.moveTo(-R, yTop);
  ctx.quadraticCurveTo(-R * 0.98, yBot + 8, 0, yBot + 4);
  ctx.quadraticCurveTo(R * 0.98, yBot + 8, R, yTop);
  ellipse(ctx, 0, yTop, R, R * k, 0, Math.PI, true);
  ctx.closePath();
  ctx.fillStyle = lg(ctx, 'bowlbody', -R, 0, R, 0, [
    [0, '#dfe6ee'],
    [0.22, '#ffffff'],
    [0.42, '#f4f7fb'],
    [0.68, '#dbe2ea'],
    [1, '#b9c3cf'],
  ]);
  ctx.fill();

  ctx.beginPath();
  ellipse(ctx, 0, yTop, R, R * k);
  ctx.fillStyle = '#f3f6fa';
  ctx.fill();
  const rin = R - 4;
  ctx.save();
  ctx.beginPath();
  ellipse(ctx, 0, yTop, rin, rin * k);
  ctx.clip();
  ctx.fillStyle = lg(ctx, 'bowlin', 0, yTop - rin * k, 0, yTop + rin * k, [
    [0, '#c9d2dc'],
    [1, '#eef2f7'],
  ]);
  ctx.fillRect(-rin - 2, yTop - rin * k - 2, rin * 2 + 4, rin * k * 2 + 4);

  const L = clamp(o.liquid ?? 0);
  if (L > 0) {
    const yy = yTop + rin * k * (1 - L) * 0.55;
    const rr = rin * (0.78 + 0.22 * L);
    ctx.translate(0, yTop);
    ctx.rotate(-(o.tilt || 0));
    ctx.translate(0, -yTop);
    ctx.beginPath();
    ellipse(ctx, 0, yy, rr, rr * k);
    ctx.fillStyle = rg(ctx, 'custliq', 0, yy, 0, 0, yy, rr, [
      [0, '#fff0bd'],
      [0.6, '#ffe08a'],
      [1, '#f4c85c'],
    ]);
    ctx.fill();
    // 混ざり具合: 白い筋が消えていく
    const un = clamp(1 - (o.mixed ?? 0));
    if (un > 0.01) {
      ctx.save();
      ctx.beginPath();
      ellipse(ctx, 0, yy, rr, rr * k);
      ctx.clip();
      ctx.globalAlpha = un * 0.85;
      for (let i = 0; i < 5; i++) {
        const a = (o.swirl || 0) + (i / 5) * TAU;
        ctx.beginPath();
        for (let j = 0; j <= 22; j++) {
          const u = j / 22;
          const ang = a + u * 2.6;
          const rad = rr * (0.15 + u * 0.78);
          const px = Math.cos(ang) * rad;
          const py = yy + Math.sin(ang) * rad * k;
          if (j === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.lineWidth = 6 - i * 0.6;
        ctx.lineCap = 'round';
        ctx.strokeStyle = i % 2 ? 'rgba(255,252,240,0.9)' : 'rgba(255,214,110,0.85)';
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    // 混ぜている間の波紋
    const rip = clamp(o.ripple ?? 0);
    if (rip > 0.02) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.5, rip * 0.5);
      for (let i = 0; i < 3; i++) {
        const ph = (((o.time ?? 0) * 1.1 + i / 3) % 1);
        const rad = rr * (0.24 + ph * 0.74);
        ctx.beginPath();
        ellipse(ctx, 0, yy, rad, rad * k);
        ctx.lineWidth = 3 * (1 - ph);
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.stroke();
      }
      ctx.restore();
    }
    // 表面の光
    ctx.beginPath();
    ellipse(ctx, -rr * 0.3, yy - rr * k * 0.35, rr * 0.34, rr * k * 0.24);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();
  }
  ctx.restore();
  ctx.beginPath();
  ellipse(ctx, 0, yTop, rin, rin * k);
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.stroke();
  ctx.restore();
}

// 泡立て器
function whisk(ctx, v, o) {
  const cx = v.X(o.x);
  const cy = v.Y(o.base);
  const rot = o.rot || 0;
  const orbit = o.orbit ?? 30;
  const px = cx + Math.cos(rot) * orbit;
  const py = cy + Math.sin(rot) * orbit * v.k;
  ctx.save();
  ctx.translate(px, py);
  const hTop = -104 * v.hf;
  // ワイヤ（かご）
  for (let i = 0; i < 6; i++) {
    const sp = (i / 5 - 0.5) * 2;
    ctx.beginPath();
    ctx.moveTo(0, hTop + 34);
    ctx.quadraticCurveTo(sp * 26, hTop + 62, 0, 6);
    ctx.lineWidth = 4.2;
    ctx.strokeStyle = '#9aa6b2';
    ctx.stroke();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.stroke();
  }
  // 柄
  ctx.beginPath();
  ctx.moveTo(0, hTop + 38);
  ctx.lineTo(0, hTop - 12);
  ctx.lineWidth = 13;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#7f8b98';
  ctx.stroke();
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.stroke();
  ctx.restore();
}

// 傾いた容器の「注ぎ口」の位置（カメラ変換後のローカル座標）
function vesselSpout(v, x, base, tilt, R, H) {
  const s = Math.sin(tilt);
  const c = Math.cos(tilt);
  const hy = -H * v.hf;
  return { x: v.X(x) + R * c - hy * s, y: v.Y(base) + R * s + hy * c };
}

// --- 注ぐ流れ（リボン） -----------------------------------------------------
// 座標はすべてカメラ変換後のローカル座標（v.X / v.Y / vesselSpout の出力）。
function stream(ctx, v, o) {
  const x0 = o.x0;
  const y0 = o.y0;
  const x1 = o.x1;
  const y1 = o.y1;
  const w0 = o.width ?? 9;
  const t = o.time || 0;
  const seg = 16;
  const pts = [];
  for (let i = 0; i <= seg; i++) {
    const u = i / seg;
    const wob = Math.sin(t * 7 + u * 5.5) * 2.4 * (1 - u * 0.4) * (o.wobble ?? 1);
    // 落下は下ほど速い → 上をゆるく、下を直線に
    const ux = lerp(x0, x1, u * u * 0.35 + u * 0.65);
    const uy = lerp(y0, y1, u);
    pts.push([ux + wob, uy, lerp(w0, w0 * 0.62, u)]);
  }
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0][0] - pts[0][2] / 2, pts[0][1]);
  for (let i = 1; i <= seg; i++) ctx.lineTo(pts[i][0] - pts[i][2] / 2, pts[i][1]);
  for (let i = seg; i >= 0; i--) ctx.lineTo(pts[i][0] + pts[i][2] / 2, pts[i][1]);
  ctx.closePath();
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.fillStyle = lg(
    ctx,
    'stream' + (o.c1 || '') + (o.c2 || '') + Math.round(x0) + '_' + Math.round(x1),
    x0 - w0,
    0,
    x0 + w0,
    0,
    [
      [0, o.c2 || '#b5651d'],
      [0.35, o.c1 || '#e5a13f'],
      [0.55, o.hi || '#ffd9a0'],
      [0.8, o.c1 || '#e5a13f'],
      [1, o.c2 || '#b5651d'],
    ]
  );
  ctx.fill();
  ctx.restore();
}

function splash(ctx, v, o) {
  const x = o.lx != null ? o.lx : v.X(o.x);
  const y = o.ly != null ? o.ly : v.Y(o.y);
  const r = o.r ?? 14;
  ctx.save();
  ctx.globalAlpha = o.alpha ?? 0.9;
  ctx.beginPath();
  ellipse(ctx, x, y, r, r * v.k * 0.9);
  ctx.fillStyle = o.color || 'rgba(240,180,90,0.55)';
  ctx.fill();
  ctx.restore();
}

// --- 湯気 -------------------------------------------------------------------
function steamPuffs(ctx, v, list, color = 'rgba(255,255,255,') {
  ctx.save();
  for (const p of list) {
    const x = v.X(p.x);
    const y = v.Y(p.y);
    const a = p.life * (1 - p.life) * 4;
    ctx.beginPath();
    ctx.arc(x, y, p.r, 0, TAU);
    const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(1, p.r));
    g.addColorStop(0, color + 0.9 * a + ')');
    g.addColorStop(0.55, color + 0.45 * a + ')');
    g.addColorStop(1, color + '0)');
    ctx.fillStyle = g;
    ctx.fill();
  }
  ctx.restore();
}

// --- Hero: プリン -----------------------------------------------------------
// 本物の soft-body は使わない。頂点オフセット（進行波）＋バネによる squash で偽装。
// o: { x, base, wobble(振幅), phase, squash(>0 で潰れる), reveal(0..1 下から見える割合),
//      caramelFlow(0..1), alpha, glow }
function pudding(ctx, v, o) {
  const cx = v.X(o.x ?? 0);
  const base = o.base ?? 0;
  const k = v.k;
  const A = o.wobble || 0;
  const ph = o.phase || 0;
  const sq = o.squash || 0;
  const hEff = PUD.h * (1 - sq * 0.55);
  const N = 16;

  const rAt = (t) =>
    lerp(PUD.rb, PUD.rt, t) *
    (1 + sq * 0.34 * (1 - t * 0.45)) *
    (1 + A * 0.0016 * Math.cos(ph * 1.1 - t * 2.4));
  const dxAt = (t) => A * Math.sin(ph - t * 2.05) * Math.pow(t, 1.45);
  const yAt = (t) => v.Y(base + hEff * t);

  const L = [];
  const R = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const r = rAt(t);
    const d = dxAt(t);
    const y = yAt(t);
    L.push([cx + d - r, y]);
    R.push([cx + d + r, y]);
  }
  const rTopE = rAt(1);
  const dTop = dxAt(1);
  const yTopE = yAt(1);
  const rBotE = rAt(0);
  const yBotE = yAt(0);

  const bodyPath = () => {
    ctx.beginPath();
    ctx.moveTo(R[0][0], R[0][1]);
    ellipse(ctx, cx + dxAt(0), yBotE, rBotE, rBotE * k, 0, Math.PI); // 手前の底
    for (let i = 1; i <= N; i++) ctx.lineTo(L[i][0], L[i][1]);
    ellipse(ctx, cx + dTop, yTopE, rTopE, rTopE * k, Math.PI, TAU); // 奥の上
    for (let i = N - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath();
  };

  ctx.save();
  if (o.alpha != null) ctx.globalAlpha = o.alpha;

  // 型に隠れている部分を切る（型を引き上げる途中の露出制御）
  if (o.reveal != null && o.reveal < 1) {
    const cut = v.Y(base + hEff * clamp(o.reveal) + 0.5);
    ctx.beginPath();
    ctx.rect(cx - 260, cut, 520, 640);
    ctx.clip();
  }

  // 接地影
  ground(ctx, v, (o.x ?? 0) + dTop * 0.1, base + 0.4, rBotE * 1.16, 0.5, '#8a5a24');

  // 皿にゆっくり広がるカラメル（本体より先に描く。手前のふちだけが見える）
  const flow = clamp(o.caramelFlow ?? 0);
  const pool = clamp((flow - 0.55) / 0.45);
  if (pool > 0) {
    const pr = rBotE * (1.0 + pool * 0.22);
    ctx.beginPath();
    ellipse(ctx, cx, yAt(0) + 1.5, pr, pr * k);
    ctx.fillStyle = rg(ctx, 'pool', cx, yAt(0), rBotE * 0.75, cx, yAt(0), pr, [
      [0, 'rgba(178,104,26,0.85)'],
      [0.75, 'rgba(170,98,24,0.6)'],
      [1, 'rgba(158,88,20,0)'],
    ]);
    ctx.fill();
  }

  // 本体
  ctx.save();
  bodyPath();
  ctx.clip();
  const x0 = cx - PUD.rb * 1.3;
  const x1 = cx + PUD.rb * 1.3;
  ctx.fillStyle = lg(ctx, 'pudside', x0, 0, x1, 0, [
    [0, '#e0a02c'],
    [0.1, '#f3c14a'],
    [0.24, '#ffe488'],
    [0.34, '#fff3bd'],
    [0.5, '#ffd964'],
    [0.72, '#f0b83e'],
    [0.88, '#d9962a'],
    [1, '#c07f22'],
  ]);
  ctx.fillRect(x0, yTopE - 40, x1 - x0, yBotE - yTopE + 80);
  // 下方の陰影
  ctx.fillStyle = lg(ctx, 'pudshade', 0, yTopE, 0, yBotE + 6, [
    [0, 'rgba(120,60,10,0)'],
    [0.55, 'rgba(120,60,10,0.05)'],
    [1, 'rgba(110,55,8,0.3)'],
  ]);
  ctx.fillRect(x0, yTopE - 40, x1 - x0, yBotE - yTopE + 80);
  // 半透明の「抜け」（プリンらしい透け感）— 主張しすぎない程度に
  ctx.globalCompositeOperation = 'lighter';
  const gy = lerp(yTopE, yBotE, 0.62);
  ctx.fillStyle = rg(ctx, 'pudsss', cx + rBotE * 0.5, gy, 2, cx + rBotE * 0.5, gy, rBotE * 0.95, [
    [0, 'rgba(255,205,110,0.22)'],
    [1, 'rgba(255,190,70,0)'],
  ]);
  ctx.fillRect(x0, yTopE - 40, x1 - x0, yBotE - yTopE + 80);
  ctx.globalCompositeOperation = 'source-over';
  // 主ハイライト（左上から差す光の縦帯）
  const hx = cx + dxAt(0.5) - rBotE * 0.44;
  const hy = lerp(yTopE, yBotE, 0.46);
  ctx.beginPath();
  ellipse(ctx, hx, hy, rBotE * 0.24, (yBotE - yTopE) * 0.34);
  ctx.fillStyle = rg(ctx, 'pudhi', hx, hy, 0, hx, hy, rBotE * 0.34, [
    [0, 'rgba(255,255,255,0.6)'],
    [0.55, 'rgba(255,255,255,0.18)'],
    [1, 'rgba(255,255,255,0)'],
  ]);
  ctx.fill();
  // リムライト（右）
  ctx.beginPath();
  ctx.moveTo(R[0][0], R[0][1]);
  for (let i = 1; i <= N; i++) ctx.lineTo(R[i][0], R[i][1]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,248,210,0.55)';
  ctx.stroke();
  ctx.restore();

  // 上面（カラメルの層）— 薄く艶やかに。黄色を殺さない。
  const rTopC = rTopE * 0.995;
  ctx.beginPath();
  ellipse(ctx, cx + dTop, yTopE, rTopC, rTopC * k);
  ctx.fillStyle = lg(
    ctx,
    'pudtop',
    cx + dTop - rTopC,
    yTopE - rTopC * k,
    cx + dTop + rTopC,
    yTopE + rTopC * k,
    [
      [0, '#e6ab53'],
      [0.34, '#cf8a2c'],
      [0.68, '#b06618'],
      [1, '#8f4e0e'],
    ]
  );
  ctx.fill();
  // 上面のつや
  ctx.save();
  ctx.beginPath();
  ellipse(ctx, cx + dTop, yTopE, rTopC, rTopC * k);
  ctx.clip();
  const sx = cx + dTop - rTopC * 0.3;
  const sy = yTopE - rTopC * k * 0.34;
  ctx.beginPath();
  ellipse(ctx, sx, sy, rTopC * 0.5, rTopC * k * 0.46);
  ctx.fillStyle = rg(ctx, 'topgloss', sx, sy, 0, sx, sy, rTopC * 0.5, [
    [0, 'rgba(255,236,192,0.6)'],
    [0.6, 'rgba(255,224,168,0.22)'],
    [1, 'rgba(255,220,160,0)'],
  ]);
  ctx.fill();
  ctx.beginPath();
  ellipse(ctx, cx + dTop + rTopC * 0.34, yTopE + rTopC * k * 0.3, rTopC * 0.28, rTopC * k * 0.22);
  ctx.fillStyle = 'rgba(255,214,150,0.24)';
  ctx.fill();
  ctx.restore();
  // 上面の縁（ふちで一段明るく光る）
  ctx.beginPath();
  ellipse(ctx, cx + dTop, yTopE, rTopC, rTopC * k);
  ctx.lineWidth = 1.8;
  ctx.strokeStyle = 'rgba(255,226,168,0.6)';
  ctx.stroke();

  // カラメルが頂上から側面へゆっくり流れる（細い筋。黄色い側面を覆いつくさない）
  if (flow > 0) {
    // [横位置 -1..1, 遅れ, 到達する高さの割合, 太さ]
    const drips = [
      [-0.74, 0.0, 0.5, 8.0],
      [0.5, 0.06, 0.56, 9.0],
      [-0.22, 0.16, 0.36, 7.0],
      [0.84, 0.24, 0.26, 5.6],
      [0.2, 0.34, 0.3, 6.4],
      [-0.95, 0.44, 0.2, 5.0],
    ];
    ctx.save();
    ctx.globalAlpha = 0.9;
    for (const [a, delay, len, w] of drips) {
      const gp = clamp((flow - delay) / (1 - delay));
      if (gp <= 0) continue;
      const reach = smooth(gp) * len;
      const tEnd = clamp(1 - reach);
      const steps = 10;
      const lp = [];
      const rp = [];
      const mid = [];
      const front = Math.sqrt(Math.max(0, 1 - a * a)); // 方位角 φ の sin。手前ほど 1。
      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const t = lerp(1, tEnd, u);
        const r = rAt(t);
        const wander = Math.sin(a * 9.1 + u * 2.4) * 1.1 * u;
        const px = cx + dxAt(t) + r * a + wander;
        // 円錐の「手前側の面」を伝って落ちるので、常に楕円分だけ下へずらす
        const py = yAt(t) + r * k * front;
        // 上は細く、先端に向かってふくらむ（とろみのある垂れ方）
        const ww = (w * (0.5 + 0.6 * u * u)) / 2;
        lp.push([px - ww, py]);
        rp.push([px + ww, py]);
        mid.push([px, py]);
      }
      ctx.beginPath();
      ctx.moveTo(lp[0][0], lp[0][1]);
      for (let i = 1; i < lp.length; i++) ctx.lineTo(lp[i][0], lp[i][1]);
      for (let i = rp.length - 1; i >= 0; i--) ctx.lineTo(rp[i][0], rp[i][1]);
      ctx.closePath();
      const gx = cx + dxAt(tEnd) + rAt(tEnd) * a;
      ctx.fillStyle = lg(ctx, 'dripg', gx - w, 0, gx + w, 0, [
        [0, '#94520f'],
        [0.3, '#c07822'],
        [0.52, '#e5a854'],
        [0.78, '#b56a18'],
        [1, '#7f440c'],
      ]);
      ctx.fill();
      // 先端のしずく
      const ex = mid[mid.length - 1][0];
      const ey = mid[mid.length - 1][1];
      ctx.beginPath();
      ctx.arc(ex, ey, w * 0.56, 0, TAU);
      ctx.fillStyle = '#b06617';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex - w * 0.18, ey - w * 0.2, w * 0.2, 0, TAU);
      ctx.fillStyle = 'rgba(255,226,176,0.55)';
      ctx.fill();
      // 艶の筋
      ctx.beginPath();
      ctx.moveTo(mid[0][0] - w * 0.14, mid[0][1]);
      for (let i = 1; i < mid.length; i++) ctx.lineTo(mid[i][0] - w * 0.16, mid[i][1]);
      ctx.lineWidth = Math.max(0.8, w * 0.16);
      ctx.strokeStyle = 'rgba(255,222,164,0.5)';
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.restore();
}

// --- UI（文字なし） ---------------------------------------------------------
// 指のアイコン。画面座標で描く。
function handIcon(ctx, x, y, scale = 1, rot = 0, alpha = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  ctx.shadowColor = 'rgba(90,50,15,0.35)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;
  ctx.beginPath();
  // 手のひら
  ctx.moveTo(-13, 6);
  ctx.quadraticCurveTo(-17, 24, -6, 30);
  ctx.quadraticCurveTo(6, 35, 14, 26);
  ctx.quadraticCurveTo(20, 18, 19, 4);
  ctx.lineTo(19, -4);
  ctx.quadraticCurveTo(19, -10, 13, -10);
  ctx.quadraticCurveTo(9, -10, 9, -5);
  ctx.lineTo(9, -8);
  ctx.quadraticCurveTo(9, -14, 3, -14);
  ctx.quadraticCurveTo(-1, -14, -1, -8);
  ctx.lineTo(-1, -12);
  ctx.quadraticCurveTo(-1, -18, -7, -18);
  ctx.quadraticCurveTo(-11, -18, -11, -12);
  ctx.lineTo(-11, -26);
  ctx.quadraticCurveTo(-11, -33, -17, -33);
  ctx.quadraticCurveTo(-23, -33, -23, -26);
  ctx.lineTo(-23, 2);
  ctx.quadraticCurveTo(-23, 4, -13, 6);
  ctx.closePath();
  ctx.fillStyle = '#fff7ec';
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#7b5230';
  ctx.stroke();
  ctx.restore();
}

// 破線の誘導パス（円 / 直線 / 弧）
function guideArrow(ctx, pts, phase, alpha = 1, color = 'rgba(255,255,255,0.95)') {
  if (pts.length < 2) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.setLineDash([16, 14]);
  ctx.lineDashOffset = -phase;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineWidth = 13;
  ctx.strokeStyle = 'rgba(120,72,30,0.28)';
  ctx.stroke();
  ctx.lineWidth = 8;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.setLineDash([]);
  // 矢じり
  const n = pts.length - 1;
  const [ax, ay] = pts[n];
  const [bx, by] = pts[Math.max(0, n - 1)];
  const ang = Math.atan2(ay - by, ax - bx);
  ctx.translate(ax, ay);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(2, 0);
  ctx.lineTo(-16, -13);
  ctx.lineTo(-11, 0);
  ctx.lineTo(-16, 13);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function sparkles(ctx, list) {
  ctx.save();
  for (const p of list) {
    const a = clamp(p.life) * (1 - p.life * 0.2);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = a;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const ang = (i / 4) * TAU;
      const nx = Math.cos(ang) * p.r;
      const ny = Math.sin(ang) * p.r;
      const mx = Math.cos(ang + Math.PI / 4) * p.r * 0.22;
      const my = Math.sin(ang + Math.PI / 4) * p.r * 0.22;
      if (i === 0) ctx.moveTo(nx, ny);
      else ctx.lineTo(nx, ny);
      ctx.lineTo(mx, my);
    }
    ctx.closePath();
    ctx.fillStyle = p.color || 'rgba(255,246,200,0.95)';
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}


// --- bundle: `import * as A from './art.js'` の代替 ---
const A = {
  MOLD, PUD, PLATE, clearGradientCache, ellipse, ground, background,
  mold, moldPoolPoint, plate, pot, bowl, whisk, vesselSpout, stream, splash,
  steamPuffs, pudding, handIcon, guideArrow, sparkles,
};


// ================= src/stages.js =================

// 12 の工程モジュール。
// 1 モジュール = 1 動詞 + 1 操作 + 1 つの視覚変化。
// 文字は一切出さない。誘導は「手のアイコン」と「破線の道すじ」だけ。





// --- 粒子ヘルパ -------------------------------------------------------------
function emit(list, x, y, r, life, vx, vy) {
  if (list.length > 90) return;
  list.push({ x, y, r, life: 0, dur: life, vx, vy });
}
function stepParticles(list, dt) {
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i];
    p.life += dt / p.dur;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.r += dt * 14;
    if (p.life >= 1) list.splice(i, 1);
  }
}

// 画面サイズに対する必要ドラッグ量。
// iPhone 縦 / iPad 横 のどちらでも「大きく 1〜1.5 回」で完了する量にする。
const vDist = (v, f = 0.8, cap = 520) => Math.max(140, Math.min(v.h * f, cap));
const hDist = (v, f = 0.8, cap = 520) => Math.max(140, Math.min(v.w * f, cap));

// 誘導の置き場所（指が Hero を隠さない安全地帯）
function hintAnchor(v) {
  return v.portrait
    ? { x: v.w * 0.5, y: v.h * 0.84, span: Math.min(v.w * 0.34, 150) }
    : { x: v.w * 0.8, y: v.h * 0.62, span: Math.min(v.w * 0.13, 130) };
}

// 砂糖液の色: 透明 -> 淡い金 -> 琥珀
function sugarColor(t) {
  t = clamp(t);
  return t < 0.5
    ? mixHex('#f9f6ec', '#f0d17a', t * 2)
    : mixHex('#f0d17a', '#a85c14', (t - 0.5) * 2);
}

// --- 小物の描画 -------------------------------------------------------------
function stove(ctx, v, x) {
  const cx = v.X(x);
  const y = v.Y(0);
  const k = v.k;
  ctx.save();
  // 五徳
  ctx.beginPath();
  A.ellipse(ctx, cx, y, 78, 78 * k);
  ctx.fillStyle = '#4d5560';
  ctx.fill();
  ctx.beginPath();
  A.ellipse(ctx, cx, y - 2, 78, 78 * k);
  ctx.fillStyle = '#6b7480';
  ctx.fill();
  ctx.beginPath();
  A.ellipse(ctx, cx, y - 2, 48, 48 * k);
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#3c434d';
  ctx.stroke();
  ctx.restore();
}

// 炎は鍋の後ろ・手前の両方に出す（鍋に隠れないように鍋より後に描く）
function flames(ctx, v, x, base, flame, front) {
  if (!(flame > 0)) return;
  const cx = v.X(x);
  const y = v.Y(base);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 11; i++) {
    const a = (i / 11) * TAU;
    if (front === true && Math.sin(a) < 0) continue;
    if (front === false && Math.sin(a) >= 0) continue;
    const fx = cx + Math.cos(a) * 60;
    const fy = y + Math.sin(a) * 60 * v.k;
    const hgt = (26 + Math.sin(v.time * 12 + i * 2.1) * 9) * flame;
    ctx.beginPath();
    ctx.moveTo(fx - 13, fy);
    ctx.quadraticCurveTo(fx, fy - hgt * 2.1, fx + 13, fy);
    ctx.closePath();
    const g = ctx.createLinearGradient(fx, fy, fx, fy - hgt * 2.1);
    g.addColorStop(0, 'rgba(90,150,255,0.55)');
    g.addColorStop(0.28, 'rgba(255,140,30,0.85)');
    g.addColorStop(0.7, 'rgba(255,196,80,0.6)');
    g.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = g;
    ctx.fill();
  }
  ctx.restore();
}

function lever(ctx, v, x, angle, glow) {
  const cx = v.X(x);
  const yBase = v.Y(0);
  const yPiv = v.Y(58);
  ctx.save();
  // 支柱
  ctx.beginPath();
  A.ellipse(ctx, cx, yBase, 26, 26 * v.k);
  ctx.fillStyle = '#6b7480';
  ctx.fill();
  ctx.lineWidth = 15;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#8a95a2';
  ctx.beginPath();
  ctx.moveTo(cx, yBase);
  ctx.lineTo(cx, yPiv);
  ctx.stroke();
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.stroke();
  // アーム
  ctx.translate(cx, yPiv);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -52);
  ctx.lineWidth = 13;
  ctx.strokeStyle = '#d8dee6';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -56, 19, 0, TAU);
  const g = ctx.createRadialGradient(-7, -63, 2, 0, -56, 22);
  g.addColorStop(0, '#ffb59c');
  g.addColorStop(0.5, '#ff7a59');
  g.addColorStop(1, '#d8492a');
  ctx.fillStyle = g;
  ctx.fill();
  if (glow > 0) {
    ctx.beginPath();
    ctx.arc(0, -56, 19 + glow * 7, 0, TAU);
    ctx.lineWidth = 3;
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - glow)})`;
    ctx.stroke();
  }
  ctx.restore();
}

function tray(ctx, v, x) {
  const cx = v.X(x);
  const yb = v.Y(0);
  const yt = v.Y(11);
  ctx.save();
  ctx.beginPath();
  A.ellipse(ctx, cx, yt, 150, 150 * v.k, Math.PI, TAU);
  ctx.lineTo(cx + 140, yb);
  A.ellipse(ctx, cx, yb, 140, 140 * v.k, 0, Math.PI);
  ctx.closePath();
  const g = ctx.createLinearGradient(cx - 150, 0, cx + 150, 0);
  g.addColorStop(0, '#7c8794');
  g.addColorStop(0.3, '#e6ecf2');
  g.addColorStop(0.55, '#b9c4cf');
  g.addColorStop(1, '#6f7a87');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  A.ellipse(ctx, cx, yt, 150, 150 * v.k);
  ctx.fillStyle = '#c8d2dc';
  ctx.fill();
  ctx.beginPath();
  A.ellipse(ctx, cx, yt + 1, 142, 142 * v.k);
  const wg = ctx.createRadialGradient(cx, yt, 4, cx, yt, 142);
  wg.addColorStop(0, 'rgba(214,238,250,0.95)');
  wg.addColorStop(1, 'rgba(150,200,226,0.95)');
  ctx.fillStyle = wg;
  ctx.fill();
  ctx.restore();
}

function lid(ctx, v, x, base, alpha = 1, glow = 0) {
  const cx = v.X(x);
  const yb = v.Y(base);
  const yt = v.Y(base + 74);
  const R = 70;
  ctx.save();
  ctx.globalAlpha = alpha;
  // ドーム
  ctx.beginPath();
  ctx.moveTo(cx - R, yb);
  ctx.bezierCurveTo(cx - R, yt + 10, cx - R * 0.66, yt, cx, yt);
  ctx.bezierCurveTo(cx + R * 0.66, yt, cx + R, yt + 10, cx + R, yb);
  A.ellipse(ctx, cx, yb, R, R * v.k, 0, Math.PI);
  ctx.closePath();
  const g = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
  g.addColorStop(0, '#69747f');
  g.addColorStop(0.18, '#c3ceda');
  g.addColorStop(0.32, '#ffffff');
  g.addColorStop(0.46, '#dde5ed');
  g.addColorStop(0.66, '#9fabb7');
  g.addColorStop(0.86, '#c8d3dd');
  g.addColorStop(1, '#5f6a77');
  ctx.fillStyle = g;
  ctx.fill();
  // ふちの厚み（手前半分だけ。奥側を描くと「開いたボウル」に見えてしまう）
  ctx.beginPath();
  A.ellipse(ctx, cx, yb, R, R * v.k, 0, Math.PI);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#aeb9c5';
  ctx.stroke();
  ctx.beginPath();
  A.ellipse(ctx, cx, yb - 2.5, R, R * v.k, 0, Math.PI);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.stroke();
  // つまみ（大きく掴みやすい見た目）
  ctx.beginPath();
  ctx.moveTo(cx, yt + 4);
  ctx.lineTo(cx, yt - 10);
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#9aa6b2';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, yt - 20, 19, 0, TAU);
  const kg = ctx.createRadialGradient(cx - 7, yt - 28, 2, cx, yt - 20, 22);
  kg.addColorStop(0, '#ffc3ad');
  kg.addColorStop(0.5, '#ff7a59');
  kg.addColorStop(1, '#d8492a');
  ctx.fillStyle = kg;
  ctx.fill();
  if (glow > 0) {
    ctx.beginPath();
    ctx.arc(cx, yt - 20, 19 + glow * 8, 0, TAU);
    ctx.lineWidth = 3;
    ctx.strokeStyle = `rgba(255,255,255,${0.55 * (1 - glow)})`;
    ctx.stroke();
  }
  ctx.restore();
}

// 雪の結晶（冷却パネルの飾り）
function snowflake(c, x, y, r, alpha) {
  c.save();
  c.globalAlpha = alpha;
  c.translate(x, y);
  c.lineWidth = Math.max(1.4, r * 0.16);
  c.lineCap = 'round';
  c.strokeStyle = 'rgba(255,255,255,0.95)';
  for (let i = 0; i < 3; i++) {
    c.rotate(Math.PI / 3);
    c.beginPath();
    c.moveTo(-r, 0);
    c.lineTo(r, 0);
    c.stroke();
    c.beginPath();
    c.moveTo(r * 0.5, 0);
    c.lineTo(r * 0.72, -r * 0.24);
    c.moveTo(r * 0.5, 0);
    c.lineTo(r * 0.72, r * 0.24);
    c.moveTo(-r * 0.5, 0);
    c.lineTo(-r * 0.72, -r * 0.24);
    c.moveTo(-r * 0.5, 0);
    c.lineTo(-r * 0.72, r * 0.24);
    c.stroke();
  }
  c.restore();
}

function coldPanel(ctx, v, cover, time) {
  // 右から入ってくる、氷のように曇った冷蔵の扉
  if (cover <= 0.001) return;
  const w = v.w;
  const h = v.h;
  const x = lerp(w * 1.04, -w * 0.04, cover);
  const c = v.begin();
  c.save();
  const g = c.createLinearGradient(x, 0, x + w * 1.1, 0);
  g.addColorStop(0, 'rgba(224,244,255,0.86)');
  g.addColorStop(0.12, 'rgba(206,236,252,0.7)');
  g.addColorStop(0.6, 'rgba(190,228,248,0.66)');
  g.addColorStop(1, 'rgba(178,220,244,0.7)');
  c.fillStyle = g;
  c.fillRect(x, 0, w * 1.2, h);

  // 扉のふち（厚み）
  const eg = c.createLinearGradient(x - 4, 0, x + 22, 0);
  eg.addColorStop(0, 'rgba(255,255,255,0)');
  eg.addColorStop(0.45, 'rgba(255,255,255,0.7)');
  eg.addColorStop(1, 'rgba(214,238,250,0.25)');
  c.fillStyle = eg;
  c.fillRect(x - 4, 0, 26, h);

  // 取っ手
  c.save();
  c.shadowColor = 'rgba(70,110,140,0.35)';
  c.shadowBlur = 10;
  c.fillStyle = '#ffffff';
  const hy = h * 0.42;
  const hh = Math.min(h * 0.18, 150);
  c.lineCap = 'round';
  c.lineWidth = 17;
  c.strokeStyle = '#ffffff';
  c.beginPath();
  c.moveTo(x + 52, hy + 10);
  c.lineTo(x + 52, hy + hh - 10);
  c.stroke();
  c.lineWidth = 6;
  c.strokeStyle = 'rgba(190,224,244,0.9)';
  c.stroke();
  c.restore();

  // 霜と雪の結晶
  for (let i = 0; i < 9; i++) {
    const fx = x + 90 + ((i * 137) % Math.max(1, w * 0.85));
    const fy = ((i * 211) % Math.max(1, h * 0.86)) + h * 0.06 + Math.sin(time * 0.7 + i) * 6;
    snowflake(c, fx, fy, 10 + (i % 3) * 6, 0.35 + (i % 2) * 0.2);
  }
  c.restore();
}

// --- ステージ定義 -----------------------------------------------------------
// 各 stage: { id, verb, cam(v), enter(g), update(g,dt,input,v)->0..1,
//             draw(ctx,v,g), hint(v,g), hold(秒) }

const S = [];

// 1. あたためる: 透明な砂糖液がゆっくり琥珀色になる
S.push({
  id: 'caramelize',
  cam: () => ({ x: 18, y: 62, w: 275, h: 130, k: 0.5, anchor: 0.5 }),
  enter(g, v) {
    g.gesture = new DragGesture('y', 1, vDist(v, 0.72));
    g.leverAngle = -0.42;
    g.amber = 0;
  },
  update(g, dt, input) {
    const p = g.gesture.update(input, dt);
    g.amber = damp(g.amber, p, 4, dt);
    g.leverAngle = damp(g.leverAngle, input.active ? 0.85 : -0.42 + p * 0.25, 9, dt);
    g.flame = damp(g.flame || 0, 0.35 + p * 0.65, 3, dt);
    if (p > 0.12) {
      steamLoop.set(0.25 + p * 0.4);
      if (Math.random() < dt * (2 + p * 8)) sfx.bubble();
      if (Math.random() < dt * 16)
        emit(g.puffs, -45 + (Math.random() - 0.5) * 60, 56, 13, 1.8, (Math.random() - 0.5) * 10, 30);
    }
    stepParticles(g.puffs, dt);
    return p;
  },
  draw(ctx, v, g) {
    stove(ctx, v, -45);
    A.ground(ctx, v, -45, 0, 74, 0.35);
    flames(ctx, v, -45, 12, g.flame || 0, false);
    A.pot(ctx, v, {
      x: -45,
      base: 14,
      liquid: 0.55,
      color: sugarColor(g.amber),
      bubbles: 0.25 + g.amber * 0.75,
      time: v.time,
    });
    flames(ctx, v, -45, 12, g.flame || 0, true);
    A.steamPuffs(ctx, v, g.puffs, 'rgba(255,252,244,');
    lever(ctx, v, 118, g.leverAngle, g.pulse);
  },
  hint(v) {
    const a = hintAnchor(v);
    return {
      pts: [
        [a.x, a.y - a.span * 0.6],
        [a.x, a.y + a.span * 0.45],
      ],
      handRot: 0,
    };
  },
  hold: 0.9,
});

// 2. そそぐ: とろみのあるカラメルを型の底へ
S.push({
  id: 'pour-caramel',
  cam: () => ({ x: -52, y: 62, w: 236, h: 132, k: 0.52, anchor: 0.5 }),
  enter(g, v) {
    g.gesture = new DragGesture('x', 1, hDist(v, 0.78));
    g.potTilt = 0;
  },
  update(g, dt, input) {
    const p = g.gesture.update(input, dt);
    g.potTilt = damp(g.potTilt, p * 1.02, 8, dt);
    const pouring = g.potTilt > 0.34 && p < 0.999;
    g.pouring = pouring;
    g.caramelInMold = clamp(smooth((p - 0.22) / 0.68));
    pourLoop.set(pouring ? 0.8 : 0);
    if (pouring && Math.random() < dt * 14) {
      emit(g.puffs, 4 + (Math.random() - 0.5) * 26, 30, 4, 0.7, (Math.random() - 0.5) * 18, -6);
    }
    stepParticles(g.puffs, dt);
    return p;
  },
  draw(ctx, v, g) {
    A.ground(ctx, v, 0, 0, 62, 0.4);
    A.mold(ctx, v, { x: 0, base: 0, open: true, caramel: g.caramelInMold });
    const potX = -104 + g.potTilt * 16;
    A.pot(ctx, v, {
      x: potX,
      base: 84,
      tilt: g.potTilt,
      liquid: 0.55 * (1 - g.caramelInMold * 0.75),
      color: '#c9761b',
      time: v.time,
    });
    if (g.pouring) {
      const sp = A.vesselSpout(v, potX, 84, g.potTilt, 58, 40);
      const tp = A.moldPoolPoint(v, 0, 0, g.caramelInMold, 0);
      A.stream(ctx, v, {
        x0: sp.x,
        y0: sp.y,
        x1: tp.x,
        y1: tp.y,
        width: 9.5,
        time: v.time,
        c1: '#d98d29',
        c2: '#9c5510',
        hi: '#ffd79a',
      });
      A.splash(ctx, v, {
        lx: tp.x,
        ly: tp.y,
        r: 15 + Math.sin(v.time * 15) * 2.5,
        color: 'rgba(200,120,30,0.5)',
      });
    }
  },
  hint(v) {
    const a = hintAnchor(v);
    return {
      pts: [
        [a.x - a.span * 0.7, a.y],
        [a.x + a.span * 0.7, a.y],
      ],
      handRot: 0,
    };
  },
  hold: 1.0,
});

// 3. まぜる: 別容器で黄色い液を混ぜる（円運動）
S.push({
  id: 'mix',
  cam: () => ({ x: 0, y: 52, w: 202, h: 122, k: 0.62, anchor: 0.5 }),
  enter(g, v) {
    g.gesture = new CircleGesture(2.0);
    g.swirl = 0;
    g.mixed = 0;
  },
  update(g, dt, input, v) {
    const c = v.toScreen(0, 46);
    const p = g.gesture.update(input, c.x, c.y, dt);
    g.mixed = p;
    g.swirl = g.gesture.spin;
    whiskLoop.set(clamp(g.gesture.speed * 0.6));

  },
  draw(ctx, v, g) {
    A.ground(ctx, v, 0, 0, 78, 0.4);
    A.bowl(ctx, v, {
      x: 0,

      liquid: 0.72,
      mixed: g.mixed,
      swirl: g.swirl,

    });

    return { pts, circle: true, radius: r };

});

// 4. そそぐ: 型へ黄色い液。底の茶色と上の黄色が二層になる

// 7. かぶせる: 白い皿を型の上へ（「なんで皿をかぶせるの？」）
S.push({

// 8. ひっくりかえす: 大きな弧のスワイプで皿と型を一緒に 180 度
S.push({
  id: 'flip',
  cam: () => ({ x: 0, y: 46, w: 276, h: 180, k: 0.2, anchor: 0.5 }),
  enter(g, v) {
    g.gesture = new ArcGesture(hDist(v, 0.72, 480));
    g.flip = 0;
    g.flipDone = false;
    g.whooshed = false;
  },
  update(g, dt, input) {
    let p = g.gesture.update(input, dt);
    // 8 割まで回したら最後は自動で決まる（4 歳児への強い入力補正）
    if (p > 0.78) g.gesture.acc += g.gesture.dist * dt * 1.7;
    p = clamp(g.gesture.acc / g.gesture.dist);
    g.flip = damp(g.flip, p, 11, dt);
    if (!g.flipDone && p > 0.995) {
      g.flipDone = true;
      sfx.clack();
      g.shake = 0.7;
    }
    if (g.gesture.rate > 0.3 && !g.whooshed) {
      g.whooshed = true;
      sfx.whoosh();
    }
    return p;
  },
  draw(ctx, v, g) {
    const ang = g.flip * Math.PI;
    const hop = Math.sin(g.flip * Math.PI) * 30;
    const pivotY = (MOLD.h + PLATE.h) / 2;
    const px = v.X(0);
    const py = v.Y(pivotY + hop);
    A.ground(ctx, v, 0, 0, lerp(58, PLATE.r * 0.86, g.flip), 0.4 - Math.sin(g.flip * Math.PI) * 0.2);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    ctx.translate(-v.X(0), -v.Y(pivotY));
    A.mold(ctx, v, {
      x: 0,
      base: 0,
      open: false,
      caramel: g.caramelInMold,
      custard: g.custardInMold,
      set: true,
      frost: g.frost * 0.35,
    });
    A.plate(ctx, v, { x: 0, base: MOLD.h });
    ctx.restore();
  },
  hint(v) {
    const a = hintAnchor(v);
    const pts = [];
    const r = a.span * 0.95;
    for (let i = 0; i <= 20; i++) {
      const t = Math.PI + (i / 20) * Math.PI * 0.9;
      pts.push([a.x + Math.cos(t) * r, a.y + Math.sin(t) * r * 0.5 + r * 0.12]);
    }
    return { pts };
  },
  hold: 1.2,
});

// 9-11. かたをぬく → ぷるん → カラメルが流れる（最大のリプレイ磁石）
S.push({
  id: 'demold',
  cam: () => ({ x: 0, y: 58, w: 168, h: 152, k: 0.34, anchor: 0.52 }),
  enter(g, v) {
    g.gesture = new DragGesture('y', -1, vDist(v, 0.42, 340));
    g.lift = 0;
    g.moldRise = 0;
    g.released = false;
    g.relT = 0;
    g.caramelFlow = 0;
    g.wobble = 0;
    g.phase = 0;
    g.squash = 0;
    g.squashVel = 0;
    g.dropped = 0;
    g.dripSfx = 0;
  },
  camDynamic(t, g) {
    // 型を引き上げるあいだ、カメラがわずかに追う。外れた瞬間に少し引く。
    t.y += Math.min(g.moldRise || 0, 60) * 0.14;
    if (g.released) {
      const u = clamp((g.relT || 0) / 0.9);
      t.w *= 1 + 0.1 * u;
      t.h *= 1 + 0.1 * u;
    }
  },
  update(g, dt, input, v) {
    // 「もう一回」用: 型がプリンにかぶさりながら戻ってくる
    if (g.recap > 0) {
      g.recap -= dt;
      g.moldRise = damp(g.moldRise, 0, 5.5, dt);
      g.caramelFlow = damp(g.caramelFlow, 0, 6, dt);
      if (g.recap <= 0) {
        g.recap = 0;
        g.moldRise = 0;
        g.caramelFlow = 0;
        g.gesture.reset();
      }
      return 0;
    }
    if (!g.released) {
      const p = g.gesture.update(input, dt);
      g.lift = p;
      // 最後の数 mm は「くっついて」抵抗し、プリンがわずかに伸びる
      g.stick = smooth((p - 0.66) / 0.3);
      g.moldRise = damp(g.moldRise, (Math.min(p, 0.9) / 0.9) * 55, 14, dt);
      if (p >= 0.9) {
        g.released = true;
        g.relT = 0;
        sfx.purun();
        g.shake = 0.55;
        // 一度つぶれて、ぷるんと戻る（バネの初期変位 + 速度）
        g.squash = 0.17;
        g.squashVel = 0.7;
        g.wobble = 11.5;
        g.phase = 0;
      }
      return 0; // 抜けるまでは完了扱いにしない
    }
    // --- 解放後のシーケンス ---
    g.relT += dt;
    g.moldRise = damp(g.moldRise, 150, 6.5, dt);
    g.stick = 0;
    // バネ（squash）: ζ≈0.4 の減衰振動で 2〜3 回はずむ
    const k = 240,
      damping = 12;
    let left = dt;
    while (left > 0) {
      const h = Math.min(left, 1 / 240);
      g.squashVel += (0 - g.squash) * k * h - g.squashVel * damping * h;
      g.squash += g.squashVel * h;
      left -= h;
    }
    // 横揺れ（減衰振動）
    g.phase += dt * 17;
    g.wobble = Math.max(0, g.wobble - dt * g.wobble * 1.9);
    // カラメルが頂上から側面へ
    if (g.relT > 0.22) g.caramelFlow = clamp(g.caramelFlow + dt / 2.1);
    if (g.caramelFlow > 0.35 && g.dripSfx === 0) {
      g.dripSfx = 1;
      sfx.drip();
    }
    if (g.relT > 3.1) return 1;
    return 0;
  },
  draw(ctx, v, g) {
    A.plate(ctx, v, { x: 0, base: 0 });
    const hEffScale = 1 + (g.stick || 0) * 0.05;
    // まだ完全に型の中なら描かない（影が型の外へはみ出して正体を匂わせないように）
    if (g.released || g.moldRise > 0.6)
      A.pudding(ctx, v, {
      x: 0,
      base: PLATE.h,
      wobble: g.wobble,
      phase: g.phase,
      squash: g.squash + (g.stick ? -g.stick * 0.05 : 0),
      reveal: g.released ? 1 : clamp(g.moldRise / (PUD.h * hEffScale)),
      caramelFlow: g.caramelFlow,
    });
    A.mold(ctx, v, {
      x: 0,
      base: PLATE.h + g.moldRise,
      open: false,
      flipped: true,
    });
  },
  hint(v) {
    const a = hintAnchor(v);
    return {
      pts: [
        [a.x, a.y + a.span * 0.55],
        [a.x, a.y - a.span * 0.6],
      ],
      slow: true,
    };
  },
  hold: 0.4,
});

// 12. できあがり: カメラを少し引いて、初めて全体を見せる
S.push({
  id: 'reveal',
  // 少し引いて全体を見せる。横画面では右下のボタンを避けて被写体を左へ寄せる。
  cam: (v) => ({
    x: v.portrait ? 0 : 34,
    y: 42,
    w: 268,
    h: v.portrait ? 132 : 152,
    k: 0.42,
    anchor: v.portrait ? 0.46 : 0.42,
  }),

  enter(g, v) {
    g.revealT = 0;
    g.sparks = [];
    sfx.sparkle();
  },
  update(g, dt, input, v) {
    g.revealT += dt;
    g.phase += dt * 6.2;
    g.wobble = Math.max(0, g.wobble * (1 - dt * 1.4)) + Math.sin(g.revealT * 1.6) * 0.02;
    g.caramelFlow = clamp(g.caramelFlow + dt * 0.25);
    if (g.revealT < 1.6 && Math.random() < dt * 16) {
      const c = v.toScreen(0, 40);
      const a = Math.random() * TAU;
      const rr = 90 + Math.random() * 90;
      g.sparks.push({
        x: c.x + Math.cos(a) * rr,
        y: c.y + Math.sin(a) * rr * 0.7,
        r: 7 + Math.random() * 9,
        rot: Math.random() * TAU,
        life: 1,
        color: 'rgba(255,246,205,0.95)',
      });
    }
    for (let i = g.sparks.length - 1; i >= 0; i--) {
      const s = g.sparks[i];
      s.life -= dt * 0.9;
      s.rot += dt * 1.4;
      s.y -= dt * 12;
      if (s.life <= 0) g.sparks.splice(i, 1);
    }
    return 0; // ここで待機（リプレイ待ち）
  },
  draw(ctx, v, g) {
    A.plate(ctx, v, { x: 0, base: 0 });
    A.pudding(ctx, v, {
      x: 0,
      base: PLATE.h,
      wobble: g.wobble,
      phase: g.phase,
      squash: 0,
      caramelFlow: g.caramelFlow,
    });
  },
  hold: 0,
});

const STAGES = S;
const STAGE_INDEX = Object.fromEntries(S.map((s, i) => [s.id, i]));


// ================= src/main.js =================

// 「あまいひみつ」— 正体を最後まで隠すプリン工房
// 文字なし・タイマーなし・点数なし・ゲームオーバーなし。






const FAST = /[?&]fast=1/.test(location.search) || window.__E2E_FAST === true;

const canvas = document.getElementById('stage');
const view = new View(canvas);
const input = new Input(canvas);

// --- ゲーム状態 -------------------------------------------------------------
const g = {
  puffs: [],
  sparks: [],
  amber: 0,
  flame: 0,
  caramelInMold: 0,
  custardInMold: 0,
  mixed: 0,
  cold: 0,
  frost: 0,
  shake: 0,
  wobble: 0,
  phase: 0,
  squash: 0,
  caramelFlow: 0,
  moldRise: 0,
  stick: 0,
  recap: 0,
  pulse: 0,
};

const app = {
  mode: 'title', // 'title' | 'play'
  stage: 0,
  phase: 'play', // 'play' | 'outro'
  t: 0,
  outroT: 0,
  progress: 0,
  time: 0,
  buttons: [],
  fade: 0,
};

function safeInsets() {
  const el = document.getElementById('safe');
  if (!el) return { top: 0, bottom: 0 };
  const cs = getComputedStyle(el);
  return {
    top: parseFloat(cs.paddingTop) || 0,
    bottom: parseFloat(cs.paddingBottom) || 0,
  };
}

function resetGame() {
  Object.assign(g, {
    puffs: [],
    sparks: [],
    amber: 0,
    flame: 0,
    caramelInMold: 0,
    custardInMold: 0,
    mixed: 0,
    cold: 0,
    frost: 0,
    shake: 0,
    wobble: 0,
    phase: 0,
    squash: 0,
    caramelFlow: 0,
    moldRise: 0,
    stick: 0,
    recap: 0,
    released: false,
    cooked: 0,
    flip: 0,
    lift: 0,
  });
  stopAllLoops();
  app.stage = 0;
  app.phase = 'play';
  app.t = 0;
  app.outroT = 0;
  app.progress = 0;
  STAGES[0].enter(g, view);
  applyCamera(true);
}

function gotoStage(i, snapCam = false) {
  app.stage = i;
  app.phase = 'play';
  app.t = 0;
  app.outroT = 0;
  app.progress = 0;
  input.travel = 0;
  stopAllLoops(); // 前の工程の環境音を持ち越さない
  STAGES[i].enter(g, view);
  applyCamera(snapCam);
}

function applyCamera(snap = false) {
  const st = STAGES[app.stage];
  const target = st.cam(view);
  if (st.camDynamic) st.camDynamic(target, g);
  view.setTarget(target);
  if (snap) {
    view.snapToTarget();
    view.recompute();
  }
}

// --- リプレイ ---------------------------------------------------------------
function replayDemold() {
  sfx.tap();
  const i = STAGE_INDEX.demold;
  const keepFlow = g.caramelFlow;
  gotoStage(i);
  g.moldRise = 150;
  g.caramelFlow = keepFlow;
  g.recap = 1.0;
  g.wobble = 0;
  view.snapToTarget();
}

function restartAll() {
  sfx.tap();
  resetGame();
}

// --- 入力ハンドリング -------------------------------------------------------
function handleTap() {
  initAudio();
  for (const b of app.buttons) {
    if (Math.hypot(input.x - b.x, input.y - b.y) <= b.r * 1.35) {
      b.action();
      return true;
    }
  }
  if (app.mode === 'title') {
    sfx.chime();
    app.mode = 'play';
    resetGame();
    return true;
  }
  return false;
}

// --- ループ -----------------------------------------------------------------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 1 / 60;
  dt = Math.min(dt, 1 / 20); // タブ復帰などで飛ばない
  app.time += dt;
  view.time = app.time;

  if (view.resize(FAST)) {
    A.clearGradientCache();
    if (app.mode === 'play') applyCamera(true);
  }

  input.beginFrame(dt);
  if (input.tapped) handleTap();

  if (app.mode === 'title') {
    updateTitle(dt);
  } else {
    updatePlay(dt);
  }

  input.endFrame();
  requestAnimationFrame(frame);
}

function updateTitle(dt) {
  app.buttons.length = 0;
  view.setTarget({ x: 0, y: 46, w: 420, h: 160, k: 0.42, anchor: view.portrait ? 0.46 : 0.44 });
  view.update(dt);
  A.background(view.ctx, view, 0);
  const ctx = view.world();
  A.ground(ctx, view, 0, 0, 62, 0.4);
  A.mold(ctx, view, { x: 0, base: 0, open: true });
  A.pot(ctx, view, { x: -128, base: 8, liquid: 0.4, color: '#f2efe4', time: app.time });
  A.bowl(ctx, view, { x: 130, base: 0, liquid: 0.5, mixed: 1 });

  // ふわっと光る「触ってね」の手（型を隠さない位置に置く）
  const c = view.begin();
  const pulse = 0.5 + 0.5 * Math.sin(app.time * 2.4);
  const p = view.toScreen(0, 0);
  const hy = Math.min(view.h - 90, p.y + view.h * 0.16);
  c.save();
  c.beginPath();
  c.arc(p.x, hy, 44 + pulse * 14, 0, TAU);
  c.fillStyle = `rgba(255,255,255,${0.12 + pulse * 0.16})`;
  c.fill();
  c.restore();
  A.handIcon(c, p.x + 14, hy + 12, 1.25 + pulse * 0.1, 0.15, 0.95);
  drawMuteButton(c);
}

function updatePlay(dt) {
  const st = STAGES[app.stage];

  // 停滞したときの自動アシスト（詰まらせない）
  const assistAfter = st.id === 'demold' ? 26 : 16;
  if (app.phase === 'play' && g.gesture && input.idle > assistAfter && g.gesture.nudge) {
    g.gesture.nudge(dt);
  }

  if (app.phase === 'play') {
    app.t += dt;
    const p = st.update(g, dt, input, view) || 0;
    app.progress = p;
    if (p >= 0.999 && !st.auto) {
      app.phase = 'outro';
      app.outroT = 0;
      if (st.id !== 'demold') sfx.place();
    }
  } else {
    app.outroT += dt;
    const u = clamp(app.outroT / Math.max(0.001, st.hold));
    if (st.outro) st.outro(g, u);
    if (st.update && st.id === 'demold') st.update(g, dt, input, view);
    if (u >= 1) {
      const next = app.stage + 1;
      if (next < STAGES.length) {
        gotoStage(next);
      } else {
        app.phase = 'play';
      }
    }
  }

  if (g.shake > 0) {
    view.shake = Math.max(view.shake, g.shake);
    g.shake = 0;
  }
  applyCamera(false);
  view.update(dt);

  // 背景（冷却時は青みがかる）
  if (st.id !== 'chill') g.cold = damp(g.cold, 0, 0.9, dt);
  A.background(view.ctx, view, clamp(g.cold * 0.75));

  const ctx = view.world();
  st.draw(ctx, view, g);

  const c = view.begin();
  app.buttons.length = 0;
  if (g.sparks && g.sparks.length) A.sparkles(c, g.sparks);
  drawHint(c, st);
  drawUI(c, st);
}

// --- 誘導（文字なし） -------------------------------------------------------
function drawHint(c, st) {
  if (st.auto || app.phase !== 'play' || !st.hint) {
    g.pulse = 0;
    return;
  }
  if (st.id === 'demold' && (g.released || g.recap > 0)) {
    g.pulse = 0;
    return;
  }
  const warmup = app.t < 3.5 ? 0.7 : 1.6;
  const idle = Math.min(input.idle, 99);
  if (idle < warmup) {
    g.pulse = 0;
    return;
  }
  const a = clamp((idle - warmup) / 0.5);
  g.pulse = a * (0.5 + 0.5 * Math.sin(app.time * 3.2));
  const h = st.hint(view, g);
  if (!h || !h.pts || h.pts.length < 2) return;

  const period = h.slow ? 3.0 : 2.3;
  const u = (app.time % period) / period;
  const move = clamp(u / 0.72);
  const e = h.circle ? u : smooth(move);
  const idx = Math.min(h.pts.length - 1, Math.floor(e * (h.pts.length - 1)));
  const frac = e * (h.pts.length - 1) - idx;
  const p0 = h.pts[idx];
  const p1 = h.pts[Math.min(h.pts.length - 1, idx + 1)];
  const hx = lerp(p0[0], p1[0], frac);
  const hy = lerp(p0[1], p1[1], frac);

  A.guideArrow(c, h.pts, app.time * 46, a * 0.85);
  // 出発点のパルス
  const pr = 22 + 10 * (0.5 + 0.5 * Math.sin(app.time * 3.4));
  c.save();
  c.globalAlpha = a * 0.5;
  c.beginPath();
  c.arc(h.pts[0][0], h.pts[0][1], pr, 0, TAU);
  c.lineWidth = 5;
  c.strokeStyle = 'rgba(255,255,255,0.9)';
  c.stroke();
  c.restore();
  A.handIcon(c, hx, hy + 14, 1.15, 0, a);
}

// --- UI ---------------------------------------------------------------------
function iconButton(c, x, y, r, draw, tint = '#ff8a5c') {
  c.save();
  c.translate(x, y);
  c.beginPath();
  c.arc(0, 0, r, 0, TAU);
  const grd = c.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.05, 0, 0, r * 1.05);
  grd.addColorStop(0, 'rgba(255,255,255,0.55)');
  grd.addColorStop(0.32, tint);
  grd.addColorStop(1, '#c9401f');
  c.fillStyle = grd;
  c.shadowColor = 'rgba(90,50,15,0.35)';
  c.shadowBlur = 14;
  c.shadowOffsetY = 4;
  c.fill();
  c.shadowColor = 'transparent';
  c.lineWidth = 3;
  c.strokeStyle = 'rgba(255,255,255,0.8)';
  c.stroke();
  draw(c, r);
  c.restore();
}

function drawUI(c, st) {
  drawMuteButton(c);
  if (st.id !== 'reveal') return;
  const ins = safeInsets();
  const pulse = 0.5 + 0.5 * Math.sin(app.time * 2.6);
  const R = Math.min(52, Math.min(view.w, view.h) * 0.14);
  // 縦画面は下中央、横画面は右下（どちらでもプリンに指がかからない場所）
  const bottom = view.h - ins.bottom - (view.portrait ? 76 : 60);
  const centerX = view.portrait ? view.w * 0.5 : view.w - R * 1.35;

  // もう一度「型をぬく」
  const bx = view.portrait ? centerX + R * 0.9 : centerX;
  iconButton(
    c,
    bx,
    bottom,
    R * (1 + pulse * 0.03),
    (cc, r) => {
      const s = r / 52;
      cc.save();
      cc.scale(s, s);
      // 型（台形）を上へ持ち上げる、を表すアイコン
      cc.beginPath();
      cc.moveTo(-21, 26);
      cc.lineTo(-15, 4);
      cc.lineTo(15, 4);
      cc.lineTo(21, 26);
      cc.closePath();
      cc.fillStyle = 'rgba(255,255,255,0.97)';
      cc.fill();
      cc.beginPath();
      cc.moveTo(0, -30);
      cc.lineTo(14, -12);
      cc.lineTo(6, -12);
      cc.lineTo(6, -2);
      cc.lineTo(-6, -2);
      cc.lineTo(-6, -12);
      cc.lineTo(-14, -12);
      cc.closePath();
      cc.fillStyle = '#fff2cf';
      cc.fill();
      cc.restore();
    },
    '#ffa04d'
  );
  app.buttons.push({ x: bx, y: bottom, r: R, action: replayDemold });

  // 最初から
  const sr = R * 0.68;
  const sx = view.portrait ? centerX - R * 1.25 : centerX - R - sr - 14;
  iconButton(
    c,
    sx,
    bottom,
    sr,
    (cc, r) => {
      const s = r / 36;
      cc.save();
      cc.scale(s, s);
      cc.beginPath();
      cc.arc(0, 0, 14, 0.6, TAU * 0.86);
      cc.lineWidth = 6;
      cc.lineCap = 'round';
      cc.strokeStyle = 'rgba(255,255,255,0.95)';
      cc.stroke();
      cc.beginPath();
      cc.moveTo(14, -12);
      cc.lineTo(18, 2);
      cc.lineTo(4, -2);
      cc.closePath();
      cc.fillStyle = 'rgba(255,255,255,0.95)';
      cc.fill();
      cc.restore();
    },
    '#7fc4e8'
  );
  app.buttons.push({ x: sx, y: bottom, r: sr, action: restartAll });
}

function drawMuteButton(c) {
  const ins = safeInsets();
  const x = view.w - 30 - ins.top * 0.2;
  const y = 30 + ins.top;
  const r = 17;
  c.save();
  c.globalAlpha = 0.55;
  c.beginPath();
  c.arc(x, y, r, 0, TAU);
  c.fillStyle = 'rgba(255,255,255,0.75)';
  c.fill();
  c.beginPath();
  c.moveTo(x - 7, y - 3);
  c.lineTo(x - 3, y - 3);
  c.lineTo(x + 2, y - 8);
  c.lineTo(x + 2, y + 8);
  c.lineTo(x - 3, y + 3);
  c.lineTo(x - 7, y + 3);
  c.closePath();
  c.fillStyle = '#7b5230';
  c.fill();
  if (isMuted()) {
    c.beginPath();
    c.moveTo(x - 9, y - 9);
    c.lineTo(x + 9, y + 9);
    c.lineWidth = 3;
    c.strokeStyle = '#c0392b';
    c.stroke();
  } else {
    c.beginPath();
    c.arc(x + 4, y, 6, -0.9, 0.9);
    c.lineWidth = 2.5;
    c.strokeStyle = '#7b5230';
    c.stroke();
  }
  c.restore();
  app.buttons.push({
    x,
    y,
    r,
    action: () => {
      setMuted(!isMuted());
      if (!isMuted()) sfx.tap();
    },
  });
}

// --- 起動 -------------------------------------------------------------------
view.resize(FAST);
view.snapToTarget();
view.recompute();
requestAnimationFrame(frame);

window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    view.resize(FAST);
    A.clearGradientCache();
    if (app.mode === 'play') applyCamera(true);
  }, 120);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopAllLoops();
});

// --- E2E / デバッグ用フック --------------------------------------------------
window.__game = {
  app,
  g,
  view,
  input,
  STAGES,
  STAGE_INDEX,
  start() {
    initAudio();
    app.mode = 'play';
    resetGame();
  },
  jump(id) {
    if (app.mode !== 'play') this.start();
    gotoStage(STAGE_INDEX[id], true);
  },
  stageId: () => STAGES[app.stage].id,
  complete() {
    // 現在のステージのジェスチャを一気に満たす（自動プレイ検証用）
    const gs = g.gesture;
    if (!gs) return;
    if (gs.dist != null) gs.acc = gs.dist;
    else if (gs.need != null) gs.acc = gs.need;
    else if (gs.dur != null) gs.acc = gs.dur;
  },
};

</script>
</body>
</html>
