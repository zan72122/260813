// ================= src/view.js =================

// 固定エレベーション（正射影）カメラ。
// k = sin(仰角): 0 = 真横, 1 = 真上。hf = cos(仰角) = 高さの圧縮率。
//
// 画面は 3 枚重ね:
//   #back  Canvas2D … 背景・Hero より奥の小物（被写界深度の CSS ぼかしを掛ける）
//   #gl    WebGL2   … Hero 素材（プリン・カラメル・型・液体）
//   #front Canvas2D … Hero より手前の小物と、文字なし UI


class View {
  constructor(back, glCanvas, front) {
    this.canvas = back;
    this.glCanvas = glCanvas;
    this.frontCanvas = front;
    this.ctx = back.getContext('2d', { alpha: false, desynchronized: true });
    this.uctx = front.getContext('2d', { alpha: true, desynchronized: true });
    this.dpr = 1;
    this.w = 0;
    this.h = 0;
    this.portrait = true;
    // カメラは「ワールド上のどの箱を必ず画面に収めるか」で指定する。
    // こうすると iPhone / iPad の縦横どちらでも自動で最適な大きさになる。
    // x,y = 箱の中心 / w,h = 箱の大きさ（ワールド単位） / k = 仰角 / anchor = 箱中心の画面上の縦位置
    this.cam = { x: 0, y: 40, w: 280, h: 140, k: 0.42, anchor: 0.5 };
    this.target = { ...this.cam };
    this.shake = 0;
    this._shx = 0;
    this._shy = 0;
    this.s = 1;
    this.cx = 0;
    this.cy = 0;
    this.proj = ident();
    this.blur = 0;
    this.blurTarget = 0;
    this._appliedBlur = -1;
  }

  resize(fastMode) {
    const cap = fastMode ? 1 : 2;
    const w = Math.max(1, Math.round(window.innerWidth));
    const h = Math.max(1, Math.round(window.innerHeight));
    let dpr = Math.min(window.devicePixelRatio || 1, cap);
    // 大画面（iPad Pro など）で塗り面積が増えすぎないよう上限を掛ける。
    const maxPixels = 2600000;
    if (w * h * dpr * dpr > maxPixels) {
      dpr = Math.max(1, Math.sqrt(maxPixels / (w * h)));
    }
    if (this.w === w && this.h === h && this.dpr === dpr) return false;
    this.w = w;
    this.h = h;
    this.dpr = dpr;
    for (const c of [this.canvas, this.glCanvas, this.frontCanvas]) {
      if (!c) continue;
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      c.style.width = w + 'px';
      c.style.height = h + 'px';
    }
    this.portrait = h >= w;
    return true;
  }

  setTarget(t) {
    Object.assign(this.target, t);
  }

  snapToTarget() {
    Object.assign(this.cam, this.target);
  }

  // 被写界深度（背景側の CSS ぼかし）。工程ごとに変える。
  setBlur(px) {
    this.blurTarget = px;
  }

  update(dt) {
    const c = this.cam;
    const t = this.target;
    c.x = damp(c.x, t.x, 3.4, dt);
    c.y = damp(c.y, t.y, 3.4, dt);
    c.w = damp(c.w, t.w, 3.0, dt);
    c.h = damp(c.h, t.h, 3.0, dt);
    c.k = damp(c.k, t.k, 3.2, dt);
    c.anchor = damp(c.anchor, t.anchor, 3.2, dt);
    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 2.6);
      const a = this.shake * this.shake * 9;
      this._shx = (Math.random() * 2 - 1) * a;
      this._shy = (Math.random() * 2 - 1) * a;
    } else {
      this._shx = this._shy = 0;
    }
    this.blur = damp(this.blur, this.blurTarget, 4, dt);
    const bp = Math.round(this.blur * 4) / 4;
    if (bp !== this._appliedBlur) {
      this._appliedBlur = bp;
      this.canvas.style.filter = bp > 0.05 ? `blur(${bp}px)` : 'none';
    }
    this.recompute();
  }

  recompute() {
    const c = this.cam;
    this.k = clamp(c.k, 0.06, 0.95);
    this.hf = Math.sqrt(Math.max(0.05, 1 - this.k * this.k));
    // 指の置き場所（縦なら下、横なら右）を残して、残りに収める。
    const hb = this.portrait ? 0.94 : 0.8;
    const vb = this.portrait ? 0.64 : 0.74;
    const sw = (this.w * hb) / Math.max(1, c.w);
    const sh = (this.h * vb) / Math.max(1, c.h * this.hf);
    this.s = Math.min(sw, sh);
    this.cx = this.w / 2 + this._shx;
    this.cy = this.h * c.anchor + this._shy;
    this.updateProj();
  }

  // ワールド (X 右, Y 上, Z 手前) -> クリップ座標。
  // 2D レイヤーの式とまったく同じ結果になるように作ってあるので、
  // Canvas2D と WebGL の絵がピクセル単位で一致する。
  updateProj() {
    const m = this.proj;
    const s = this.s;
    const k = this.k;
    const hf = this.hf;
    const w = this.w;
    const h = this.h;
    const D = 600;
    m[0] = (2 * s) / w;
    m[1] = 0;
    m[2] = 0;
    m[3] = 0;
    m[4] = 0;
    m[5] = (2 * hf * s) / h;
    m[6] = -k / D;
    m[7] = 0;
    m[8] = 0;
    m[9] = (-2 * k * s) / h;
    m[10] = -hf / D;
    m[11] = 0;
    m[12] = (2 * this.cx) / w - 1 - (2 * s * this.cam.x) / w;
    m[13] = 1 - (2 * this.cy) / h - (2 * hf * s * this.cam.y) / h;
    m[14] = (k * this.cam.y) / D;
    m[15] = 1;
  }

  // 視線（物体から見て手前向き）
  viewDir() {
    return [0, this.k, this.hf];
  }

  // ワールド座標 -> 変換適用後のローカル座標
  X(wx) {
    return wx - this.cam.x;
  }
  Y(wy) {
    return (this.cam.y - wy) * this.hf;
  }
  // ワールド -> 画面(CSS px)
  toScreen(wx, wy) {
    return { x: this.cx + this.X(wx) * this.s, y: this.cy + this.Y(wy) * this.s };
  }
  // 画面(CSS px) -> ワールド
  toWorld(sx, sy) {
    return {
      x: (sx - this.cx) / this.s + this.cam.x,
      y: this.cam.y - (sy - this.cy) / this.s / this.hf,
    };
  }

  begin() {
    const ctx = this.ctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    return ctx;
  }

  world() {
    const ctx = this.ctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.translate(this.cx, this.cy);
    ctx.scale(this.s, this.s);
    return ctx;
  }

  // 手前レイヤー（毎フレーム透明にクリアする）
  uiBegin(clear = true) {
    const ctx = this.uctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (clear) ctx.clearRect(0, 0, this.w, this.h);
    return ctx;
  }

  uiWorld() {
    const ctx = this.uctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.translate(this.cx, this.cy);
    ctx.scale(this.s, this.s);
    return ctx;
  }
}


// ================= src/input.js =================

// 画面のどこを触っても操作できる、極めて寛容な入力層。
// 4歳児向け: 位置精度を要求しない / 進捗は減らない / 手ぶれを吸収する。

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.active = false;
    this.x = 0;
    this.y = 0;
    this.px = 0;
    this.py = 0;
    this.dx = 0;
    this.dy = 0;
    this.startX = 0;
    this.startY = 0;
    this.downTime = 0;
    this.idle = 0; // 最後に触ってからの秒数
    this.tapped = false; // このフレームで指が離れた（短い接触）
    this.everTouched = false;
    this._pending = { dx: 0, dy: 0 };
    this._id = null;

    const opt = { passive: false };
    canvas.addEventListener('pointerdown', this._down, opt);
    canvas.addEventListener('pointermove', this._move, opt);
    canvas.addEventListener('pointerup', this._up, opt);
    canvas.addEventListener('pointercancel', this._up, opt);
    canvas.addEventListener('pointerleave', this._up, opt);
    // iOS Safari のスクロール/ズームを完全に止める。
    canvas.addEventListener('touchstart', (e) => e.preventDefault(), opt);
    canvas.addEventListener('touchmove', (e) => e.preventDefault(), opt);
    canvas.addEventListener('gesturestart', (e) => e.preventDefault(), opt);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault(), opt);
  }

  _down = (e) => {
    if (this._id !== null) return; // 最初の指だけを見る（手のひらが当たっても壊れない）
    this._id = e.pointerId;
    try {
      this.canvas.setPointerCapture(e.pointerId);
    } catch {
      /* noop */
    }
    const p = this._pos(e);
    this.active = true;
    this.everTouched = true;
    this.x = this.px = this.startX = p.x;
    this.y = this.py = this.startY = p.y;
    this._pending.dx = 0;
    this._pending.dy = 0;
    this.downTime = 0;
    this.idle = 0;
    this.travel = 0;
    e.preventDefault();
  };

  _move = (e) => {
    if (e.pointerId !== this._id) return;
    const p = this._pos(e);
    this._pending.dx += p.x - this.x;
    this._pending.dy += p.y - this.y;
    this.x = p.x;
    this.y = p.y;
    this.idle = 0;
    e.preventDefault();
  };

  _up = (e) => {
    if (e.pointerId !== this._id) return;
    this._id = null;
    this.active = false;
    this.tapped = this.downTime < 0.35;
    e.preventDefault();
  };

  _pos(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  // 毎フレーム先頭で呼ぶ。
  beginFrame(dt) {
    this.dx = this._pending.dx;
    this.dy = this._pending.dy;
    this._pending.dx = 0;
    this._pending.dy = 0;
    this.px = this.x - this.dx;
    this.py = this.y - this.dy;
    if (this.active) {
      this.downTime += dt;
      this.idle = 0;
      this.travel = (this.travel || 0) + Math.hypot(this.dx, this.dy);
    } else {
      this.idle += dt;
    }
  }

  endFrame() {
    this.tapped = false;
  }

  get moveLen() {
    return Math.hypot(this.dx, this.dy);
  }
}

// --- ジェスチャ認識器 ------------------------------------------------------
// いずれも 0..1 の進捗を「増やすだけ」。逆方向の手ぶれで戻ることはない。

// 円運動（混ぜる）。中心からずれていても、ぐるぐるでも往復でも進む。
class CircleGesture {
  constructor(turns = 2.2) {
    this.need = turns * TAU;
    this.acc = 0;
    this.angle = 0;
    this.has = false;
    this.spin = 0; // 見た目用の回転角
    this.speed = 0;
    this.ex = 0; // 回転中心の推定値（指の移動平均）
    this.ey = 0;
  }
  reset() {
    this.acc = 0;
    this.has = false;
    this.spin = 0;
    this.speed = 0;
  }
  nudge(dt) {
    this.acc += this.need * dt * 0.12;
    this.spin += dt * 2.4;
  }
  // cx, cy は「まだ触っていないとき」の初期中心（ボウルの位置）。
  // 触り始めたら指の移動平均を中心として使うので、画面のどこで回しても成立する。
  update(input, cx, cy, dt) {
    let gain = 0;
    if (input.active) {
      if (!this.has) {
        this.ex = input.x;
        this.ey = input.y;
      } else {
        const l = 1 - Math.exp(-2.6 * dt);
        this.ex += (input.x - this.ex) * l;
        this.ey += (input.y - this.ey) * l;
      }
      const a = Math.atan2(input.y - this.ey, input.x - this.ex);
      const r = Math.hypot(input.y - this.ey, input.x - this.ex);
      if (this.has && r > 10) {
        // 回転成分（半径が小さいと角度が暴れるので上限を掛ける）
        gain += Math.min(Math.abs(angleDelta(a, this.angle)), 0.5);
      }
      this.angle = a;
      this.has = true;
      // 直線的にゴシゴシ動かすだけでも進むよう、移動距離でも加点。
      gain += input.moveLen / 750;
      this.spin += Math.max(gain, input.moveLen / 600) * 2.6;
    } else {
      this.has = false;
    }
    this.speed = this.speed * Math.exp(-6 * dt) + gain * 10;
    this.acc += gain;
    return clamp(this.acc / this.need);
  }
}

// 一方向ドラッグ（注ぐ / 持ち上げる / 蓋を下ろす）。
// axis: 'x' | 'y', sign: +1 | -1。distance は CSS px。
class DragGesture {
  constructor(axis, sign, distance) {
    this.axis = axis;
    this.sign = sign;
    this.dist = distance;
    this.acc = 0;
    this.rate = 0;
  }
  reset() {
    this.acc = 0;
    this.rate = 0;
  }
  nudge(dt) {
    this.acc += this.dist * dt * 0.12;
  }
  update(input, dt) {
    let d = 0;
    if (input.active) {
      const main = this.axis === 'x' ? input.dx : input.dy;
      const cross = this.axis === 'x' ? input.dy : input.dx;
      // 斜めでも通す。逆方向は無視（減らさない）。
      d = Math.max(0, main * this.sign) + Math.abs(cross) * 0.12;
    }
    this.rate = this.rate * Math.exp(-8 * dt) + (d / Math.max(dt, 1e-3)) * 0.002;
    this.acc += d;
    return clamp(this.acc / this.dist);
  }
}

// 大きな弧のスワイプ（ひっくり返す）。左右どちらでも成立する。
class ArcGesture {
  constructor(distance) {
    this.dist = distance;
    this.acc = 0;
    this.dir = 0;
    this.rate = 0;
  }
  reset() {
    this.acc = 0;
    this.dir = 0;
    this.rate = 0;
  }
  nudge(dt) {
    this.acc += this.dist * dt * 0.12;
  }
  update(input, dt) {
    let d = 0;
    if (input.active) {
      if (this.dir === 0 && Math.abs(input.dx) > 2) this.dir = Math.sign(input.dx);
      const h = this.dir === 0 ? Math.abs(input.dx) : input.dx * this.dir;
      d = Math.max(0, h) + Math.max(0, -input.dy) * 0.35; // 上向きの弧も加点
    }
    this.rate = this.rate * Math.exp(-8 * dt) + (d / Math.max(dt, 1e-3)) * 0.002;
    this.acc += d;
    return clamp(this.acc / this.dist);
  }
}

// 押さえ続ける / こする（加熱レバー）。触れていれば進む。
class HoldGesture {
  constructor(duration) {
    this.dur = duration;
    this.acc = 0;
  }
  reset() {
    this.acc = 0;
  }
  nudge(dt) {
    this.acc += this.dur * dt * 0.12;
  }
  update(input, dt) {
    if (input.active) this.acc += dt * (1 + Math.min(input.moveLen, 30) / 60);
    return clamp(this.acc / this.dur);
  }
}


// ================= src/audio.js =================

// WebAudio による効果音。外部アセットなし。最初のタップで初期化（iOS 対策）。
let ctx = null;
let master = null;
let noiseBuf = null;
let muted = false;

function initAudio() {
  if (ctx) {
    if (ctx.state === 'suspended') ctx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    ctx = new AC();
  } catch {
    return;
  }
  master = ctx.createGain();
  master.gain.value = 0.5;
  master.connect(ctx.destination);
  const len = Math.floor(ctx.sampleRate * 1.5);
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}

function setMuted(v) {
  muted = v;
  if (master) master.gain.value = v ? 0 : 0.5;
}
function isMuted() {
  return muted;
}

const now = () => (ctx ? ctx.currentTime : 0);

function tone(freq, dur, type = 'sine', gain = 0.2, glideTo = null) {
  if (!ctx || muted) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, now());
  if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, now() + dur);
  g.gain.setValueAtTime(0.0001, now());
  g.gain.exponentialRampToValueAtTime(gain, now() + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, now() + dur);
  o.connect(g).connect(master);
  o.start();
  o.stop(now() + dur + 0.05);
}

function noise(dur, freq, q, gain = 0.2, sweepTo = null) {
  if (!ctx || muted) return;
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf;
  s.loop = true;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(freq, now());
  f.Q.value = q;
  if (sweepTo) f.frequency.linearRampToValueAtTime(sweepTo, now() + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now());
  g.gain.exponentialRampToValueAtTime(gain, now() + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, now() + dur);
  s.connect(f).connect(g).connect(master);
  s.start();
  s.stop(now() + dur + 0.05);
}

// --- ループ音（注ぐ / 湯気 / 混ぜる） ---
class Loop {
  constructor(make) {
    this.make = make;
    this.node = null;
    this.gain = null;
  }
  set(level) {
    if (!ctx || muted) return;
    level = Math.max(0, Math.min(1, level));
    if (level > 0.02 && !this.node) {
      const built = this.make(ctx);
      this.node = built.src;
      this.gain = built.gain;
      this.gain.connect(master);
      this.node.start();
    }
    if (this.gain) this.gain.gain.setTargetAtTime(level * 0.16, now(), 0.06);
    if (level <= 0.02 && this.node) {
      const n = this.node;
      const g = this.gain;
      this.node = null;
      this.gain = null;
      g.gain.setTargetAtTime(0.0001, now(), 0.05);
      setTimeout(() => {
        try {
          n.stop();
        } catch {
          /* noop */
        }
      }, 400);
    }
  }
  stop() {
    this.set(0);
  }
}

const mkNoiseLoop = (freq, q) => (c) => {
  const src = c.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;
  const f = c.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = freq;
  f.Q.value = q;
  const gain = c.createGain();
  gain.gain.value = 0.0001;
  src.connect(f).connect(gain);
  return { src, gain };
};

const pourLoop = new Loop(mkNoiseLoop(700, 1.2));
const steamLoop = new Loop(mkNoiseLoop(3200, 0.7));
const whiskLoop = new Loop(mkNoiseLoop(1800, 2.2));
const coldLoop = new Loop(mkNoiseLoop(420, 0.9));

function stopAllLoops() {
  pourLoop.stop();
  steamLoop.stop();
  whiskLoop.stop();
  coldLoop.stop();
}

  // ぷるん（型から外れる瞬間）: ピッチが下がり、軽く揺れる

// ================= src/gl/hero.js =================

// Hero 素材（プリン・カラメル・銀の型・皿・液体）を WebGL2 で描くレイヤー。
// 描画順:
//   1. 背景の縮小コピーを alpha=0 で敷く（屈折で拾うためだけの下地）
//   2. 不透明（皿・型）を深度つきで描く
//   3. ここまでをコピー（これが「背後」になる）
//   4. 屈折する物（プリン・液体・注ぐ流れ）を描く
//   5. しきい値抽出 → ぼかし → トーンマップして画面へ






const RENDER_SCALE = [0.62, 0.85, 1.0];

class Hero {
  constructor(canvas) {
    this.ok = false;
    const gl = createGL(canvas);
    if (!gl) return;
    this.gl = gl;
    this.canvas = canvas;
    try {
      this._init();
      this.ok = true;
    } catch (e) {
      console.error('[hero] init failed', e);
      this.ok = false;
    }
  }

  _init() {
    const gl = this.gl;
    this.progPudding = program(gl, S.VS_LATHE, S.FS_PUDDING, 'pudding');
    this.progMetal = program(gl, S.VS_LATHE, S.FS_METAL, 'metal');
    this.progCeramic = program(gl, S.VS_LATHE, S.FS_CERAMIC, 'ceramic');
    this.progLiquid = program(gl, S.VS_LATHE, S.FS_LIQUID, 'liquid');
    this.progTube = program(gl, S.VS_TUBE, S.FS_TUBE, 'tube');
    this.progBackdrop = program(gl, S.VS_FULL, S.FS_BACKDROP, 'backdrop');
    this.progThreshold = program(gl, S.VS_FULL, S.FS_THRESHOLD, 'threshold');
    this.progBlur = program(gl, S.VS_FULL, S.FS_BLUR, 'blur');
    this.progComposite = program(gl, S.VS_FULL, S.FS_COMPOSITE, 'composite');
    this.progField = program(gl, S.VS_FULL, S.FS_FIELD, 'field');
    if (!this.progPudding || !this.progMetal || !this.progComposite) {
      throw new Error('shader compilation failed');
    }

    const env = bakeEnv(gl);
    this.envTex = env.tex;
    this.envMaxLod = env.maxLod;
    this.detailTex = bakeDetail(gl);

    this.meshes = {
      pudding: G.upload(gl, this.progPudding, G.lathe(G.puddingProfile(PUD.rb, PUD.rt, PUD.h), 56, { height: PUD.h })),
      mold: G.upload(gl, this.progMetal, G.lathe(G.moldProfile(MOLD.rb, MOLD.rt, MOLD.h, MOLD.wall), 56, { height: MOLD.h })),
      plate: G.upload(gl, this.progCeramic, G.lathe(G.plateProfile(PLATE.r, PLATE.h), 64, { height: PLATE.h + 2 })),
      liquid: G.upload(gl, this.progLiquid, G.lathe(G.liquidProfile(1), 48, { height: 1.7 })),
      pot: G.upload(gl, this.progMetal, G.lathe(G.potProfile(52, 62, 40, 3.2), 48, { height: 40 })),
      bowl: G.upload(gl, this.progCeramic, G.lathe(G.bowlProfile(74, 46, 3.6), 48, { height: 46 })),
    };

    this.fsVao = fullscreenVAO(gl);
    this.field = new Target(gl, 512, 256, {});
    this.fieldFlow = -1;
    this.main = null;
    this.ms = null;
    this.samples = 0;
    this.scene = null;
    this.bloomA = null;
    this.bloomB = null;

    // 屈折用に 2D レイヤーを縮小して取り込むための作業キャンバス
    this.refCanvas = document.createElement('canvas');
    this.refCtx = this.refCanvas.getContext('2d', { alpha: false });
    this.refTex = texture(gl, {});

    // 動的なチューブ（注ぐ流れ）
    this.tube = this._makeTube(24, 10);

    this.model = M.ident();
    this.nrm = new Float32Array(9);
    this.cmds = { opaque: [], refract: [] };
    this.warmed = false;
  }

  _makeTube(segs, ring) {
    const gl = this.gl;
    const n = (segs + 1) * (ring + 1);
    const pos = new Float32Array(n * 3);
    const nrm = new Float32Array(n * 3);
    const uv = new Float32Array(n * 3);
    const idx = [];
    for (let i = 0; i < segs; i++) {
      for (let j = 0; j < ring; j++) {
        const a = i * (ring + 1) + j;
        idx.push(a, a + ring + 1, a + 1, a + 1, a + ring + 1, a + ring + 2);
      }
    }
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const mk = (name, arr, size) => {
      const loc = this.progTube.a[name];
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
      if (loc != null && loc >= 0) {
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
      }
      return b;
    };
    const bPos = mk('aPos', pos, 3);
    const bNrm = mk('aNrm', nrm, 3);
    const bUv = mk('aUv', uv, 3);
    const ib = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { vao, bPos, bNrm, bUv, pos, nrm, uv, count: idx.length, segs, ring };
  }

  resize(view, tier) {
    const gl = this.gl;
    const scale = RENDER_SCALE[tier] ?? 1;
    const w = Math.max(2, Math.round(view.w * view.dpr * scale));
    const h = Math.max(2, Math.round(view.h * view.dpr * scale));
    if (this.canvas.width !== w || this.canvas.height !== h) {
      this.canvas.width = w;
      this.canvas.height = h;
      this.canvas.style.width = view.w + 'px';
      this.canvas.style.height = view.h + 'px';
    }
    const half = { half: true };
    // ジャギーは「安い 3D」に見える最大の原因なので、余裕がある層では MSAA を使う
    const want = tier >= TIER.HIGH ? 4 : 0;
    if (!this.main) {
      this.main = new Target(gl, w, h, { ...half, depth: true });
      this.scene = new Target(gl, w, h, half);
      this.bloomA = new Target(gl, w >> 2, h >> 2, half);
      this.bloomB = new Target(gl, w >> 2, h >> 2, half);
    } else {
      this.main.resize(w, h);
      this.scene.resize(w, h);
      this.bloomA.resize(Math.max(2, w >> 2), Math.max(2, h >> 2));
      this.bloomB.resize(Math.max(2, w >> 2), Math.max(2, h >> 2));
    }
    if (want !== this.samples) {
      this.samples = want;
      this.ms = null;
    }
    if (this.samples > 0) {
      const max = gl.getParameter(gl.MAX_SAMPLES) || 0;
      const sm = Math.min(this.samples, max);
      if (sm <= 0) {
        this.samples = 0;
        this.ms = null;
      } else if (!this.ms) {
        const t = new MSTarget(gl, w, h, sm, true);
        this.ms = t.complete ? t : null;
        if (!this.ms) this.samples = 0;
      } else {
        this.ms.resize(w, h);
      }
    }
    const rw = Math.max(8, Math.round(view.w / 4));
    const rh = Math.max(8, Math.round(view.h / 4));
    if (this.refCanvas.width !== rw || this.refCanvas.height !== rh) {
      this.refCanvas.width = rw;
      this.refCanvas.height = rh;
    }
  }

  // --- シーン記述 -----------------------------------------------------------
  begin() {
    this.cmds.opaque.length = 0;
    this.cmds.refract.length = 0;
  }
  plate(o) {
    this.cmds.opaque.push({ t: 'plate', o });
  }
  mold(o) {
    this.cmds.opaque.push({ t: 'mold', o });
  }
  pot(o) {
    this.cmds.opaque.push({ t: 'pot', o });
  }
  bowl(o) {
    this.cmds.opaque.push({ t: 'bowl', o });
  }
  pudding(o) {
    this.cmds.refract.push({ t: 'pudding', o });
  }
  liquid(o) {
    this.cmds.refract.push({ t: 'liquid', o });
  }
  stream(o) {
    this.cmds.refract.push({ t: 'stream', o });
  }
  get empty() {
    return this.cmds.opaque.length === 0 && this.cmds.refract.length === 0;
  }

  // --- 描画 -----------------------------------------------------------------
  render(view, backCanvas, tier, time) {
    const gl = this.gl;
    this.resize(view, tier);
    const refract = tier >= TIER.MID ? 1 : 0;
    const bloom = tier >= TIER.MID;

    // カラメルの厚み場（flow が動いたときだけ焼き直す）
    let flow = 0;
    for (const c of this.cmds.refract) if (c.t === 'pudding') flow = Math.max(flow, c.o.caramelFlow || 0);
    if (Math.abs(flow - this.fieldFlow) > 0.004) {
      this.fieldFlow = flow;
      this._bakeField(flow);
    }

    // 屈折用の背景取り込み
    if (refract && backCanvas) {
      this.refCtx.drawImage(backCanvas, 0, 0, this.refCanvas.width, this.refCanvas.height);
      gl.bindTexture(gl.TEXTURE_2D, this.refTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, this.refCanvas);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    }

    const rt = this.ms || this.main;
    rt.bind();
    gl.clearColor(0, 0, 0, 0);
    gl.clearDepth(1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.frontFace(gl.CCW);
    gl.disable(gl.BLEND);

    // 1. 背景の下地（alpha=0 なので合成では見えないが、屈折では拾える）
    if (refract && backCanvas) {
      gl.disable(gl.DEPTH_TEST);
      gl.useProgram(this.progBackdrop);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.refTex);
      gl.uniform1i(this.progBackdrop.u.uTex, 0);
      gl.bindVertexArray(this.fsVao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.depthMask(true);

    // 2. 不透明
    for (const c of this.cmds.opaque) {
      if (c.t === 'plate') this._drawPlate(view, c.o);
      else if (c.t === 'mold') this._drawMold(view, c.o);
      else if (c.t === 'pot') this._drawVessel(view, c.o, this.meshes.pot, 'metal', 40);
      else if (c.t === 'bowl') this._drawVessel(view, c.o, this.meshes.bowl, 'ceramic', 46);
    }

    // 3. 背後をコピー（MSAA はここで解決される）
    if (refract) {
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, rt.fbo);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, this.scene.fbo);
      gl.blitFramebuffer(
        0, 0, rt.w, rt.h,
        0, 0, this.scene.w, this.scene.h,
        gl.COLOR_BUFFER_BIT, gl.NEAREST
      );
      rt.bind();
    }

    // 4. 屈折する物
    for (const c of this.cmds.refract) {
      if (c.t === 'pudding') this._drawPudding(view, c.o, refract);
      else if (c.t === 'liquid') this._drawLiquid(view, c.o, refract, time);
      else if (c.t === 'stream') this._drawStream(view, c.o, refract);
    }

    // 5. MSAA を解決してからポストへ
    if (this.ms) {
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, this.ms.fbo);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, this.main.fbo);
      gl.blitFramebuffer(
        0, 0, this.ms.w, this.ms.h,
        0, 0, this.main.w, this.main.h,
        gl.COLOR_BUFFER_BIT, gl.NEAREST
      );
    }
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
    gl.bindVertexArray(this.fsVao);
    if (bloom) {
      this.bloomA.bind();
      gl.useProgram(this.progThreshold);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.main.tex);
      gl.uniform1i(this.progThreshold.u.uTex, 0);
      gl.uniform1f(this.progThreshold.u.uThreshold, 0.82);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      for (let pass = 0; pass < 2; pass++) {
        const src = pass === 0 ? this.bloomA : this.bloomB;
        const dst = pass === 0 ? this.bloomB : this.bloomA;
        dst.bind();
        gl.useProgram(this.progBlur);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, src.tex);
        gl.uniform1i(this.progBlur.u.uTex, 0);
        gl.uniform2f(
          this.progBlur.u.uDir,
          pass === 0 ? 1.4 / dst.w : 0,
          pass === 0 ? 0 : 1.4 / dst.h
        );
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(this.progComposite);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.main.tex);
    gl.uniform1i(this.progComposite.u.uTex, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, bloom ? this.bloomA.tex : this.main.tex);
    gl.uniform1i(this.progComposite.u.uBloom, 1);
    gl.uniform1f(this.progComposite.u.uBloomAmt, bloom ? 1.05 : 0.0);
    gl.uniform1f(this.progComposite.u.uExposure, 1.12);
    gl.uniform1f(this.progComposite.u.uGrain, tier >= TIER.MID ? 0.012 : 0.0);
    gl.uniform1f(this.progComposite.u.uTime, time);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  }

  _bakeField(flow) {
    const gl = this.gl;
    this.field.bind();
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
    gl.disable(gl.BLEND);
    gl.useProgram(this.progField);
    gl.uniform1f(this.progField.u.uFlow, flow);
    gl.bindVertexArray(this.fsVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  }

  _common(prog, view) {
    const gl = this.gl;
    gl.useProgram(prog);
    gl.uniformMatrix4fv(prog.u.uProj, false, view.proj);
    const v = view.viewDir();
    gl.uniform3f(prog.u.uV, v[0], v[1], v[2]);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.envTex);
    gl.uniform1i(prog.u.uEnv, 0);
    gl.uniform1f(prog.u.uEnvMaxLod, this.envMaxLod);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.detailTex);
    if (prog.u.uDetail) gl.uniform1i(prog.u.uDetail, 1);
  }

  _setModel(prog, o, sxz = 1, sy = 1) {
    const gl = this.gl;
    const m = this.model;
    M.translate(m, o.x || 0, o.base || 0, o.z || 0);
    if (o.rotX || o.rotZ) {
      const t = M.ident();
      M.translate(t, 0, o.pivotY || 0, 0);
      M.mul(m, m, t);
      if (o.rotX) {
        M.rotateX(t, o.rotX);
        M.mul(m, m, t);
      }
      if (o.rotZ) {
        M.rotateZ(t, o.rotZ);
        M.mul(m, m, t);
      }
      M.translate(t, 0, -(o.pivotY || 0), 0);
      M.mul(m, m, t);
    }
    if (o.localY) {
      const t = M.translate(M.ident(), 0, o.localY, 0);
      M.mul(m, m, t);
    }
    if (o.flip) {
      const t = M.scale(M.ident(), 1, -1, 1);
      M.mul(m, m, t);
      const t2 = M.translate(M.ident(), 0, -(o.flipH || 0), 0);
      M.mul(m, m, t2);
    }
    if (sxz !== 1 || sy !== 1) {
      const t = M.scale(M.ident(), sxz, sy, sxz);
      M.mul(m, m, t);
    }
    gl.uniformMatrix4fv(prog.u.uModel, false, m);
    // 回転 + 対角スケールの法線行列
    const n = this.nrm;
    M.normalMat3(n, m);
    const isx = 1 / (sxz || 1);
    const isy = 1 / (sy || 1);
    n[0] *= isx * isx;
    n[1] *= isx * isx;
    n[2] *= isx * isx;
    n[3] *= isy * isy;
    n[4] *= isy * isy;
    n[5] *= isy * isy;
    n[6] *= isx * isx;
    n[7] *= isx * isx;
    n[8] *= isx * isx;
    gl.uniformMatrix3fv(prog.u.uNormal, false, n);
    // 変形パラメータ（プリン以外は 0）
    gl.uniform1f(prog.u.uHeight, o.height || 1);
    gl.uniform1f(prog.u.uWobble, o.wobble || 0);
    gl.uniform1f(prog.u.uPhase, o.phase || 0);
    gl.uniform1f(prog.u.uSquash, o.squash || 0);
    gl.uniform1f(prog.u.uStick, o.stick || 0);
  }

  _drawMesh(mesh) {
    const gl = this.gl;
    gl.bindVertexArray(mesh.vao);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    gl.bindVertexArray(null);
  }

  _drawPlate(view, o) {
    const gl = this.gl;
    const p = this.progCeramic;
    this._common(p, view);
    this._setModel(p, { ...o, height: PLATE.h + 2 });
    gl.uniform3f(p.u.uBouncePos, o.x || 0, o.base || 0, 0);
    const bc = o.bounceColor || [0.55, 0.32, 0.08];
    gl.uniform3f(p.u.uBounceColor, bc[0], bc[1], bc[2]);
    gl.uniform1f(p.u.uBounceAmt, o.bounce ?? 0);
    const o0 = o.occ0 || [0, 0, 1, 0];
    const o1 = o.occ1 || [0, 0, 1, 0];
    gl.uniform4f(p.u.uOcc0, o0[0], o0[1], o0[2], o0[3]);
    gl.uniform4f(p.u.uOcc1, o1[0], o1[1], o1[2], o1[3]);
    this._drawMesh(this.meshes.plate);
  }

  _drawMold(view, o) {
    const gl = this.gl;
    const p = this.progMetal;
    this._common(p, view);
    this._setModel(p, { ...o, height: MOLD.h, flipH: MOLD.h });
    gl.uniform1f(p.u.uRibs, o.ribs ?? 1);
    gl.uniform1f(p.u.uFrost, o.frost ?? 0);
    const t = o.tint || [0.93, 0.94, 0.96];
    gl.uniform3f(p.u.uTint, t[0], t[1], t[2]);
    // 反転すると三角形の巻き方向が裏返るので front face を切り替える
    gl.frontFace(o.flip ? gl.CW : gl.CCW);
    this._drawMesh(this.meshes.mold);
    gl.frontFace(gl.CCW);
  }

  _drawVessel(view, o, mesh, kind, height) {
    const gl = this.gl;
    const p = kind === 'metal' ? this.progMetal : this.progCeramic;
    this._common(p, view);
    this._setModel(p, { ...o, height });
    if (kind === 'metal') {
      gl.uniform1f(p.u.uRibs, o.ribs ?? 0);
      gl.uniform1f(p.u.uFrost, o.frost ?? 0);
      const t = o.tint || [0.93, 0.94, 0.96];
      gl.uniform3f(p.u.uTint, t[0], t[1], t[2]);
    } else {
      gl.uniform3f(p.u.uBouncePos, o.x || 0, o.base || 0, 0);
      const bc = o.bounceColor || [0.5, 0.35, 0.1];
      gl.uniform3f(p.u.uBounceColor, bc[0], bc[1], bc[2]);
      gl.uniform1f(p.u.uBounceAmt, o.bounce ?? 0);
      gl.uniform4f(p.u.uOcc0, 0, 0, 1, 0);
      gl.uniform4f(p.u.uOcc1, 0, 0, 1, 0);
    }
    this._drawMesh(mesh);
  }

  _drawPudding(view, o, refract) {
    const gl = this.gl;
    const p = this.progPudding;
    this._common(p, view);
    this._setModel(p, { ...o, height: PUD.h });
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, this.field.tex);
    gl.uniform1i(p.u.uField, 2);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, this.scene.tex);
    gl.uniform1i(p.u.uScene, 3);
    gl.uniform1f(p.u.uRefract, refract);
    gl.uniform1f(p.u.uCaramel, o.caramel ?? 1);
    gl.uniform1f(p.u.uHeightW, PUD.h);
    this._drawMesh(this.meshes.pudding);
  }

  _drawLiquid(view, o, refract, time) {
    const gl = this.gl;
    const p = this.progLiquid;
    this._common(p, view);
    this._setModel(p, { ...o, height: 1.7 }, o.r || 1, 1);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, this.scene.tex);
    gl.uniform1i(p.u.uScene, 3);
    gl.uniform1f(p.u.uRefract, refract);
    const s = o.sigma || [0.01, 0.02, 0.05];
    gl.uniform3f(p.u.uSigma, s[0], s[1], s[2]);
    gl.uniform1f(p.u.uDepth, o.depth ?? 6);
    gl.uniform1f(p.u.uRough, o.rough ?? 0.05);
    gl.uniform1f(p.u.uBoil, o.boil ?? 0);
    gl.uniform1f(p.u.uTime, time);
    gl.disable(gl.CULL_FACE);
    this._drawMesh(this.meshes.liquid);
    gl.enable(gl.CULL_FACE);
  }

  _drawStream(view, o, refract) {
    const gl = this.gl;
    const t = this.tube;
    const pts = o.points;
    const segs = t.segs;
    const ring = t.ring;
    let w = 0;
    for (let i = 0; i <= segs; i++) {
      const u = i / segs;
      const fi = u * (pts.length - 1);
      const i0 = Math.min(pts.length - 1, Math.floor(fi));
      const i1 = Math.min(pts.length - 1, i0 + 1);
      const f = fi - i0;
      const px = pts[i0][0] + (pts[i1][0] - pts[i0][0]) * f;
      const py = pts[i0][1] + (pts[i1][1] - pts[i0][1]) * f;
      const r = (pts[i0][2] + (pts[i1][2] - pts[i0][2]) * f) || 1;
      // 進行方向（XY 平面内）
      const j0 = Math.max(0, i0 - 1);
      const j1 = Math.min(pts.length - 1, i0 + 1);
      let tx = pts[j1][0] - pts[j0][0];
      let ty = pts[j1][1] - pts[j0][1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const e1x = -ty;
      const e1y = tx;
      for (let j = 0; j <= ring; j++) {
        const a = (j / ring) * Math.PI * 2;
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        const nx = e1x * ca;
        const ny = e1y * ca;
        const nz = sa;
        t.pos[w * 3] = px + nx * r;
        t.pos[w * 3 + 1] = py + ny * r;
        t.pos[w * 3 + 2] = nz * r;
        t.nrm[w * 3] = nx;
        t.nrm[w * 3 + 1] = ny;
        t.nrm[w * 3 + 2] = nz;
        t.uv[w * 3] = j / ring;
        t.uv[w * 3 + 1] = u;
        t.uv[w * 3 + 2] = 0;
        w++;
      }
    }
    const p = this.progTube;
    gl.useProgram(p);
    gl.uniformMatrix4fv(p.u.uProj, false, view.proj);
    const v = view.viewDir();
    gl.uniform3f(p.u.uV, v[0], v[1], v[2]);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.envTex);
    gl.uniform1i(p.u.uEnv, 0);
    gl.uniform1f(p.u.uEnvMaxLod, this.envMaxLod);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, this.scene.tex);
    gl.uniform1i(p.u.uScene, 3);
    gl.uniform1f(p.u.uRefract, refract);
    const s = o.sigma || [0.06, 0.16, 0.42];
    gl.uniform3f(p.u.uSigma, s[0], s[1], s[2]);
    gl.uniform1f(p.u.uRadius, o.radius ?? 5);
    gl.bindVertexArray(t.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, t.bPos);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, t.pos);
    gl.bindBuffer(gl.ARRAY_BUFFER, t.bNrm);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, t.nrm);
    gl.bindBuffer(gl.ARRAY_BUFFER, t.bUv);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, t.uv);
    gl.disable(gl.CULL_FACE);
    gl.drawElements(gl.TRIANGLES, t.count, gl.UNSIGNED_SHORT, 0);
    gl.enable(gl.CULL_FACE);
    gl.bindVertexArray(null);
  }

  // 工程 9 で初めてシェーダを走らせるとカクつくので、前半のうちに一度だけ
  // 全プログラムを小さく走らせて温めておく（大穴 N の実用版）。
  warmup(view) {
    if (this.warmed || !this.ok) return;
    this.warmed = true;
    this.begin();
    this.plate({ x: 0, base: -10000 });
    this.mold({ x: 0, base: -10000 });
    this.pot({ x: 0, base: -10000 });
    this.bowl({ x: 0, base: -10000 });
    this.pudding({ x: 0, base: -10000, caramelFlow: 0.5, wobble: 1, phase: 1 });
    this.liquid({ x: 0, base: -10000, r: 10, depth: 4 });
    this.stream({
      points: [
        [0, -10000, 3],
        [0, -10010, 3],
      ],
      radius: 3,
    });
    this.render(view, null, TIER.MID, 0);
    this.begin();
  }
}


// ================= src/stages.js =================

// 12 の工程モジュール。
// 1 モジュール = 1 動詞 + 1 操作 + 1 つの視覚変化。
// 文字は一切出さない。誘導は「手のアイコン」と「破線の道すじ」だけ。





// --- 粒子ヘルパ -------------------------------------------------------------
function emit(list, x, y, r, life, vx, vy) {
  if (list.length > 90) return;
  list.push({ x, y, r, life: 0, dur: life, vx, vy });
}
function stepParticles(list, dt) {
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i];
    p.life += dt / p.dur;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.r += dt * 14;
    if (p.life >= 1) list.splice(i, 1);
  }
}

// 画面サイズに対する必要ドラッグ量。
// iPhone 縦 / iPad 横 のどちらでも「大きく 1〜1.5 回」で完了する量にする。
const vDist = (v, f = 0.8, cap = 520) => Math.max(140, Math.min(v.h * f, cap));
const hDist = (v, f = 0.8, cap = 520) => Math.max(140, Math.min(v.w * f, cap));

// 誘導の置き場所（指が Hero を隠さない安全地帯）
function hintAnchor(v) {
  return v.portrait
    ? { x: v.w * 0.5, y: v.h * 0.84, span: Math.min(v.w * 0.34, 150) }
    : { x: v.w * 0.8, y: v.h * 0.62, span: Math.min(v.w * 0.13, 130) };
}

// 砂糖液の色: 透明 -> 淡い金 -> 琥珀
function sugarColor(t) {
  t = clamp(t);
  return t < 0.5
    ? mixHex('#f9f6ec', '#f0d17a', t * 2)
    : mixHex('#f0d17a', '#a85c14', (t - 0.5) * 2);
}


// --- GL Hero レイヤーに渡す材質と寸法 ---------------------------------------
// Beer-Lambert の吸収係数（1 ワールド単位あたり）。厚みで色が変わるのが本物らしさの核。
// 深さ数 mm〜数 cm の液だまりで「濃いけれど色が残る」ように調整してある。
// 係数を上げすぎると緑が先に落ちて赤紫になるので、比率も含めて実測寄りに。
const SIG = {
  syrupClear: [0.0010, 0.0016, 0.0032], // 透明な砂糖液
  syrupAmber: [0.034, 0.059, 0.097], // 煮詰まったカラメル
  caramel: [0.075, 0.127, 0.200],
  custardRaw: [0.0165, 0.0300, 0.0620],
  custardSet: [0.0200, 0.0370, 0.0760],
};
const mixSig = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

// 型の内側の半径（高さ y における）
const moldInnerR = (y) => {
  const irb = MOLD.rb - MOLD.wall;
  const irt = MOLD.rt - MOLD.wall;
  return irb + (irt - irb) * clamp((y - 2.2) / (MOLD.h - 2.2));
};
// 型の中の液面の高さ（0..1 を高さに）
const moldLevel = (f) => 2.6 + (MOLD.h - 7.0) * clamp(f);

// 鍋（rb52 / rt62 / h40 / wall3.2）の内側
const potLocalY = (L) => 3.2 + (40 - 3.2) * clamp(L);
const potLocalR = (y) => (52 + 10 * clamp((y - 2.2) / (40 - 2.2))) - 3.6;

// ボウル（R74 / h46 / wall3.6）の内側
const bowlLocalY = (L) => 2.9 + (46 - 2.9) * clamp(L);
const bowlLocalR = (y) => {
  const t = clamp(1 - y / 46);
  return 74 * Math.sqrt(Math.max(0, 1 - t * t)) - 4.0;
};

// 傾けた容器の注ぎ口（ワールド座標）。rotZ = -tilt で画面上は時計回りに倒れる。
function spout3(x, base, tilt, R, H, pivotY) {
  const th = -tilt;
  const rx = R;
  const ry = H - pivotY;
  const c = Math.cos(th);
  const sn = Math.sin(th);
  return { x: x + (c * rx - sn * ry), y: base + pivotY + (sn * rx + c * ry) };
}

// 注ぐ流れの経路（下ほど速く落ち、細くなる）
function streamPath(sx, sy, tx, ty, w0, w1, time) {
  const pts = [];
  const n = 9;
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const x = sx + (tx - sx) * (u * 0.42 + u * u * 0.58);
    const y = sy + (ty - sy) * (u * u * 0.7 + u * 0.3);
    const wob = Math.sin(time * 5.5 + u * 4.2) * 0.9 * (1 - u * 0.55);
    pts.push([x + wob, y, lerp(w0, w1, u)]);
  }
  return pts;
}

// 鍋の取っ手だけは 2D（背面レイヤー）で描く
function potHandle(ctx, v, x, base, tilt) {
  ctx.save();
  ctx.translate(v.X(x), v.Y(base));
  ctx.rotate(tilt || 0);
  const y = -26 * v.hf;
  ctx.beginPath();
  ctx.moveTo(-52, y);
  ctx.lineTo(-134, y - 4);
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#3f4954';
  ctx.stroke();
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.stroke();
  ctx.restore();
}

// 混ぜ残しの白い筋（GL の液面の上に 2D で重ねる）
function swirlOverlay(ctx, v, wy, r, unmixed, angle) {
  if (unmixed <= 0.01) return;
  const cx = v.X(0);
  const cy = v.Y(wy);
  const k = v.k;
  ctx.save();
  ctx.beginPath();
  A.ellipse(ctx, cx, cy, r * 0.97, r * 0.97 * k);
  ctx.clip();
  ctx.globalAlpha = clamp(unmixed) * 0.8;
  ctx.globalCompositeOperation = 'soft-light';
  for (let i = 0; i < 5; i++) {
    const a = angle + (i / 5) * TAU;
    ctx.beginPath();
    for (let j = 0; j <= 22; j++) {
      const u = j / 22;
      const ang = a + u * 2.7;
      const rad = r * (0.12 + u * 0.8);
      const px = cx + Math.cos(ang) * rad;
      const py = cy + Math.sin(ang) * rad * k;
      if (j === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.lineWidth = 7 - i * 0.7;
    ctx.lineCap = 'round';
    ctx.strokeStyle = i % 2 ? 'rgba(255,255,250,0.95)' : 'rgba(255,205,90,0.75)';
    ctx.stroke();
  }
  ctx.restore();
}

// --- 小物の描画 -------------------------------------------------------------
function stove(ctx, v, x) {
  const cx = v.X(x);
  const y = v.Y(0);
  const k = v.k;
  ctx.save();
  // 五徳
  ctx.beginPath();
  A.ellipse(ctx, cx, y, 78, 78 * k);
  ctx.fillStyle = '#4d5560';
  ctx.fill();
  ctx.beginPath();
  A.ellipse(ctx, cx, y - 2, 78, 78 * k);
  ctx.fillStyle = '#6b7480';
  ctx.fill();
  ctx.beginPath();
  A.ellipse(ctx, cx, y - 2, 48, 48 * k);
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#3c434d';
  ctx.stroke();
  ctx.restore();
}

// 炎は鍋の後ろ・手前の両方に出す（鍋に隠れないように鍋より後に描く）
function flames(ctx, v, x, base, flame, front) {
  if (!(flame > 0)) return;
  const cx = v.X(x);
  const y = v.Y(base);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * TAU;
    if (front === true && Math.sin(a) < 0) continue;
    if (front === false && Math.sin(a) >= 0) continue;
    const fx = cx + Math.cos(a) * 60;
    const fy = y + Math.sin(a) * 60 * v.k;
    const hgt = (26 + Math.sin(v.time * 12 + i * 2.1) * 9) * flame;
    ctx.beginPath();
    ctx.moveTo(fx - 16, fy);
    ctx.quadraticCurveTo(fx, fy - hgt * 2.4, fx + 16, fy);
    ctx.closePath();
    const g = ctx.createLinearGradient(fx, fy, fx, fy - hgt * 2.1);
    g.addColorStop(0, 'rgba(255,120,20,0.34)');
    g.addColorStop(0.35, 'rgba(255,168,50,0.34)');
    g.addColorStop(0.75, 'rgba(255,214,120,0.16)');
    g.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = g;
    ctx.fill();
  }
  ctx.restore();
}

function lever(ctx, v, x, angle, glow) {
  const cx = v.X(x);
  const yBase = v.Y(0);
  const yPiv = v.Y(58);
  ctx.save();
  // 支柱
  ctx.beginPath();
  A.ellipse(ctx, cx, yBase, 26, 26 * v.k);
  ctx.fillStyle = '#6b7480';
  ctx.fill();
  ctx.lineWidth = 15;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#8a95a2';
  ctx.beginPath();
  ctx.moveTo(cx, yBase);
  ctx.lineTo(cx, yPiv);
  ctx.stroke();
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.stroke();
  // アーム
  ctx.translate(cx, yPiv);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -52);
  ctx.lineWidth = 17;
  ctx.strokeStyle = '#7d8894';
  ctx.stroke();
  ctx.lineWidth = 8;
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -56, 19, 0, TAU);
  const g = ctx.createRadialGradient(-7, -63, 2, 0, -56, 22);
  g.addColorStop(0, '#ffb59c');
  g.addColorStop(0.5, '#ff7a59');
  g.addColorStop(1, '#d8492a');
  ctx.fillStyle = g;
  ctx.fill();
  if (glow > 0) {
    ctx.beginPath();
    ctx.arc(0, -56, 19 + glow * 7, 0, TAU);
    ctx.lineWidth = 3;
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - glow)})`;
    ctx.stroke();
  }
  ctx.restore();
}

function tray(ctx, v, x) {
  const cx = v.X(x);
  const yb = v.Y(0);
  const yt = v.Y(11);
  ctx.save();
  ctx.beginPath();
  A.ellipse(ctx, cx, yt, 150, 150 * v.k, Math.PI, TAU);
  ctx.lineTo(cx + 140, yb);
  A.ellipse(ctx, cx, yb, 140, 140 * v.k, 0, Math.PI);
  ctx.closePath();
  const g = ctx.createLinearGradient(cx - 150, 0, cx + 150, 0);
  g.addColorStop(0, '#7c8794');
  g.addColorStop(0.3, '#e6ecf2');
  g.addColorStop(0.55, '#b9c4cf');
  g.addColorStop(1, '#6f7a87');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  A.ellipse(ctx, cx, yt, 150, 150 * v.k);
  ctx.fillStyle = '#c8d2dc';
  ctx.fill();
  ctx.beginPath();
  A.ellipse(ctx, cx, yt + 1, 142, 142 * v.k);
  const wg = ctx.createRadialGradient(cx, yt, 4, cx, yt, 142);
  wg.addColorStop(0, 'rgba(206,224,232,0.95)');
  wg.addColorStop(1, 'rgba(158,186,200,0.95)');
  ctx.fillStyle = wg;
  ctx.fill();
  ctx.restore();
}

function lid(ctx, v, x, base, alpha = 1, glow = 0) {
  const cx = v.X(x);
  const yb = v.Y(base);
  const yt = v.Y(base + 74);
  const R = 70;
  ctx.save();
  ctx.globalAlpha = alpha;
  // ドーム
  ctx.beginPath();
  ctx.moveTo(cx - R, yb);
  ctx.bezierCurveTo(cx - R, yt + 10, cx - R * 0.66, yt, cx, yt);
  ctx.bezierCurveTo(cx + R * 0.66, yt, cx + R, yt + 10, cx + R, yb);
  A.ellipse(ctx, cx, yb, R, R * v.k, 0, Math.PI);
  ctx.closePath();
  const g = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
  g.addColorStop(0, '#69747f');
  g.addColorStop(0.18, '#c3ceda');
  g.addColorStop(0.32, '#ffffff');
  g.addColorStop(0.46, '#dde5ed');
  g.addColorStop(0.66, '#9fabb7');
  g.addColorStop(0.86, '#c8d3dd');
  g.addColorStop(1, '#5f6a77');
  ctx.fillStyle = g;
  ctx.fill();
  // ふちの厚み（手前半分だけ。奥側を描くと「開いたボウル」に見えてしまう）
  ctx.beginPath();
  A.ellipse(ctx, cx, yb, R, R * v.k, 0, Math.PI);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#aeb9c5';
  ctx.stroke();
  ctx.beginPath();
  A.ellipse(ctx, cx, yb - 2.5, R, R * v.k, 0, Math.PI);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.stroke();
  // つまみ（大きく掴みやすい見た目）
  ctx.beginPath();
  ctx.moveTo(cx, yt + 4);
  ctx.lineTo(cx, yt - 10);
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#9aa6b2';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, yt - 20, 19, 0, TAU);
  const kg = ctx.createRadialGradient(cx - 7, yt - 28, 2, cx, yt - 20, 22);
  kg.addColorStop(0, '#ffc3ad');
  kg.addColorStop(0.5, '#ff7a59');
  kg.addColorStop(1, '#d8492a');
  ctx.fillStyle = kg;
  ctx.fill();
  if (glow > 0) {
    ctx.beginPath();
    ctx.arc(cx, yt - 20, 19 + glow * 8, 0, TAU);
    ctx.lineWidth = 3;
    ctx.strokeStyle = `rgba(255,255,255,${0.55 * (1 - glow)})`;
    ctx.stroke();
  }
  ctx.restore();
}

// 雪の結晶（冷却パネルの飾り）
function snowflake(c, x, y, r, alpha) {
  c.save();
  c.globalAlpha = alpha;
  c.translate(x, y);
  c.lineWidth = Math.max(1.4, r * 0.16);
  c.lineCap = 'round';
  c.strokeStyle = 'rgba(255,255,255,0.95)';
  for (let i = 0; i < 3; i++) {
    c.rotate(Math.PI / 3);
    c.beginPath();
    c.moveTo(-r, 0);
    c.lineTo(r, 0);
    c.stroke();
    c.beginPath();
    c.moveTo(r * 0.5, 0);
    c.lineTo(r * 0.72, -r * 0.24);
    c.moveTo(r * 0.5, 0);
    c.lineTo(r * 0.72, r * 0.24);
    c.moveTo(-r * 0.5, 0);
    c.lineTo(-r * 0.72, -r * 0.24);
    c.moveTo(-r * 0.5, 0);
    c.lineTo(-r * 0.72, r * 0.24);
    c.stroke();
  }
  c.restore();
}

function coldPanel(ctx, v, cover, time) {
  // 右から入ってくる、氷のように曇った冷蔵の扉
  if (cover <= 0.001) return;
  const w = v.w;
  const h = v.h;
  const x = lerp(w * 1.04, -w * 0.04, cover);
  const c = v.begin();
  c.save();
  const g = c.createLinearGradient(x, 0, x + w * 1.1, 0);
  g.addColorStop(0, 'rgba(224,244,255,0.86)');
  g.addColorStop(0.12, 'rgba(206,236,252,0.7)');
  g.addColorStop(0.6, 'rgba(190,228,248,0.66)');
  g.addColorStop(1, 'rgba(178,220,244,0.7)');
  c.fillStyle = g;
  c.fillRect(x, 0, w * 1.2, h);

  // 扉のふち（厚み）
  const eg = c.createLinearGradient(x - 4, 0, x + 22, 0);
  eg.addColorStop(0, 'rgba(255,255,255,0)');
  eg.addColorStop(0.45, 'rgba(255,255,255,0.7)');
  eg.addColorStop(1, 'rgba(214,238,250,0.25)');
  c.fillStyle = eg;
  c.fillRect(x - 4, 0, 26, h);

  // 取っ手
  c.save();
  c.shadowColor = 'rgba(70,110,140,0.35)';
  c.shadowBlur = 10;
  c.fillStyle = '#ffffff';
  const hy = h * 0.42;
  const hh = Math.min(h * 0.18, 150);
  c.lineCap = 'round';
  c.lineWidth = 17;
  c.strokeStyle = '#ffffff';
  c.beginPath();
  c.moveTo(x + 52, hy + 10);
  c.lineTo(x + 52, hy + hh - 10);
  c.stroke();
  c.lineWidth = 6;
  c.strokeStyle = 'rgba(190,224,244,0.9)';
  c.stroke();
  c.restore();

  // 霜と雪の結晶
  for (let i = 0; i < 9; i++) {
    const fx = x + 90 + ((i * 137) % Math.max(1, w * 0.85));
    const fy = ((i * 211) % Math.max(1, h * 0.86)) + h * 0.06 + Math.sin(time * 0.7 + i) * 6;
    snowflake(c, fx, fy, 10 + (i % 3) * 6, 0.35 + (i % 2) * 0.2);
  }
  c.restore();
}

    const target = lerp(120, MOLD.h, easeOut(p));
    g.plateBase = damp(g.plateBase, target, 9, dt);
    if (!g.clacked && p > 0.985) {
      g.clacked = true;
      sfx.clack();
      g.shake = 0.5;
    }
    return p;
  },
  draw(ctx, v, g) {
    A.ground(ctx, v, 0, 0, 58, 0.35);
    const t = clamp((120 - g.plateBase) / 56);
    A.ground(ctx, v, 0, MOLD.h + 1, lerp(70, PLATE.r * 0.8, t), 0.25 * t);
  },
  gl(h, v, g) {
    h.mold({ x: 0, base: 0, ribs: 1, frost: g.frost * 0.5 });
    const cust = clamp(g.custardInMold);
    if (cust > 0.01) {
      const y = moldLevel(0.22 + 0.74 * cust);
      h.liquid({
        x: 0,
        base: y,
        r: moldInnerR(y) - 0.6,
        depth: 2 + 30 * cust,
        sigma: SIG.custardSet,
        rough: 0.17,
      });
    }
    h.plate({ x: 0, base: g.plateBase, occ0: [0, 0, MOLD.rt * 1.2, 0.3] });
  },
  fallback(ctx, v, g) {
    A.ground(ctx, v, 0, 0, 58, 0.35);
    A.mold(ctx, v, {
      x: 0,
      base: 0,
      open: true,
      caramel: g.caramelInMold,
      custard: g.custardInMold,
      set: true,
      frost: g.frost * 0.5,
    });
    // 皿の落下影
    const t = clamp((120 - g.plateBase) / 56);
    A.ground(ctx, v, 0, MOLD.h + 1, lerp(70, PLATE.r * 0.8, t), 0.25 * t);
    A.plate(ctx, v, { x: 0, base: g.plateBase });
  },
  hint(v) {
    const a = hintAnchor(v);
    return {
      pts: [
        [a.x, a.y - a.span * 0.6],
        [a.x, a.y + a.span * 0.5],
      ],
    };
  },
  hold: 0.9,
});

// 8. ひっくりかえす: 大きな弧のスワイプで皿と型を一緒に 180 度
SDEF.push({
  id: 'flip',
  cam: () => ({ x: 0, y: 46, w: 276, h: 180, k: 0.2, anchor: 0.5 }),
  enter(g, v) {
    g.gesture = new ArcGesture(hDist(v, 0.72, 480));
    g.flip = 0;
    g.flipDone = false;
    g.whooshed = false;
  },
  update(g, dt, input) {
    let p = g.gesture.update(input, dt);
    // 8 割まで回したら最後は自動で決まる（4 歳児への強い入力補正）
    if (p > 0.78) g.gesture.acc += g.gesture.dist * dt * 1.7;
    p = clamp(g.gesture.acc / g.gesture.dist);
    g.flip = damp(g.flip, p, 11, dt);
    if (!g.flipDone && p > 0.995) {
      g.flipDone = true;
      sfx.clack();
      g.shake = 0.7;
    }
    if (g.gesture.rate > 0.3 && !g.whooshed) {
      g.whooshed = true;
      sfx.whoosh();
    }
    return p;
  },
  draw(ctx, v, g) {
    A.ground(ctx, v, 0, 0, lerp(58, PLATE.r * 0.86, g.flip), 0.4 - Math.sin(g.flip * Math.PI) * 0.2);
  },
  gl(h, v, g) {
    const ang = g.flip * Math.PI;
    const hop = Math.sin(g.flip * Math.PI) * 30;
    const pw = (MOLD.h + PLATE.h) / 2;
    h.mold({ x: 0, base: hop, rotX: ang, pivotY: pw, ribs: 1, frost: g.frost * 0.35 });
    h.plate({ x: 0, base: MOLD.h + hop, rotX: ang, pivotY: pw - MOLD.h });
  },
  fallback(ctx, v, g) {
    const ang = g.flip * Math.PI;
    const hop = Math.sin(g.flip * Math.PI) * 30;
    const pivotY = (MOLD.h + PLATE.h) / 2;
    const px = v.X(0);
    const py = v.Y(pivotY + hop);
    A.ground(ctx, v, 0, 0, lerp(58, PLATE.r * 0.86, g.flip), 0.4 - Math.sin(g.flip * Math.PI) * 0.2);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    ctx.translate(-v.X(0), -v.Y(pivotY));
    A.mold(ctx, v, {
      x: 0,
      base: 0,
      open: false,
      caramel: g.caramelInMold,
      custard: g.custardInMold,
      set: true,
      frost: g.frost * 0.35,
    });
    A.plate(ctx, v, { x: 0, base: MOLD.h });
    ctx.restore();
  },
  hint(v) {
    const a = hintAnchor(v);
    const pts = [];
    const r = a.span * 0.95;
    for (let i = 0; i <= 20; i++) {
      const t = Math.PI + (i / 20) * Math.PI * 0.9;
      pts.push([a.x + Math.cos(t) * r, a.y + Math.sin(t) * r * 0.5 + r * 0.12]);
    }
    return { pts };
  },
  hold: 1.2,
});

// 9-11. かたをぬく → ぷるん → カラメルが流れる（最大のリプレイ磁石）
SDEF.push({
  id: 'demold',
  cam: () => ({ x: 0, y: 58, w: 168, h: 152, k: 0.34, anchor: 0.52 }),
  enter(g, v) {
    g.gesture = new DragGesture('y', -1, vDist(v, 0.42, 340));
    g.lift = 0;
    g.moldRise = 0;
    g.released = false;
    g.relT = 0;
    g.caramelFlow = 0;
    g.wobble = 0;
    g.phase = 0;
    g.squash = 0;
    g.squashVel = 0;
    g.dropped = 0;
    g.dripSfx = 0;
  },
  camDynamic(t, g) {
    // 型を引き上げるあいだ、カメラがわずかに追う。外れた瞬間に少し引く。
    t.y += Math.min(g.moldRise || 0, 60) * 0.14;
    if (g.released) {
      const u = clamp((g.relT || 0) / 0.9);
      t.w *= 1 + 0.1 * u;
      t.h *= 1 + 0.1 * u;
    }
  },
  update(g, dt, input, v) {
    // 「もう一回」用: 型がプリンにかぶさりながら戻ってくる
    if (g.recap > 0) {
      g.recap -= dt;
      g.moldRise = damp(g.moldRise, 0, 5.5, dt);
      g.caramelFlow = damp(g.caramelFlow, 0, 6, dt);
      if (g.recap <= 0) {
        g.recap = 0;
        g.moldRise = 0;
        g.caramelFlow = 0;
        g.gesture.reset();
      }
      return 0;
    }
    if (!g.released) {
      const p = g.gesture.update(input, dt);
      g.lift = p;
      // 最後の数 mm は「くっついて」抵抗し、プリンがわずかに伸びる
      g.stick = smooth((p - 0.66) / 0.3);
      g.moldRise = damp(g.moldRise, (Math.min(p, 0.9) / 0.9) * 55, 14, dt);
      if (p >= 0.9) {
        g.released = true;
        g.relT = 0;
        sfx.purun();
        g.shake = 0.55;
        // 一度つぶれて、ぷるんと戻る（バネの初期変位 + 速度）
        g.squash = 0.17;
        g.squashVel = 0.7;
        g.wobble = 11.5;
        g.phase = 0;
      }
      return 0; // 抜けるまでは完了扱いにしない
    }
    // --- 解放後のシーケンス ---
    g.relT += dt;
    g.moldRise = damp(g.moldRise, 150, 6.5, dt);
    g.stick = 0;
    // バネ（squash）: ζ≈0.4 の減衰振動で 2〜3 回はずむ
    const k = 240,
      damping = 12;
    let left = dt;
    while (left > 0) {
      const h = Math.min(left, 1 / 240);
      g.squashVel += (0 - g.squash) * k * h - g.squashVel * damping * h;
      g.squash += g.squashVel * h;
      left -= h;
    }
    // 横揺れ（減衰振動）
    g.phase += dt * 17;
    g.wobble = Math.max(0, g.wobble - dt * g.wobble * 1.9);
    // カラメルが頂上から側面へ
    if (g.relT > 0.22) g.caramelFlow = clamp(g.caramelFlow + dt / 2.1);
    if (g.caramelFlow > 0.35 && g.dripSfx === 0) {
      g.dripSfx = 1;
      sfx.drip();
    }
    if (g.relT > 3.1) return 1;
    return 0;
  },
  draw(ctx, v, g) {
    A.ground(ctx, v, 0, 0, PLATE.r * 0.92, 0.42);
  },
  gl(h, v, g) {
    const flow = clamp(g.caramelFlow);
    h.plate({
      x: 0,
      base: 0,
      bounce: 0.30 * clamp(g.moldRise / 30) + flow * 0.18,
      bounceColor: [0.62, 0.34, 0.07],
      // 接地影: プリンの底と、まだ低い位置にある型
      occ0: [0, 0, PUD.rb * 1.15, 0.62],
      occ1: [0, 0, MOLD.rt * 1.3, 0.5 * clamp(1 - g.moldRise / 42)],
    });
    h.pudding({
      x: 0,
      base: PLATE.h,
      wobble: g.wobble,
      phase: g.phase,
      squash: g.squash + (g.stick ? -g.stick * 0.05 : 0),
      stick: g.stick || 0,
      caramelFlow: flow,
      caramel: 1,
    });
    h.mold({ x: 0, base: PLATE.h + g.moldRise, flip: true, ribs: 1 });
  },
  fallback(ctx, v, g) {
    A.plate(ctx, v, { x: 0, base: 0 });
    const hEffScale = 1 + (g.stick || 0) * 0.05;
    // まだ完全に型の中なら描かない（影が型の外へはみ出して正体を匂わせないように）
    if (g.released || g.moldRise > 0.6)
      A.pudding(ctx, v, {
      x: 0,
      base: PLATE.h,
      wobble: g.wobble,
      phase: g.phase,
      squash: g.squash + (g.stick ? -g.stick * 0.05 : 0),
      reveal: g.released ? 1 : clamp(g.moldRise / (PUD.h * hEffScale)),
      caramelFlow: g.caramelFlow,
    });
    A.mold(ctx, v, {
      x: 0,
      base: PLATE.h + g.moldRise,
      open: false,
      flipped: true,
    });
  },
  hint(v) {
    const a = hintAnchor(v);
    return {
      pts: [
        [a.x, a.y + a.span * 0.55],
        [a.x, a.y - a.span * 0.6],
      ],
      slow: true,
    };
  },
  hold: 0.4,
});

// 12. できあがり: カメラを少し引いて、初めて全体を見せる
SDEF.push({
  id: 'reveal',
  // 少し引いて全体を見せる。横画面では右下のボタンを避けて被写体を左へ寄せる。
  cam: (v) => ({
    x: v.portrait ? 0 : 34,
    y: 42,
    w: 268,
    h: v.portrait ? 132 : 152,
    k: 0.42,
    anchor: v.portrait ? 0.46 : 0.42,
  }),
  auto: true,
  enter(g, v) {
    g.revealT = 0;
    g.sparks = [];
    sfx.sparkle();
  },
  update(g, dt, input, v) {
    g.revealT += dt;
    g.phase += dt * 6.2;
    g.wobble = Math.max(0, g.wobble * (1 - dt * 1.4)) + Math.sin(g.revealT * 1.6) * 0.02;
    g.caramelFlow = clamp(g.caramelFlow + dt * 0.25);
    if (g.revealT < 1.6 && Math.random() < dt * 16) {
      const c = v.toScreen(0, 40);
      const a = Math.random() * TAU;
      const rr = 90 + Math.random() * 90;
      g.sparks.push({
        x: c.x + Math.cos(a) * rr,
        y: c.y + Math.sin(a) * rr * 0.7,
        r: 7 + Math.random() * 9,
        rot: Math.random() * TAU,
        life: 1,
        color: 'rgba(255,246,205,0.95)',
      });
    }
    for (let i = g.sparks.length - 1; i >= 0; i--) {
      const s = g.sparks[i];
      s.life -= dt * 0.9;
      s.rot += dt * 1.4;
      s.y -= dt * 12;
      if (s.life <= 0) g.sparks.splice(i, 1);
    }
    return 0; // ここで待機（リプレイ待ち）
  },
  draw(ctx, v, g) {
    A.ground(ctx, v, 0, 0, PLATE.r * 0.95, 0.42);
  },
  gl(h, v, g) {
    h.plate({
      x: 0,
      base: 0,
      bounce: 0.46,
      bounceColor: [0.62, 0.34, 0.07],
      occ0: [0, 0, PUD.rb * 1.15, 0.62],
    });
    h.pudding({
      x: 0,
      base: PLATE.h,
      wobble: g.wobble,
      phase: g.phase,
      squash: 0,
      caramelFlow: clamp(g.caramelFlow),
      caramel: 1,
    });
  },
  fallback(ctx, v, g) {
    A.plate(ctx, v, { x: 0, base: 0 });
    A.pudding(ctx, v, {
      x: 0,
      base: PLATE.h,
      wobble: g.wobble,
      phase: g.phase,
      squash: 0,
      caramelFlow: g.caramelFlow,
    });
  },
  hold: 0,
});

const STAGES = SDEF;
const STAGE_INDEX = Object.fromEntries(SDEF.map((s, i) => [s.id, i]));


// ================= src/main.js =================

// 「あまいひみつ」— 正体を最後まで隠すプリン工房
// 文字なし・タイマーなし・点数なし・ゲームオーバーなし。








const FAST = /[?&]fast=1/.test(location.search) || window.__E2E_FAST === true;

const backCanvas = document.getElementById('back');
const glCanvas = document.getElementById('gl');
const frontCanvas = document.getElementById('front');
const view = new View(backCanvas, glCanvas, frontCanvas);
const input = new Input(frontCanvas);

// WebGL2 が使えれば Hero 素材はシェーダで、無ければ従来の Canvas2D で描く。
const hero = new Hero(glCanvas);
const gov = new TierGovernor(FAST ? TIER.LOW : guessTier());
if (!hero.ok) glCanvas.style.display = 'none';

// --- ゲーム状態 -------------------------------------------------------------
const g = {
  puffs: [],
  sparks: [],
  amber: 0,
  flame: 0,
  caramelInMold: 0,
  custardInMold: 0,
  mixed: 0,
  cold: 0,
  frost: 0,
  shake: 0,
  wobble: 0,
  phase: 0,
  squash: 0,
  caramelFlow: 0,
  moldRise: 0,
  stick: 0,
  recap: 0,
  pulse: 0,
};

const app = {
  mode: 'title', // 'title' | 'play'
  stage: 0,
  phase: 'play', // 'play' | 'outro'
  t: 0,
  outroT: 0,
  progress: 0,
  time: 0,
  buttons: [],
  fade: 0,
};

function safeInsets() {
  const el = document.getElementById('safe');
  if (!el) return { top: 0, bottom: 0 };
  const cs = getComputedStyle(el);
  return {
    top: parseFloat(cs.paddingTop) || 0,
    bottom: parseFloat(cs.paddingBottom) || 0,
  };
}

function resetGame() {
  Object.assign(g, {
    puffs: [],
    sparks: [],
    amber: 0,
    flame: 0,
    caramelInMold: 0,
    custardInMold: 0,
    mixed: 0,
    cold: 0,
    frost: 0,
    shake: 0,
    wobble: 0,
    phase: 0,
    squash: 0,
    caramelFlow: 0,
    moldRise: 0,
    stick: 0,
    recap: 0,
    released: false,
    cooked: 0,
    flip: 0,
    lift: 0,
  });
  stopAllLoops();
  app.stage = 0;
  app.phase = 'play';
  app.t = 0;
  app.outroT = 0;
  app.progress = 0;
  STAGES[0].enter(g, view);
  applyCamera(true);
}

function gotoStage(i, snapCam = false) {
  app.stage = i;
  app.phase = 'play';
  app.t = 0;
  app.outroT = 0;
  app.progress = 0;
  input.travel = 0;
  stopAllLoops(); // 前の工程の環境音を持ち越さない
  STAGES[i].enter(g, view);
  applyCamera(snapCam);
}

function applyCamera(snap = false) {
  const st = STAGES[app.stage];
  const target = st.cam(view);
  if (st.camDynamic) st.camDynamic(target, g);
  view.setTarget(target);
  if (snap) {
    view.snapToTarget();
    view.recompute();
  }
}

// --- リプレイ ---------------------------------------------------------------
function replayDemold() {
  sfx.tap();
  const i = STAGE_INDEX.demold;
  const keepFlow = g.caramelFlow;
  gotoStage(i);
  g.moldRise = 150;
  g.caramelFlow = keepFlow;
  g.recap = 1.0;
  g.wobble = 0;
  view.snapToTarget();
}

function restartAll() {
  sfx.tap();
  resetGame();
}

// --- 入力ハンドリング -------------------------------------------------------
function handleTap() {
  initAudio();
  for (const b of app.buttons) {
    if (Math.hypot(input.x - b.x, input.y - b.y) <= b.r * 1.35) {
      b.action();
      return true;
    }
  }
  if (app.mode === 'title') {
    sfx.chime();
    app.mode = 'play';
    resetGame();
    return true;
  }
  return false;
}

// --- ループ -----------------------------------------------------------------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 1 / 60;
  dt = Math.min(dt, 1 / 20); // タブ復帰などで飛ばない
  app.time += dt;
  view.time = app.time;

  if (view.resize(FAST)) {
    A.clearGradientCache();
    if (hero.ok) hero.resize(view, gov.tier);
    if (app.mode === 'play') applyCamera(true);
  }

  input.beginFrame(dt);
  if (input.tapped) handleTap();

  if (app.mode === 'title') {
    updateTitle(dt);
  } else {
    updatePlay(dt);
  }

  input.endFrame();
  requestAnimationFrame(frame);
}

// 工程ごとの被写界深度（背景側の CSS ぼかし量、px）。
// 接写ほど背景を溶かすと、食品写真のレンズらしさが出る。
const BLUR = {
  caramelize: 1.6,
  'pour-caramel': 3.2,
  mix: 2.4,
  'pour-custard': 3.2,
  steam: 1.4,
  chill: 1.4,
  'plate-on': 1.8,
  flip: 1.2,
  demold: 3.6,
  reveal: 2.6,
};

function updateTitle(dt) {
  app.buttons.length = 0;
  view.setTarget({ x: 0, y: 46, w: 420, h: 160, k: 0.42, anchor: view.portrait ? 0.46 : 0.44 });
  view.update(dt);
  view.setBlur(1.2);
  A.background(view.ctx, view, 0);
  const ctx = view.world();
  A.ground(ctx, view, 0, 0, 62, 0.4);
  A.ground(ctx, view, -128, 8, 62, 0.3);
  A.ground(ctx, view, 130, 0, 70, 0.3);
  if (hero.ok) {
    hero.begin();
    hero.mold({ x: 0, base: 0, ribs: 1 });
    hero.pot({ x: -128, base: 8 });
    hero.bowl({ x: 130, base: 0 });
    const ly = 3.2 + 36.8 * 0.42;
    hero.liquid({ x: -128, base: 8, localY: ly, r: 48, depth: 12,
      sigma: [0.0016, 0.0024, 0.0055], rough: 0.035, boil: 0 });
    hero.liquid({ x: 130, base: 0, localY: 26, r: 60, depth: 16,
      sigma: [0.0105, 0.025, 0.076], rough: 0.045, boil: 0 });
    hero.render(view, backCanvas, gov.tier, app.time);
  } else {
    A.mold(ctx, view, { x: 0, base: 0, open: true });
    A.pot(ctx, view, { x: -128, base: 8, liquid: 0.4, color: '#f2efe4', time: app.time });
    A.bowl(ctx, view, { x: 130, base: 0, liquid: 0.5, mixed: 1 });
  }

  // ふわっと光る「触ってね」の手（型を隠さない位置に置く）
  const c = view.uiBegin();
  const pulse = 0.5 + 0.5 * Math.sin(app.time * 2.4);
  const p = view.toScreen(0, 0);
  const hy = Math.min(view.h - 90, p.y + view.h * 0.16);
  c.save();
  c.beginPath();
  c.arc(p.x, hy, 44 + pulse * 14, 0, TAU);
  c.fillStyle = `rgba(255,255,255,${0.12 + pulse * 0.16})`;
  c.fill();
  c.restore();
  A.handIcon(c, p.x + 14, hy + 12, 1.25 + pulse * 0.1, 0.15, 0.95);
  drawMuteButton(c);
}

function updatePlay(dt) {
  const st = STAGES[app.stage];
  const tier = gov.sample(dt);

  // 停滞したときの自動アシスト（詰まらせない）
  const assistAfter = st.id === 'demold' ? 26 : 16;
  if (app.phase === 'play' && g.gesture && input.idle > assistAfter && g.gesture.nudge) {
    g.gesture.nudge(dt);
  }

  if (app.phase === 'play') {
    app.t += dt;
    const p = st.update(g, dt, input, view) || 0;
    app.progress = p;
    if (p >= 0.999 && !st.auto) {
      app.phase = 'outro';
      app.outroT = 0;
      if (st.id !== 'demold') sfx.place();
    }
  } else {
    app.outroT += dt;
    const u = clamp(app.outroT / Math.max(0.001, st.hold));
    if (st.outro) st.outro(g, u);
    if (st.update && st.id === 'demold') st.update(g, dt, input, view);
    if (u >= 1) {
      const next = app.stage + 1;
      if (next < STAGES.length) {
        gotoStage(next);
      } else {
        app.phase = 'play';
      }
    }
  }

  if (g.shake > 0) {
    view.shake = Math.max(view.shake, g.shake);
    g.shake = 0;
  }
  applyCamera(false);
  view.update(dt);
  view.setBlur(hero.ok ? (BLUR[st.id] ?? 1.4) : 0);

  // --- 奥レイヤー: 背景と Hero より奥の小物 ---
  if (st.id !== 'chill') g.cold = damp(g.cold, 0, 0.9, dt);
  A.background(view.ctx, view, clamp(g.cold * 0.75));
  const ctx = view.world();
  st.draw(ctx, view, g);
  if (!hero.ok && st.fallback) st.fallback(ctx, view, g);

  // --- Hero レイヤー（WebGL2） ---
  if (hero.ok) {
    // 工程 9 で初めてシェーダが走るとカクつくので、前半のうちに温めておく
    if (!hero.warmed && app.time > 1.2) hero.warmup(view);
    hero.begin();
    if (st.gl) st.gl(hero, view, g);
    hero.render(view, backCanvas, tier, app.time);
  }

  // --- 手前レイヤー: Hero より手前の小物と UI ---
  const c = view.uiBegin();
  if (st.front) {
    const fw = view.uiWorld();
    st.front(fw, view, g);
    view.uiBegin(false);
  }
  app.buttons.length = 0;
  if (g.sparks && g.sparks.length) A.sparkles(c, g.sparks);
  drawHint(c, st);
  drawUI(c, st);
}

// --- 誘導（文字なし） -------------------------------------------------------
function drawHint(c, st) {
  if (st.auto || app.phase !== 'play' || !st.hint) {
    g.pulse = 0;
    return;
  }
  if (st.id === 'demold' && (g.released || g.recap > 0)) {
    g.pulse = 0;
    return;
  }
  const warmup = app.t < 3.5 ? 0.7 : 1.6;
  const idle = Math.min(input.idle, 99);
  if (idle < warmup) {
    g.pulse = 0;
    return;
  }
  const a = clamp((idle - warmup) / 0.5);
  g.pulse = a * (0.5 + 0.5 * Math.sin(app.time * 3.2));
  const h = st.hint(view, g);
  if (!h || !h.pts || h.pts.length < 2) return;

  const period = h.slow ? 3.0 : 2.3;
  const u = (app.time % period) / period;
  const move = clamp(u / 0.72);
  const e = h.circle ? u : smooth(move);
  const idx = Math.min(h.pts.length - 1, Math.floor(e * (h.pts.length - 1)));
  const frac = e * (h.pts.length - 1) - idx;
  const p0 = h.pts[idx];
  const p1 = h.pts[Math.min(h.pts.length - 1, idx + 1)];
  const hx = lerp(p0[0], p1[0], frac);
  const hy = lerp(p0[1], p1[1], frac);

  A.guideArrow(c, h.pts, app.time * 46, a * 0.85);
  // 出発点のパルス
  const pr = 22 + 10 * (0.5 + 0.5 * Math.sin(app.time * 3.4));
  c.save();
  c.globalAlpha = a * 0.5;
  c.beginPath();
  c.arc(h.pts[0][0], h.pts[0][1], pr, 0, TAU);
  c.lineWidth = 5;
  c.strokeStyle = 'rgba(255,255,255,0.9)';
  c.stroke();
  c.restore();
  A.handIcon(c, hx, hy + 14, 1.15, 0, a);
}

// --- UI ---------------------------------------------------------------------
function iconButton(c, x, y, r, draw, tint = '#ff8a5c') {
  c.save();
  c.translate(x, y);
  c.beginPath();
  c.arc(0, 0, r, 0, TAU);
  const grd = c.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.05, 0, 0, r * 1.05);
  grd.addColorStop(0, 'rgba(255,255,255,0.55)');
  grd.addColorStop(0.32, tint);
  grd.addColorStop(1, '#c9401f');
  c.fillStyle = grd;
  c.shadowColor = 'rgba(90,50,15,0.35)';
  c.shadowBlur = 14;
  c.shadowOffsetY = 4;
  c.fill();
  c.shadowColor = 'transparent';
  c.lineWidth = 3;
  c.strokeStyle = 'rgba(255,255,255,0.8)';
  c.stroke();
  draw(c, r);
  c.restore();
}

function drawUI(c, st) {
  drawMuteButton(c);
  if (st.id !== 'reveal') return;
  const ins = safeInsets();
  const pulse = 0.5 + 0.5 * Math.sin(app.time * 2.6);
  const R = Math.min(52, Math.min(view.w, view.h) * 0.14);
  // 縦画面は下中央、横画面は右下（どちらでもプリンに指がかからない場所）
  const bottom = view.h - ins.bottom - (view.portrait ? 76 : 60);
  const centerX = view.portrait ? view.w * 0.5 : view.w - R * 1.35;

  // もう一度「型をぬく」
  const bx = view.portrait ? centerX + R * 0.9 : centerX;
  iconButton(
    c,
    bx,
    bottom,
    R * (1 + pulse * 0.03),
    (cc, r) => {
      const s = r / 52;
      cc.save();
      cc.scale(s, s);
      // 型（台形）を上へ持ち上げる、を表すアイコン
      cc.beginPath();
      cc.moveTo(-21, 26);
      cc.lineTo(-15, 4);
      cc.lineTo(15, 4);
      cc.lineTo(21, 26);
      cc.closePath();
      cc.fillStyle = 'rgba(255,255,255,0.97)';
      cc.fill();
      cc.beginPath();
      cc.moveTo(0, -30);
      cc.lineTo(14, -12);
      cc.lineTo(6, -12);
      cc.lineTo(6, -2);
      cc.lineTo(-6, -2);
      cc.lineTo(-6, -12);
      cc.lineTo(-14, -12);
      cc.closePath();
      cc.fillStyle = '#fff2cf';
      cc.fill();
      cc.restore();
    },
    '#ffa04d'
  );
  app.buttons.push({ x: bx, y: bottom, r: R, action: replayDemold });

  // 最初から
  const sr = R * 0.68;
  const sx = view.portrait ? centerX - R * 1.25 : centerX - R - sr - 14;
  iconButton(
    c,
    sx,
    bottom,
    sr,
    (cc, r) => {
      const s = r / 36;
      cc.save();
      cc.scale(s, s);
      cc.beginPath();
      cc.arc(0, 0, 14, 0.6, TAU * 0.86);
      cc.lineWidth = 6;
      cc.lineCap = 'round';
      cc.strokeStyle = 'rgba(255,255,255,0.95)';
      cc.stroke();
      cc.beginPath();
      cc.moveTo(14, -12);
      cc.lineTo(18, 2);
      cc.lineTo(4, -2);
      cc.closePath();
      cc.fillStyle = 'rgba(255,255,255,0.95)';
      cc.fill();
      cc.restore();
    },
    '#7fc4e8'
  );
  app.buttons.push({ x: sx, y: bottom, r: sr, action: restartAll });
}

function drawMuteButton(c) {
  const ins = safeInsets();
  const x = view.w - 30 - ins.top * 0.2;
  const y = 30 + ins.top;
  const r = 17;
  c.save();
  c.globalAlpha = 0.55;
  c.beginPath();
  c.arc(x, y, r, 0, TAU);
  c.fillStyle = 'rgba(255,255,255,0.75)';
  c.fill();
  c.beginPath();
  c.moveTo(x - 7, y - 3);
  c.lineTo(x - 3, y - 3);
  c.lineTo(x + 2, y - 8);
  c.lineTo(x + 2, y + 8);
  c.lineTo(x - 3, y + 3);
  c.lineTo(x - 7, y + 3);
  c.closePath();
  c.fillStyle = '#7b5230';
  c.fill();
  if (isMuted()) {
    c.beginPath();
    c.moveTo(x - 9, y - 9);
    c.lineTo(x + 9, y + 9);
    c.lineWidth = 3;
    c.strokeStyle = '#c0392b';
    c.stroke();
  } else {
    c.beginPath();
    c.arc(x + 4, y, 6, -0.9, 0.9);
    c.lineWidth = 2.5;
    c.strokeStyle = '#7b5230';
    c.stroke();
  }
  c.restore();
  app.buttons.push({
    x,
    y,
    r,
    action: () => {
      setMuted(!isMuted());
      if (!isMuted()) sfx.tap();
    },
  });
}

// --- 起動 -------------------------------------------------------------------
view.resize(FAST);
view.snapToTarget();
view.recompute();
requestAnimationFrame(frame);

window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    view.resize(FAST);
    A.clearGradientCache();
    if (app.mode === 'play') applyCamera(true);
  }, 120);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopAllLoops();
});

// --- E2E / デバッグ用フック --------------------------------------------------
window.__game = {
  app,
  g,
  view,
  input,
  hero,
  gov,
  STAGES,
  STAGE_INDEX,
  start() {
    initAudio();
    app.mode = 'play';
    resetGame();
  },
  jump(id) {
    if (app.mode !== 'play') this.start();
    gotoStage(STAGE_INDEX[id], true);
  },
  stageId: () => STAGES[app.stage].id,
  complete() {
    // 現在のステージのジェスチャを一気に満たす（自動プレイ検証用）
    const gs = g.gesture;
    if (!gs) return;
    if (gs.dist != null) gs.acc = gs.dist;
    else if (gs.need != null) gs.acc = gs.need;
    else if (gs.dur != null) gs.acc = gs.dur;
  },
};

</script>
