<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>The Mystery Animal — a word-morphing 3D picture book</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", Verdana, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  /* sentence bar */
  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    max-width: 94vw; padding: 10px 18px; border-radius: 22px;
    background: rgba(255,255,255,0.82); box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    font-size: clamp(13px, 2.4vw, 21px); line-height: 1.5; text-align: center; z-index: 5; }
  #bar span { margin: 0 3px; color: #b9c3cc; font-weight: 700; transition: all .3s; display: inline-block; }
  #bar span.done { color: #5b6b78; }
  #bar span.now { color: #ff7b1a; transform: scale(1.28); text-shadow: 0 2px 0 rgba(255,180,80,.35); }

  /* tap hint */
  #hint { position: fixed; right: 20px; bottom: 74px; z-index: 5;
    background: #ffce3c; color: #6b4a00; font-weight: 900; font-size: clamp(15px, 2.6vw, 22px);
    padding: 10px 20px; border-radius: 999px; box-shadow: 0 4px 0 #d9a41a;
    animation: bounce 1s infinite; pointer-events: none; }
  #hint.hidden { display: none; }
  @keyframes bounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }

  /* title card */
  #title { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.94), rgba(190,230,255,.94));
    transition: opacity .5s; }
  #title.gone { opacity: 0; pointer-events: none; }
  #title h1 { margin: 0; font-size: clamp(30px, 6.5vw, 62px); color: #ff7b1a;
    text-shadow: 0 3px 0 #fff, 0 6px 0 rgba(0,0,0,.08); }
  #title p { margin: 0; font-size: clamp(15px, 2.8vw, 24px); color: #5b6b78; font-weight: 700; }
  #title .tap { margin-top: 14px; background: #ff7b1a; color: #fff; font-weight: 900;
    font-size: clamp(17px, 3vw, 26px); padding: 13px 34px; border-radius: 999px;
    box-shadow: 0 5px 0 #cc5e0e; animation: bounce 1s infinite; }

  /* replay */
  #replay { position: fixed; right: 20px; bottom: 74px; z-index: 6; display: none;
    background: #1dd1a1; color: #fff; border: none; font-family: inherit; font-weight: 900;
    font-size: clamp(15px, 2.6vw, 22px); padding: 12px 24px; border-radius: 999px;
    box-shadow: 0 4px 0 #12a37c; cursor: pointer; }
  #replay.show { display: block; animation: bounce 1.2s infinite; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div id="hint">TAP! ▶</div>
<button id="replay">↻ AGAIN!</button>
<div id="title">
  <h1>The Mystery Animal</h1>
  <p>Watch every word turn into something fun!</p>
  <div class="tap">TAP TO START ▶</div>
</div>
<script>
/*THREE_JS*/
</script>
<script>
/*APP_JS*/
</script>
</body>
</html>
